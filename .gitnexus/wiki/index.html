es) |\n| Generator | Aspen.3D 23.2 |\n\n**Structure breakdown:**\n\n- **JSON chunk**: Contains the glTF scene graph with one mesh, one node, and one scene\n- **BIN chunk**: Contains vertex positions (VEC3), texture coordinates (VEC2), normals (VEC3), and indices\n\n**Use cases:**\n- Testing glTF/glb parser implementations\n- Validating binary buffer reading and chunk parsing\n- Testing 3D asset loading pipelines\n\n### key.json\n\nA JSON array containing 64 bytes of data represented as integers (0-255 range).\n\n```json\n[196, 167, 246, 133, 208, 120, 170, 18, ...]\n```\n\n**Use cases:**\n- Testing encryption/decryption routines\n- Validating byte array serialization\n- Testing key derivation or hashing functions\n\n### plugins.json and plugins-updated.json\n\nA pair of JSON files representing a plugin configuration before and after an update operation.\n\n**plugins.json (original):**\n```json\n[\n  {\n    \"type\": \"Attributes\",\n    \"authority\": { \"type\": \"UpdateAuthority\" },\n    \"attributeList\": [\n      { \"key\": \"Background\", \"value\": \"Blue\" }\n    ]\n  }\n]\n```\n\n**plugins-updated.json (updated):**\n```json\n[\n  {\n    \"type\": \"Attributes\",\n    \"authority\": { \"type\": \"UpdateAuthority\" },\n    \"attributeList\": [\n      { \"key\": \"Background\", \"value\": \"Red\" },\n      { \"key\": \"Rarity\", \"value\": \"Legendary\" }\n    ]\n  }\n]\n```\n\n**Use cases:**\n- Testing JSON patch/diff operations\n- Validating plugin configuration merging\n- Testing update/upgrade workflows\n\n## File Relationships\n\n```mermaid\ngraph LR\n    plugins.json -->|update transforms to| plugins-updated.json\n    key.json -->|used in| encryption_tests\n    3d.glb -->|parsed by| gltf_parser\n```\n\n## Integration Notes\n\nThese test files are loaded as static resources. No runtime generation or modification occurs. Tests that consume these files should:\n\n1. Read files from the module's resource path\n2. Use binary mode for `3d.glb` and `key.json`\n3. Parse JSON files with appropriate error handling for `plugins*.json`\n\n## Adding New Test Files\n\nWhen adding new test fixtures to this module:\n\n1. Choose a descriptive filename indicating the file's purpose\n2. For JSON files, ensure valid, formatted output\n3. For binary files, document the format and structure in code comments\n4. Update this documentation with the new file's details","other-test-lib":"# Other — test-lib\n\n# deserializeInstruction Test Suite\n\n## Overview\n\nThis test module (`test/lib/deserializeInstruction.test.ts`) validates the `serializeInstruction` and `deserializeInstruction` functions located in `src/lib/execute/deserializeInstruction.js`. These functions handle binary encoding and decoding of Solana instructions for transmission or storage.\n\n## What is Being Tested\n\nThe test suite verifies roundtrip serialization/deserialization of Solana `Instruction` objects. A successful roundtrip means:\n\n```\nInstruction → serializeInstruction → Base64 string → deserializeInstruction → Instruction\n```\n\nThe deserialized instruction must match the original exactly.\n\n## Test Cases\n\n### 1. Simple Instruction (No Accounts, No Data)\n\nTests the minimal instruction structure:\n\n```typescript\n{\n    programId: SYSTEM_PROGRAM,\n    keys: [],\n    data: new Uint8Array(0),\n}\n```\n\nThis verifies the serialization format handles empty collections correctly.\n\n### 2. Instruction with Accounts and Data\n\nTests a fully populated instruction with:\n- Two accounts with different permissions\n- Non-empty byte data\n\nVerifies that account metadata (pubkey, isSigner, isWritable) and arbitrary byte data are preserved exactly.\n\n### 3. Signer-Only (Non-Writable) Account\n\nTests an account where `isSigner: true` but `isWritable: false`. This is common for authority accounts that must sign but cannot be modified.\n\n### 4. Writable Non-Signer Account\n\nTests an account where `isSigner: false` but `isWritable: true`. This represents data accounts that can be modified but don't require a signature.\n\n### 5. Error: Data Too Short\n\nVerifies that deserialization throws an appropriate error when the encoded data is truncated and cannot contain a valid instruction.\n\n### 6. Error: Truncated Account Data\n\nTests the boundary case where the account count indicates accounts exist, but the data ends before all account metadata is read. The error message should indicate \"Unexpected end of data\".\n\n## Serialization Format\n\nBased on the test cases, the binary format appears to be:\n\n| Field | Size | Description |\n|-------|------|-------------|\n| Program ID | 32 bytes | Public key of the program |\n| Account count | 2 bytes (LE) | Number of accounts |\n| Accounts | Variable | For each account: 32-byte pubkey + 1 byte flags |\n| Data length | 4 bytes (LE) | Size of instruction data |\n| Data | Variable | Raw byte array |\n\nThe serialized output is encoded as Base64.\n\n## Relationship to Source Module\n\nThe tested functions live in `src/lib/execute/deserializeInstruction.js`. This test file is the contract that defines expected behavior for those functions. When modifying the serialization format, update these tests accordingly.\n\n## Running the Tests\n\n```bash\nnpm test -- --grep \"deserializeInstruction\"\n```\n\nOr run the specific file:\n\n```bash\nnpx mocha test/lib/deserializeInstruction.test.ts\n```","other-test":"# Other — test\n\n# Test Utilities Module\n\nThis module (`test/`) provides shared utilities for integration testing the CLI application. It contains helpers for spawning CLI processes, simulating user input, and generating blockchain explorer links.\n\n## Overview\n\nThe test utilities serve three main purposes:\n\n1. **Process Execution** — Spawn the CLI as a child process with configurable arguments\n2. **Input Simulation** — Simulate keyboard interactions for interactive CLI tests\n3. **Result Validation** — Parse CLI output and generate explorer links for transaction verification\n\n## Constants\n\n### `CLI_PATH`\n\n```typescript\nexport const CLI_PATH = join(process.cwd(), 'bin', 'run.js')\n```\n\nPath to the CLI entry point. Assumes the CLI has been built to `bin/run.js` in the project root.\n\n### `TEST_RPC`\n\n```typescript\nexport const TEST_RPC = 'http://127.0.0.1:8899'\n```\n\nRPC endpoint for test transactions. Points to a local Solana test validator running on port 8899.\n\n### `KEYPAIR_PATH`\n\n```typescript\nexport const KEYPAIR_PATH = join(process.cwd(), 'test-files', 'key.json')\n```\n\nPath to the test wallet keypair JSON file used for signing transactions.\n\n## runCli Function\n\n```typescript\nexport const runCli = (args: string[], stdin?: string[]): Promise<{ stdout: string; stderr: string; code: number }>\n```\n\nSpawns the CLI as a child process with the specified arguments and optional stdin input.\n\n### Parameters\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `args` | `string[]` | Command-line arguments to pass to the CLI |\n| `stdin` | `string[]` (optional) | Array of strings to write to stdin, one per `write()` call |\n\n### Returns\n\nA promise that resolves with an object containing:\n- `stdout`: Complete stdout output from the process\n- `stderr`: Complete stderr output from the process\n- `code`: Exit code (always `0` on success, rejected promise on failure)\n\n### Behavior\n\n- Automatically appends `-r TEST_RPC` and `-k KEYPAIR_PATH` to all commands\n- Rejects the promise if the process exits with a non-zero code, including stdout/stderr in the error message\n- If `stdin` is provided, writes each string to stdin sequentially, then closes the stream\n\n### Example Usage\n\n```typescript\n// Simple command\nconst result = await runCli(['balance', 'my-address'])\n\n// Command requiring stdin input (e.g., confirmation prompts)\nawait runCli(['transfer', 'recipient-address', '1'], ['y\\n'])\n\n// Access output\ntry {\n    const { stdout, stderr } = await runCli(['some-command'])\n    expect(stdout).toContain('expected output')\n} catch (err) {\n    // Handle CLI failure\n}\n```\n\n## IO Utilities\n\nKeyboard input simulation for testing interactive CLI prompts:\n\n```typescript\nexport const io = {\n    up: '\\x1B\\x5B\\x41',      // Arrow Up\n    down: '\\x1B\\x5B\\x42',    // Arrow Down\n    enter: '\\x0D',          // Enter/Return\n    space: '\\x20'           // Spacebar\n}\n```\n\nThese are raw ANSI escape sequences. Use them when testing CLI menus or prompts that require keyboard navigation:\n\n```typescript\nawait runCli(['interactive-command'], [io.down, io.enter])\n```\n\n## Explorer Link Helpers\n\nGenerate direct links to view transactions and accounts on blockchain explorers.\n\n### LinkType Enum\n\n```typescript\nexport enum LinkType {\n    Transaction = 'transaction',\n    Account = 'account'\n}\n```\n\n### explorerLink Function\n\n```typescript\nexport const explorerLink = (explorerPlatform: Explorer, type: LinkType, id: string): string\n```\n\nGenerates a URL for viewing a transaction or account on a supported explorer.\n\n#### Parameters\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `explorerPlatform` | `Explorer` | Which explorer to use: `'solanaExplorer'`, `'solscan'`, `'solanaFm'`, or `'core'` |\n| `type` | `LinkType` | Either `LinkType.Transaction` or `LinkType.Account` |\n| `id` | `string` | The transaction signature or account address |\n\n#### Returns\n\nA fully-formed URL string.\n\n#### Example\n\n```typescript\nimport { explorerLink, LinkType } from './utils'\n\n// Generate transaction link\nconst txLink = explorerLink('solscan', LinkType.Transaction, 'abc123...')\n// Returns: 'https://solscan.io/tx/abc123...'\n\n// Generate account link\nconst accountLink = explorerLink('core', LinkType.Account, 'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA')\n// Returns: 'https://core.app/address/TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'\n```\n\n## extractAssetId Function\n\n```typescript\nexport const extractAssetId = (str: string): string | null\n```\n\nParses CLI output to extract an asset ID from strings formatted as `Asset: <id>`.\n\n#### Parameters\n\n| Parameter | Type | Description |\n|-----------|------|-------------|\n| `str` | `string` | String to parse |\n\n#### Returns\n\nThe extracted asset ID, or `null` if not found.\n\n#### Example\n\n```typescript\nconst output = 'Minted new token!\\nAsset: MyToken123'\nconst assetId = extractAssetId(output)\n// Returns: 'MyToken123'\n```\n\n## Integration Notes\n\n### Test Setup Requirements\n\nBefore running tests that use these utilities:\n\n1. **Build the CLI** — Ensure `bin/run.js` exists (run `npm run build` or equivalent)\n2. **Start local validator** — The test RPC (`127.0.0.1:8899`) must be running (e.g., `solana-test-validator`)\n3. **Provide test keypair** — Place a funded keypair JSON at `test-files/key.json`\n\n### Common Test Patterns\n\n```typescript\nimport { runCli } from './runCli'\nimport { explorerLink, LinkType, io } from './utils'\n\ndescribe('CLI integration tests', () => {\n    it('executes a command and returns output', async () => {\n        const { stdout } = await runCli(['some-command'])\n        expect(stdout).toContain('Expected output')\n    })\n\n    it('handles interactive prompts', async () => {\n        await runCli(['confirm-action'], [io.enter])\n    })\n\n    it('generates explorer links for transactions', () => {\n        const link = explorerLink('solscan', LinkType.Transaction, 'sig123')\n        expect(link).toBe('https://solscan.io/tx/sig123')\n    })\n})\n```","other-tools-codeql":"# Other — tools-codeql\n\n# CodeQL Launcher Script\n\n## Overview\n\nThis script (`tools/codeql`) is the entry point for running CodeQL. It acts as a bootstrapper that:\n\n1. Detects the operating system platform\n2. Locates the CodeQL distribution directory\n3. Handles platform-specific setup (especially macOS security features)\n4. Configures the Java runtime environment\n5. Launches the actual CodeQL CLI implemented in Java\n\nThe script is designed to work whether invoked directly, through a symlink, or via a symlink farm—making it flexible for different installation methods.\n\n---\n\n## Environment Variables\n\n### Input Variables (Used by the Script)\n\n| Variable | Description |\n|----------|-------------|\n| `CODEQL_PLATFORM` | Override automatic platform detection. Valid values: `linux64`, `osx64`, `win64` |\n| `CODEQL_DIST` | Override automatic distribution directory discovery. Should point to the root of a CodeQL distribution |\n| `CODEQL_JAVA_HOME` | Override the Java runtime used to launch CodeQL |\n| `CODEQL_ISATTY` | Set internally based on whether stderr is a TTY |\n\n### Output Variables (Set by the Script)\n\n| Variable | Description |\n|----------|-------------|\n| `CODEQL_DIST` | The resolved CodeQL distribution directory path |\n| `CODEQL_PLATFORM` | The detected or specified platform |\n| `CODEQL_ISATTY` | Set to `stderr` if stderr is a terminal, unset otherwise |\n\n---\n\n## Platform Detection\n\nThe script automatically detects the platform when `CODEQL_PLATFORM` is not set:\n\n```mermaid\nflowchart TD\n    A[Start] --> B{CODEQL_PLATFORM set?}\n    B -->|Yes| C[Use provided value]\n    B -->|No| D{uname -s}\n    D -->|*Linux*| E[linux64]\n    D -->|*Darwin*| F[osx64]\n    D -->|*MINGW* or *MSYS*| G[win64]\n    D -->|Other| H[Error: Unknown OS]\n```\n\nThe platform determines:\n- Which Java runtime directory to use (`tools/linux64/java`, `tools/osx64/java`, etc.)\n- Whether macOS-specific security handling is applied\n\n---\n\n## Distribution Directory Discovery\n\nThe script locates the CodeQL distribution by following symlinks from `$0` (the script's own path) until it finds a directory containing `tools/codeql.jar`.\n\n### Discovery Logic\n\n1. **Trust override**: If `CODEQL_DIST` is already set and contains both `codeql` and `tools/codeql.jar`, use it directly (avoiding expensive symlink traversal)\n\n2. **Symlink following**: Otherwise, starting from `$0`:\n   - Read the symlink target\n   - Resolve relative paths correctly (relative to the symlink's directory)\n   - Repeat until `tools/codeql.jar` is found\n   - Use `pwd` (with `-W` flag on Windows) to get the canonical path\n\n3. **Error handling**: If no `codeql.jar` is found after following all symlinks, exit with an error\n\nThis design supports:\n- Direct invocation: `./codeql` from the distribution directory\n- User symlinks: Users creating their own symlinks in `$PATH`\n- Symlink farms: Automated deployment via symlink replication\n\n---\n\n## macOS-Specific Handling\n\nWhen running on macOS (`CODEQL_PLATFORM=osx64`), the script performs additional setup:\n\n### Downloads Directory Restriction\n\nCodeQL cannot run from within `~/Downloads` due to macOS security restrictions. The script checks if `CODEQL_DIST` starts with `$HOME/Downloads` and exits with a clear error message if so.\n\n### Quarantine Attribute Removal\n\nmacOS marks files downloaded from the internet with quarantine attributes (via `xattr`). These attributes can interfere with CodeQL's operation. The script:\n\n1. Checks if the distribution and `codeql` binary are writable\n2. Uses macOS-specific tools (`/usr/bin/xattr`, `/usr/bin/find`, `/usr/bin/xargs`) rather than GNU versions\n3. Removes extended attributes from:\n   - All executables in `osx64/` or `macos/` subdirectories\n   - The `codeql` script itself\n4. Makes the `codeql` script read-only (`chmod a-w`) to prevent modification\n\n---\n\n## JVM Argument Processing\n\nThe script intercepts `-J` arguments and passes them to the JVM instead of the CodeQL CLI:\n\n| Input | JVM Argument |\n|-------|--------------|\n| `-J` (next arg) | Next argument as-is |\n| `-J=value` | `value` (without `-J=`) |\n| `-Jvalue` | `value` (without `-J`) |\n\nAll other arguments (including `--`) are passed to the CodeQL CLI unchanged.\n\nExample:\n```bash\ncodeql -J-Xmx4g query --help\n# Becomes: java -Xmx4g com.semmle.cli2.CodeQL query --help\n```\n\n---\n\n## Java Home Selection\n\nThe script determines which Java runtime to use based on architecture:\n\n```mermaid\nflowchart TD\n    A[Determine Java Home] --> B{CODEQL_JAVA_HOME set?}\n    B -->|Yes| C[Use CODEQL_JAVA_HOME]\n    B -->|No| D{CODEQL_PLATFORM = osx64?}\n    D -->|Yes| E{arch = arm64?}\n    D -->|No| F[tools/$PLATFORM/java]\n    E -->|Yes| G[tools/osx64/java-aarch64]\n    E -->|No| F\n```\n\nThe resolved Java home must contain `bin/java`.\n\n---\n\n## Chainfile Mechanism\n\nCodeQL uses a \"chainfile\" mechanism for deferred operations that need to run after the JVM terminates:\n\n1. **Creation**: A temporary file is created via `mktemp`\n2. **Passing**: The path is passed to the JVM via `-Dcodeql.chainer.v2=$chainfile`\n3. **Execution**: After the JVM exits with code 70 (indicating chainable work), the script sources the chainfile\n4. **Continuation**: If the sourced script sets `CODEQL_CHAIN_NOW=yes`, the loop continues; otherwise, an error occurs\n\nThis allows CodeQL to schedule additional work that must occur in a fresh process context.\n\n---\n\n## Exit Codes\n\n| Code | Meaning |\n|------|---------|\n| 3 | Launcher failure (invalid platform, cannot locate distribution) |\n| 70 | Chainfile available (deferred work to perform) |\n| 100 | Chainfile error (partially written) |\n| Other | Exit code from the CodeQL Java process |\n\n---\n\n## Usage\n\nThe script is typically invoked indirectly through the `codeql` command:\n\n```bash\n# Run a query\ncodeql query create --language=javascript --output=my-db\ncodeql query run --database=my-db my-query.ql\n\n# Get help\ncodeql --help\n\n# Use JVM options\ncodeql -J-Xmx8g -J-XX:+UseG1GC query run --database=my-db my-query.ql\n```\n\nThe script handles all the bootstrapping so users don't need to invoke Java directly or set environment variables manually.","other-tsconfig-build-json":"# Other — tsconfig.build.json\n\n# tsconfig.build.json\n\n## Overview\n\n`tsconfig.build.json` is the TypeScript compiler configuration used for production builds. It extends the base `tsconfig.json` and applies build-specific settings that optimize the compiled output for distribution.\n\n## Purpose\n\nThis configuration file tells the TypeScript compiler (`tsc`) how to transform source code in `src/` into compiled JavaScript in `dist/`. It's specifically designed for the build process, excluding test files and configuring output paths for production use.\n\n## Configuration Breakdown\n\n### Extension\n\n```json\n\"extends\": \"./tsconfig.json\"\n```\n\nInherits all settings from the base configuration. This ensures consistency between development and build compilation while allowing build-specific overrides.\n\n### Exclusions\n\n```json\n\"exclude\": [\"test/**/*\"]\n```\n\nExcludes all test files from the build output. Test files are not needed in production and excluding them:\n- Reduces final bundle size\n- Prevents accidental inclusion of test utilities\n- Speeds up the build process\n\n### Compiler Options\n\n| Option | Value | Purpose |\n|--------|-------|---------|\n| `rootDir` | `\"src\"` | Specifies the root directory of source files |\n| `outDir` | `\"dist\"` | Specifies where compiled output is written |\n| `baseUrl` | `\".\"` | Sets the base URL for module resolution |\n| `paths` | `{\"*\": [\"src/*\"]}` | Maps module aliases to source paths |\n| `resolveJsonModule` | `true` | Allows importing `.json` files as modules |\n| `isolatedModules` | `true` | Ensures each file can be compiled independently |\n\n## Build Pipeline\n\n```mermaid\nflowchart LR\n    A[src/] --> B[tsconfig.build.json]\n    B --> C[tsc compiler]\n    C --> D[dist/]\n    \n    style A fill:#e1f5fe\n    style B fill:#fff3e0\n    style D fill:#e8f5e9\n```\n\n## Usage\n\nThis configuration is invoked during the build process, typically via npm scripts:\n\n```bash\n# Run a production build\nnpm run build\n\n# Which internally executes:\ntsc -p tsconfig.build.json\n```\n\nThe compiled output in `dist/` is what gets published to npm or deployed to production environments.\n\n## Key Differences from tsconfig.json\n\n| Setting | tsconfig.json (dev) | tsconfig.build.json (build) |\n|---------|--------------------|---------------------------|\n| Test files | Included | Excluded |\n| Output directory | N/A (in-memory) | `dist/` |\n| Module resolution | May allow loose settings | Strict (`isolatedModules`) |\n\n## Module Path Resolution\n\nThe `paths` configuration:\n\n```json\n\"paths\": {\n  \"*\": [\"src/*\"]\n}\n```\n\nEnsures that any bare module imports resolve to the `src/` directory. This is critical for monorepo setups or projects with internal package aliases, ensuring the build uses the correct source files.","other-tsconfig-json":"# Other — tsconfig.json\n\n# tsconfig.json — TypeScript Configuration\n\nThis file configures the TypeScript compiler for the project. It defines how TypeScript source files are compiled, what output format is generated, and what type-checking rules are enforced.\n\n## Overview\n\nThe configuration targets **Node.js** with **ES2022** as the JavaScript output version. It uses strict type checking, generates declaration files for type consumers, and outputs compiled JavaScript to a `dist` directory.\n\n## Compiler Options\n\n### Module System\n\n| Option | Value | Effect |\n|--------|-------|--------|\n| `module` | `Node16` | Outputs ES modules compatible with Node.js 16+ |\n| `moduleResolution` | `node16` | Uses Node.js 16's native module resolution algorithm |\n| `target` | `es2022` | Compiles to ES2022 JavaScript syntax |\n\nThis setup produces modern ES modules that work natively in Node.js without requiring bundlers. The `Node16` module format corresponds to the `exports` field in `package.json` and native ESM support.\n\n### Type Checking\n\n| Option | Value | Effect |\n|--------|-------|--------|\n| `strict` | `true` | Enables all strict type-checking options |\n| `skipLibCheck` | `true` | Skips type checking of `@types` and declaration files |\n| `declaration` | `true` | Generates `.d.ts` files alongside compiled output |\n\nThe `strict: true` setting enables options like `noImplicitAny`, `strictNullChecks`, `strictPropertyInitialization`, and others. This enforces rigorous type safety throughout the codebase.\n\nSetting `skipLibCheck: true` improves build performance by skipping type validation of third-party type definitions, which is safe because those files are typically already validated by their maintainers.\n\n### Interoperability\n\n| Option | Value | Effect |\n|--------|-------|--------|\n| `esModuleInterop` | `true` | Allows default imports from CommonJS modules |\n| `allowSyntheticDefaultImports` | `true` | Allows synthetic default exports for modules without them |\n\nThese settings ensure compatibility when importing CommonJS modules (including many npm packages) into an ESM codebase. They prevent workarounds like `import * as foo = require('foo')`.\n\n### Output Configuration\n\n| Option | Value | Effect |\n|--------|-------|--------|\n| `outDir` | `dist` | Compiled JavaScript output directory |\n| `rootDir` | `src` | Source root directory |\n| `composite` | `true` | Enables project references for incremental builds |\n\nThe `composite: true` option marks this as a referenceable project for TypeScript project references, enabling faster incremental builds when using monorepo structures or multi-package setups.\n\n## File Inclusion\n\n```json\n\"include\": [\"./src/**/*\"]\n```\n\nAll TypeScript files (`.ts`, `.tsx`) within the `src` directory and its subdirectories are included in compilation. Files outside `src` (such as tests in `__tests__` or test fixtures) are excluded unless explicitly added to `include` or referenced separately.\n\n## ts-node Configuration\n\n```json\n\"ts-node\": {\n  \"esm\": true\n}\n```\n\nThis configures [ts-node](https://typestrong.org/ts-node/) to run TypeScript files directly in an ESM-compatible manner. When using `ts-node` to execute source files (useful during development), it will treat them as ES modules rather than CommonJS.\n\n## Build Output\n\nGiven this configuration, running `tsc` produces:\n\n```\nsrc/\n  └── (your source files)\ndist/\n  └── (compiled .js files)\n  └── (generated .d.ts files)\n```\n\nThe directory structure under `dist` mirrors the structure under `src`, since `rootDir` is set to `src`.\n\n## Implications for Developers\n\n- **All code must pass strict type checking** — expect compile errors for implicit `any` types, unhandled null values, and similar issues\n- **ESM-only output** — the compiled code uses `import`/`export` syntax; CommonJS `require()` is not used\n- **Declaration files are generated** — other projects can consume this package's types directly\n- **Node.js 16+ required** — the runtime must support ES2022 features and native ESM","overview":"# metaplex-cli — Wiki\n\n# Metaplex CLI\n\nA powerful command-line interface for interacting with the Metaplex ecosystem on Solana. This CLI provides tools for managing digital assets, collections, tokens, candy machines, and more.\n\n> **Beta Notice**: This CLI is in public beta. Commands and functionality may change daily as updates are implemented.\n\n## What You Can Do With This CLI\n\n- **Create and manage NFTs** — Mint standard NFTs, compressed NFTs (via Bubblegum), and Core NFTs\n- **Deploy Candy Machines** — Set up automated NFT sales with customizable guard conditions\n- **Manage Collections** — Create and organize asset collections on-chain\n- **Handle Token Operations** — Work with SPL tokens and token accounts\n- **Launch Token Projects** — Use the Genesis system for token launches with LaunchPool or Bonding Curve models\n- **Distribute Assets** — Handle airdrops and asset distribution workflows\n- **Upload to Decentralized Storage** — Persist images, metadata, and assets to Irys or Turbo\n\n## Architecture Overview\n\nThe CLI is built on [OCLIF](https://oclif.io) and wraps the Metaplex UMI framework. Commands delegate to specialized libraries for blockchain interactions while using shared utilities for configuration, signing, and transaction management.\n\n```mermaid\ngraph TB\n    subgraph \"CLI Layer\"\n        CMDS[Commands<br/>Agents, Bubblegum, CM, Core,<br/>Distribution, Genesis, Metadata,<br/>Toolbox, Config]\n        BASE[Base Command Classes]\n    end\n    \n    subgraph \"Core Libraries\"\n        CTX[Context & Signers]\n        TX[UMI Transaction Utilities]\n        PROMPT[Prompt Utilities]\n    end\n    \n    subgraph \"Feature Libraries\"\n        CM_LIB[Candy Machine Library]\n        GEN[Genesis Library]\n        UPLOAD[Storage & Upload]\n    end\n    \n    subgraph \"Foundation\"\n        UTIL[General Utilities]\n    end\n    \n    CMDS --> BASE\n    CMDS --> CTX\n    CMDS --> TX\n    CMDS --> PROMPT\n    CMDS --> CM_LIB\n    CMDS --> GEN\n    CMDS --> UPLOAD\n    BASE --> CTX\n    CTX --> UTIL\n    TX --> UTIL\n    PROMPT --> UTIL\n    CM_LIB --> UPLOAD\n    GEN --> TX\n```\n\n## Key Modules\n\n### Command Infrastructure\n\n[Base Command Classes](base-command-classes.md) provides the foundation all commands extend — handling global flags like keypair, RPC URL, and payer configuration.\n\n[Context & Signers](context-signers.md) manages configuration loading and signer resolution, supporting keypair files, Ledger hardware wallets, and asset signers.\n\n### Transaction Layer\n\n[UMI Transaction Utilities](umi-transaction-utilities.md) handles the complete transaction lifecycle: building, sending, confirming, and batching. It also provides asset-signer mode support for MPL Core operations.\n\n### Feature Libraries\n\n- [Candy Machine Library](candy-machine-library.md) — Configuration management, asset caches, and upload workflows for candy machines\n- [Genesis Library](genesis-library.md) — Token launch system supporting LaunchPool and Bonding Curve modes\n- [Core NFT Library](core-nft-library.md) — Operations for MPL Core assets\n- [Distribution Library](distribution-library.md) — Asset distribution and airdrop functionality\n\n### Storage\n\n[Storage & Upload Providers](storage-upload-providers.md) integrates with Irys and Turbo for persisting files to decentralized storage.\n\n### User Interface\n\n[Prompt Utilities](prompt-utilities.md) provides wizard-style workflows that guide users through complex configurations without manual JSON construction.\n\n### Utilities\n\n[General Utilities](general-utilities.md) contains shared helpers for file operations, JSON serialization with BigInt support, validation, and blockchain explorer URLs.\n\n## How a Command Executes\n\nMost commands follow a similar pattern:\n\n1. **Parse** — OCLIF parses flags and arguments into the command handler\n2. **Initialize** — [Base Command Classes](base-command-classes.md) sets up the Umi instance with configuration from [Context & Signers](context-signers.md)\n3. **Prompt** — If needed, [Prompt Utilities](prompt-utilities.md) collects user input via interactive wizards\n4. **Execute** — The command invokes its feature library (Candy Machine, Genesis, etc.)\n5. **Transact** — [UMI Transaction Utilities](umi-transaction-utilities.md) builds, sends, and confirms transactions\n6. **Upload** — Assets flow through [Storage & Upload Providers](storage-upload-providers.md) to decentralized storage\n\nFor example, inserting items into a Candy Machine flows through `insertItems` → `sendAndConfirmInBatches` → `sendAllTransactions`, with progress callbacks to storage uploaders and configurable delays between batches.\n\n## Setup\n\n```bash\n# Install globally\nnpm install -g @metaplex-foundation/cli\n\n# Or run locally\nnpm run mplx -- <command>\n```\n\nCommon commands:\n\n```bash\n# Build the project\nnpm run build\n\n# Run tests\nnpm test\n\n# Lint code\nnpm run lint\nnpm run lint:fix\n```\n\n## Getting Started\n\nIf you're adding a new command, start with [Base Command Classes](base-command-classes.md) to understand the command structure, then look at existing commands in the relevant domain (Candy Machine, Bubblegum, Core NFT, etc.) for patterns to follow.\n\nFor transaction-heavy operations, [UMI Transaction Utilities](umi-transaction-utilities.md) provides reusable patterns for batching, confirmation, and asset-signer workflows.","prompt-utilities":"# Prompt Utilities\n\n# Prompt Utilities Module\n\nThe Prompt Utilities module provides a collection of interactive CLI wizards for creating and configuring blockchain assets on Solana. These prompts use the `@inquirer/prompts` library to gather user input in a structured, validated way, producing data structures that feed into Metaplex Core, Bubblegum, and Token Metadata operations.\n\n## Overview\n\nThis module serves as the user interface layer for the CLI, enabling wizard-style workflows that guide users through complex on-chain configurations without requiring them to construct JSON manually or understand low-level blockchain details.\n\n```mermaid\ngraph TD\n    subgraph \"Asset Creation\"\n        CAP[createAssetPrompt]\n        CBMP[createBubblegumMetadataPrompt]\n        CTMP[createTokenMetadataPrompt]\n        CTP[createTokenPrompt]\n    end\n\n    subgraph \"Plugin System\"\n        PS[pluginSelector]\n        PC[pluginConfigurator]\n    end\n\n    subgraph \"Selection Wizards\"\n        RSP[rpcSelectorPrompt]\n        ESP[explorerSelectorPrompt]\n        STP[selectTreePrompt]\n        WSP[walletSelectPrompt]\n    end\n\n    subgraph \"Agent & Generic\"\n        ADP[agentDocumentPrompt]\n        BPS[booleanPrompt]\n        PRS[promptSelector]\n    end\n\n    CAP --> PS\n    CAP --> PC\n    CBMP --> PS\n    CTMP --> PS\n```\n\n## Core Prompt Functions\n\n### Asset Creation Prompts\n\nThe primary prompts for creating on-chain assets share similar structures but serve different standards:\n\n#### `createAssetPrompt(isCollection?: boolean)`\n\nCreates metadata for Metaplex Core assets or collections. Handles image validation, file path resolution, and plugin attachment.\n\n```typescript\ninterface CreateAssetPromptResult {\n  name: string\n  description: string\n  external_url?: string\n  image: string\n  animation?: string\n  nftType: NftType\n  attributes?: Array<{ trait_type: string; value: string }>\n  collection?: string\n  plugins?: PluginData\n}\n```\n\nKey behaviors:\n- Validates image files exist and have correct extensions (PNG, JPG, GIF)\n- For non-image types (video, audio, 3D models), requires both a preview image and the animation file\n- Supports comma-separated input for attributes\n- Validates collection IDs as Solana public keys\n- Delegates plugin selection to `pluginSelector`\n\n#### `createBubblegumMetadataPrompt(umi: Umi)`\n\nCreates metadata for compressed NFTs (Bubblegum). Includes additional validation to verify the collection exists on-chain.\n\n```typescript\ninterface CreateBubblegumMetadataPromptResult {\n  // ... same as CreateAssetPromptResult\n  collection?: string\n  sellerFeePercentage?: number\n}\n```\n\nKey behaviors:\n- Validates the collection is a real Metaplex Core collection by fetching it via `fetchAsset`\n- Expands `~` in file paths to the user's home directory\n- Validates file paths point to regular files (not directories)\n- Returns a seller fee percentage for royalties\n\n#### `createTokenMetadataPrompt()`\n\nCreates metadata for Token Metadata standard NFTs, including programmable NFTs (pNFTs).\n\n```typescript\ninterface CreateTokenMetadataPromptResult {\n  // ... same as above\n  enforceRoyalties: boolean  // Determines if pnft = true\n  sellerFeePercentage?: number\n}\n```\n\nKey behaviors:\n- The `enforceRoyalties` flag determines whether the NFT becomes a pNFT that blocks non-compliant marketplace transfers\n- Defaults to enforcing royalties (safer for creators)\n\n#### `createTokenPrompt()`\n\nCreates fungible SPL tokens (not NFTs). Simpler than NFT prompts since tokens don't have media files.\n\n```typescript\ninterface TokenWizardInput {\n  name: string\n  symbol: string\n  decimals: number\n  image?: string\n  description: string\n  external_url?: string\n  mintAmount: number\n}\n```\n\nKey behaviors:\n- Validates symbol is 10 characters or less\n- Decimals must be 0-9\n- Mint amount must include decimals (user is prompted with an example)\n\n### Agent Document Prompt\n\n#### `agentDocumentPrompt()`\n\nCreates EIP-8004 compliant agent registration documents for AI agents on Ethereum/agent networks.\n\n```typescript\ninterface AgentRegistrationDocument {\n  type: 'https://eips.ethereum.org/EIPS/eip-8004#registration-v1'\n  name: string\n  description: string\n  image: string\n  services?: AgentService[]\n  active?: boolean\n  registrations?: AgentRegistration[]\n  supportedTrust?: string[]\n}\n```\n\nKey behaviors:\n- Supports multiple service types: Web, A2A, MCP, OASF, DID, Email, or custom\n- Services can include protocol version, skills, and domains\n- Trust models: Reputation, Crypto-economic, TEE Attestation\n- Optional collection membership for organization\n\n## Plugin System\n\nThe plugin system is the most complex part of the prompts module, enabling Metaplex Core's extensible plugin architecture.\n\n### `pluginSelector(options)`\n\nPresents a checkbox interface for selecting one or more plugins compatible with an asset or collection.\n\n```typescript\ninterface PluginSelectorOptions {\n  filter: PluginFilterType.Asset | PluginFilterType.Collection\n  managedBy?: PluginFilterType.Authority | PluginFilterType.Owner\n  type?: 'checkbox' | 'list'\n  message?: string\n}\n```\n\nPlugin categories:\n- **Common**: Usable on both assets and collections (royalties, update, attributes, etc.)\n- **Asset-only**: burn, transfer, freeze, edition\n- **Collection-only**: bubblegumV2, masterEdition\n\nCompatibility validation prevents invalid combinations. For example, `bubblegumV2` only allows: attributes, royalties, update, pFreeze, pTransfer, pBurn.\n\n### `pluginConfigurator(plugins)`\n\nOnce plugins are selected, this prompt walks through configuration for each one:\n\n| Plugin | Configuration Options |\n|--------|----------------------|\n| royalties | basis points, creators with percentages, authority |\n| update | additional delegates, authority |\n| burn / transfer / freeze | authority, frozen state (for freeze) |\n| pBurn / pTransfer / pFreeze | authority (permanent, cannot be reversed) |\n| masterEdition | max supply, name, uri, authority |\n| attributes | key-value pairs to embed on-chain |\n| edition | edition number |\n| verifiedCreators | authority |\n| autograph | authority |\n| immutableMetadata | authority |\n| addBlocker | authority |\n| bubblegumV2 | no configuration needed |\n\n### Plugin Compatibility\n\n```typescript\nexport const validatePluginCompatibility = (selected: Plugin[]): string | null\n```\n\nThis function checks selected plugins against allow-lists and returns an error message if incompatible. Used by `createAssetPrompt` to fail fast before attempting on-chain operations.\n\n## Selection Prompts\n\nThese prompts select from existing on-chain or local resources:\n\n### `rpcSelectorPrompt(endpoints)`\n\n```typescript\ninterface RpcEndpoint {\n  name: string\n  url: string\n}\n```\n\n### `explorerSelectorPrompt(explorers)`\n\n```typescript\ninterface ExplorerEndpoint {\n  displayName: string\n  name: ExplorerType\n  url: string\n}\n```\n\n### `selectTreePrompt(network)`\n\nLists saved Bubblegum trees and allows selection or manual entry. Validates tree addresses have correct Solana address length (32-44 characters). Shows warnings when selecting trees from different networks than the current RPC.\n\n### `walletSelectorPrompt(wallets)`\n\n```typescript\ninterface Wallet {\n  name: string\n  path: string\n  publicKey: string\n}\n```\n\n## Generic Prompts\n\n### `booleanPrompt(message, defaultValue)`\n\nSimple wrapper around `@inquirer/prompts` confirm for yes/no questions.\n\n### `promptSelector(promptItem)`\n\nDynamic prompt that handles multiple data types:\n\n| Type | Behavior |\n|------|----------|\n| `number` | Returns a numeric value |\n| `string` | Free text input |\n| `boolean` | Yes/no confirmation |\n| `publicKey` | Validates Solana address format |\n| `date` | Parses to Unix timestamp |\n| `array` | JSON array with per-item validation |\n\nArrays can contain nested types, with dates automatically converted to timestamps.\n\n```typescript\ninterface PromptItem {\n  prompt: string\n  name: string\n  type: PromptItemType\n  required?: boolean\n  items?: PromptItemType  // For array element types\n  validate?: (value) => boolean | string\n}\n```\n\n## Data Flow\n\nPrompts output structured data that flows to other modules:\n\n1. **Asset prompts** → `PluginData` objects → Metaplex Core SDK `createCollection`/`createAsset` operations\n2. **Bubblegum prompt** → `createTree`/`mint` operations with compression\n3. **Token prompt** → SPL token mint with metadata\n4. **Plugin selectors** → Validate compatibility before passing to SDK\n5. **Tree/wallet selectors** → Provide addresses for subsequent transactions\n\n## Common Patterns\n\n### File Validation\n\nAll prompts handling file paths:\n- Check file existence with `fs.existsSync()`\n- Verify extension matches expected types\n- Some expand `~` to home directory\n- Validate paths point to files, not directories\n\n### Public Key Validation\n\nUsing `@metaplex-foundation/umi`:\n\n```typescript\nimport { isPublicKey } from '@metaplex-foundation/umi'\n\n// Validate user input\nif (!isPublicKey(value)) return 'Invalid public key'\n```\n\n### Iterative Input\n\nFor adding multiple items (attributes, services, creators):\n\n```typescript\nlet continueAdding = true\nwhile (continueAdding) {\n  // Gather input\n  result.items.push(item)\n  continueAdding = await confirm({ message: 'Add another?' })\n}\n```\n\n## Integration Points\n\nThe prompts module depends on:\n- `@inquirer/prompts` - CLI interaction primitives\n- `@metaplex-foundation/umi` - Public key validation\n- `@metaplex-foundation/mpl-core` - Plugin types\n- `node:fs`, `node:path`, `node:os` - File system operations\n\nThe outputs feed into:\n- Metaplex Core SDK (assets, collections, plugins)\n- Bubblegum SDK (compressed NFTs)\n- Token Metadata SDK (pNFTs, regular NFTs)\n- SPL Token operations","storage-upload-providers":"# Storage & Upload Providers\n\n# Storage & Upload Providers\n\nThis module provides file upload functionality to decentralized storage providers for the Metaplex Umi framework. It supports uploading individual files, multiple files in batches, and entire directories.\n\n## Overview\n\nThe uploader module integrates with storage providers like Irys and Turbo to persist files (images, metadata, assets) to decentralized storage. All uploads flow through the Umi framework's uploader interface, which abstracts the specific storage provider.\n\n```mermaid\ngraph TB\n    subgraph \"Public API\"\n        A[uploadFile]\n        B[uploadFiles]\n        C[uploadDirectory]\n    end\n    \n    subgraph \"Storage Providers\"\n        D[Irys]\n        E[Turbo]\n    end\n    \n    F[Umi Framework]\n    \n    A --> F\n    B --> F\n    C --> B\n    F --> D\n    F --> E\n```\n\n## Core Functions\n\n### uploadFile\n\nUploads a single file to storage.\n\n```typescript\nuploadFile(umi: Umi, filePath: string): Promise<UploadFileRessult>\n```\n\n**Parameters:**\n- `umi` - The Umi instance configured with a storage provider\n- `filePath` - Path to the file (supports tilde expansion via `untildify`)\n\n**Returns:**\n```typescript\n{\n  uri: string      // The storage URL of the uploaded file\n  mimeType: string // Detected MIME type of the file\n}\n```\n\n**Behavior:**\n- Expands tilde (`~`) in file paths for cross-platform compatibility\n- Detects MIME type using the `mime` package\n- Wraps the file in Umi's `GenericFile` format with content-type tags\n- Throws on failure with descriptive error message\n\n---\n\n### uploadFiles\n\nUploads multiple files with batch processing and retry logic.\n\n```typescript\nuploadFiles(\n  umi: Umi,\n  filePaths: string[],\n  onProgress?: (progress: number) => void\n): Promise<UploadFileResult[]>\n```\n\n**Parameters:**\n- `umi` - The Umi instance\n- `filePaths` - Array of file paths to upload\n- `onProgress` - Optional callback fired after each file completes (receives current index)\n\n**Returns:**\n```typescript\n{\n  index?: number      // Position in original array\n  fileName: string    // Basename of the uploaded file\n  uri?: string        // Storage URL (undefined on failure)\n  mimeType: string    // Detected MIME type\n}[]\n```\n\n**Key Features:**\n\n| Feature | Value |\n|---------|-------|\n| Batch size | 50 files |\n| Max retries | 3 per file |\n| Backoff strategy | Exponential (`2^retry * 1000ms`) |\n\n**Memory Optimization:**\n- Only one batch (50 files) is in memory at a time\n- Files are read from disk per batch, not all at once\n\n**Retry Logic:**\n- Individual files retry independently\n- A failed file doesn't require re-uploading the entire batch\n- Exponential backoff prevents hammering the network on transient failures\n\n---\n\n### uploadDirectory\n\nUploads all files in a directory.\n\n```typescript\nuploadDirectory(\n  umi: Umi,\n  directory: string,\n  onProgress?: (progress: number) => void\n): Promise<UploadFileResult[]>\n```\n\n**Parameters:**\n- `umi` - The Umi instance\n- `directory` - Path to the directory\n- `onProgress` - Optional progress callback\n\n**Validation:**\n- Throws if the path doesn't exist\n- Throws if the path exists but isn't a directory\n\n**Behavior:**\n- Reads all entries in the directory (non-recursive)\n- Delegates to `uploadFiles` for the actual upload\n- Preserves file order from `fs.readdir`\n\n---\n\n## Storage Providers\n\nThe provider registry in `uploadProviders/index.ts` manages storage backends.\n\n```typescript\nexport const storageProviders = {\n    irys,\n    turbo\n}\n```\n\n### Available Providers\n\n| Provider | Name in Config | Status |\n|----------|----------------|--------|\n| Irys | `irys` | Active |\n| Turbo | `turbo` | Active |\n| Cascade | `cascade` | Commented out |\n\n### Provider Interface\n\n```typescript\ninterface StorageProvider<T = any> {\n    name: 'irys' | 'cascade' | 'turbo'\n    description?: string\n    website?: string\n    params?: {\n        name: string\n        description: string\n        type: string\n        required: boolean\n    }[],\n    umiPlugin: (options?: T) => Promise<UmiPlugin>\n}\n```\n\nEach provider exports a `umiPlugin` function that returns a Umi plugin. Configure Umi with the chosen provider before calling upload functions:\n\n```typescript\nimport { umi } from './your-umi-setup'\nimport { irys } from './lib/uploader/uploadProviders'\n\n// Initialize with Irys\nawait umi.use(await irys.umiPlugin({ /* options */ }))\n```\n\n---\n\n## Error Handling\n\nAll functions throw descriptive `Error` instances:\n\n```typescript\n// uploadFile\nthrow new Error(`File upload failed: ${error.message}`)\n\n// uploadFiles\nthrow new Error(`Upload failed for ${fileName} after 3 retries: ${error.message}`)\n\n// uploadDirectory\nthrow new Error(`Directory does not exist: ${path}`)\nthrow new Error(`Path is not a directory: ${path}`)\nthrow new Error(`Failed to read directory ${path}: ${error.message}`)\n```\n\n---\n\n## Usage Example\n\n```typescript\nimport { createUmi } from '@metaplex-foundation/umi'\nimport uploadFile from './lib/uploader/uploadFile'\nimport uploadDirectory from './lib/uploader/uploadDirectory'\nimport irys from './lib/uploader/uploadProviders/irys'\n\nasync function main() {\n  // Set up Umi with Irys storage\n  const umi = createUmi('https://api.mainnet-beta.solana.com')\n    .use(await irys.umiPlugin({ \n      // provider options \n    }))\n\n  // Upload single file\n  const result = await uploadFile(umi, '~/nfts/image.png')\n  console.log(`Uploaded to: ${result.uri}`)\n\n  // Upload directory with progress\n  const results = await uploadDirectory(\n    umi, \n    './assets',\n    (progress) => console.log(`Uploaded ${progress + 1} files`)\n  )\n  \n  // Results contain URIs for all uploaded files\n  const uris = results.map(r => r.uri)\n}\n```\n\n---\n\n## Integration Notes\n\n- This module is designed to work with the Metaplex Umi framework — you must configure Umi with a storage provider before using these functions\n- The module doesn't handle file filtering or validation; ensure only appropriate files are passed in\n- Directory uploads are non-recursive (one level only)\n- Progress callbacks are approximate — they're called after each file upload completes, not during transfer","umi-transaction-utilities":"# UMI Transaction Utilities\n\n# UMI Transaction Utilities\n\nThis module provides a complete transaction lifecycle management system for the Metaplex UMI framework. It handles building, sending, confirming, and batching transactions with special support for MPL Core asset-signer mode.\n\n## Overview\n\nThe utilities layer transactions on top of UMI's core transaction building:\n\n```\nTransactionBuilder → sendTransaction → confirmTransaction\n                                    ↓\n                            sendAndConfirm (combined)\n                                    ↓\n                    sendAllTransactions (batching)\n                                    ↓\n            sendAllTransactionsAndConfirm (batch + confirm)\n```\n\n## Key Concepts\n\n### Asset Signer Mode\n\nWhen working with MPL Core assets, transactions cannot be signed by a regular wallet. Instead, the asset itself (via its PDA) must sign through the `execute` instruction. This module handles that automatically:\n\n1. The UMI identity is set to a noopSigner (PDA) so instructions build with the PDA as authority\n2. The send layer wraps transactions in `execute()` automatically\n3. The real wallet signs as the execute caller and pays fees\n\n### Confirmation Strategies\n\n- **blockhash**: Send all transactions first, then confirm all (faster throughput)\n- **transactionStatus**: Send and confirm in batches (spreads RPC load, better for rate-limited environments)\n\n## Components\n\n### Transaction Sending\n\n**sendTransaction.ts** sends a single transaction and returns the signature:\n\n```typescript\nconst response = await umiSendTransaction(umi, transactionBuilder, {\n  commitment: 'confirmed',\n  priorityFee: 1000,\n  skipPreflight: false,\n})\n// Returns: { signature, blockhash, err }\n```\n\nKey behaviors:\n- Sets the fee payer to the asset-signer's payer when in asset-signer mode\n- Adds priority fees via `setComputeUnitPrice` when specified\n- Signs with both the built transaction signers and `umi.identity`\n\n### Transaction Confirmation\n\n**confirmTransaction.ts** waits for transaction confirmation with retry logic:\n\n```typescript\nconst result = await umiConfirmTransaction(umi, response, {\n  commitment: 'confirmed',\n})\n// Returns: { confirmed: boolean, error: TransactionError | null }\n```\n\nHandles the \"block height exceeded\" error gracefully by querying transaction status directly.\n\n### Combined Send + Confirm\n\n**sendAndConfirm.ts** provides a one-liner for the full lifecycle:\n\n```typescript\nconst result = await umiSendAndConfirmTransaction(umi, tx, options)\n// Returns: { transaction: UmiTransactionResponse, confirmation: Result }\n```\n\nAutomatically wraps transactions in `execute()` when asset-signer mode is active.\n\n### Batch Operations\n\n**sendAllTransactions.ts** sends multiple transactions sequentially with rate limiting:\n\n```typescript\nconst results = await umiSendAllTransactions(umi, transactions, options, (index, response) => {\n  console.log(`Tx ${index}: ${response.signature}`)\n})\n```\n\nDefaults to 3 transactions per second to avoid RPC rate limits.\n\n**sendAllTransactionsAndConfirm.ts** handles batch sending with two strategies:\n\n```typescript\n// Strategy 1: Send all, then confirm all (better throughput)\nconst results = await umiSendAllTransactionsAndConfirm(umi, txs, {\n  confirmationStrategy: ConfirmationStrategy.blockhash,\n})\n\n// Strategy 2: Send and confirm in batches (better for rate limits)\nconst results = await umiSendAllTransactionsAndConfirm(umi, txs, {\n  confirmationStrategy: ConfirmationStrategy.transactionStatus,\n  batchSize: 10,\n})\n```\n\n### Asset Signer Plugin\n\n**assetSignerPlugin.ts** provides UMI plugin integration:\n\n```typescript\n// Install the plugin with asset-signer state\numi.use(assetSignerPlugin({\n  info: assetSignerInfo,\n  authority: assetOwner,    // Signs execute instruction\n  payer: feePayer,          // Pays transaction fees (can differ)\n}))\n\n// Later, retrieve the state\nconst state = getAssetSigner(umi)\n```\n\n### Transaction Wrapping\n\n**wrapForAssetSigner.ts** wraps transactions in MPL Core's `execute` instruction:\n\n```typescript\nconst wrappedTx = await wrapForAssetSigner(\n  umi,\n  originalTx,\n  assetSignerInfo,\n  authority,\n  payer\n)\n```\n\nThis:\n1. Fetches the asset and optionally its collection\n2. Extracts inner signers (e.g., newly created asset keypairs)\n3. Builds an execute transaction with the original instructions\n4. Preserves inner signers on the outer transaction\n\n## Architecture Diagram\n\n```mermaid\nflowchart TD\n    subgraph \"Public API\"\n        A[umiSendAndConfirmTransaction]\n        B[umiSendAllTransactionsAndConfirm]\n    end\n\n    subgraph \"Core Operations\"\n        C[umiSendTransaction]\n        D[umiConfirmTransaction]\n        E[umiSendAllTransactions]\n    end\n\n    subgraph \"Asset Signer\"\n        F[assetSignerPlugin]\n        G[getAssetSigner]\n        H[wrapForAssetSigner]\n    end\n\n    A --> C\n    A --> D\n    A --> G\n    A --> H\n\n    B --> E\n    B --> D\n    B --> G\n    B --> H\n\n    C --> G\n    E --> C\n    E --> G\n```\n\n## Usage Examples\n\n### Basic Transaction\n\n```typescript\nimport { umiSendAndConfirmTransaction } from './lib/umi/sendAndConfirm'\n\nconst result = await umiSendAndConfirmTransaction(umi, txBuilder, {\n  commitment: 'confirmed',\n  priorityFee: 5000,\n})\n```\n\n### Batch with Custom Batch Size\n\n```typescript\nimport { umiSendAllTransactionsAndConfirm } from './lib/umi/sendAllTransactionsAndConfirm'\nimport { ConfirmationStrategy } from './lib/umi/sendOptions'\n\nconst results = await umiSendAllTransactionsAndConfirm(\n  umi,\n  transactions,\n  {\n    confirmationStrategy: ConfirmationStrategy.transactionStatus,\n    batchSize: 5,\n    commitment: 'confirmed',\n  },\n  'Minting NFTs'\n)\n```\n\n### With Asset Signer\n\n```typescript\nimport { assetSignerPlugin } from './lib/umi/assetSignerPlugin'\nimport { umiSendAndConfirmTransaction } from './lib/umi/sendAndConfirm'\n\n// Install asset-signer plugin\numi.use(assetSignerPlugin({\n  info: { asset: assetAddress, ... },\n  authority: assetOwner,\n  payer: feePayer,\n}))\n\n// Transactions automatically wrapped in execute()\nconst result = await umiSendAndConfirmTransaction(umi, tx)\n```\n\n## Type Reference\n\n### UmiSendOptions\n\n| Field | Type | Description |\n|-------|------|-------------|\n| priorityFee | number | Micro lamports for compute unit price |\n| commitment | Commitment | Solana commitment level |\n| skipPreflight | boolean | Skip preflight simulation |\n| confirmationStrategy | ConfirmationStrategy | blockhash or transactionStatus |\n\n### UmiTransactionResponse\n\n| Field | Type | Description |\n|-------|------|-------------|\n| signature | string \\| null | Transaction signature |\n| blockhash | BlockhashWithExpiryBlockHeight \\| null | Blockhash used |\n| err | string \\| null | Error message if failed |\n\n### UmiSendAndConfirmResponse\n\n| Field | Type | Description |\n|-------|------|-------------|\n| transaction | UmiTransactionResponse | Send result |\n| confirmation | UmiTransactionConfirmationResult | Confirmation result |"};

(function() {
  var activePage = 'overview';

  document.addEventListener('DOMContentLoaded', function() {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
    renderMeta();
    renderNav();
    document.getElementById('menu-toggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });
    if (location.hash && location.hash.length > 1) {
      activePage = decodeURIComponent(location.hash.slice(1));
    }
    navigateTo(activePage);
  });

  function renderMeta() {
    if (!META) return;
    var el = document.getElementById('meta-info');
    var parts = [];
    if (META.generatedAt) {
      parts.push(new Date(META.generatedAt).toLocaleDateString());
    }
    if (META.model) parts.push(META.model);
    if (META.fromCommit) parts.push(META.fromCommit.slice(0, 8));
    el.textContent = parts.join(' \u00b7 ');
  }

  function renderNav() {
    var container = document.getElementById('nav-tree');
    var html = '<div class="nav-section">';
    html += '<a class="nav-item overview" data-page="overview" href="#overview">Overview</a>';
    html += '</div>';
    if (TREE.length > 0) {
      html += '<div class="nav-group-label">Modules</div>';
      html += buildNavTree(TREE);
    }
    container.innerHTML = html;
    container.addEventListener('click', function(e) {
      var target = e.target;
      while (target && !target.dataset.page) { target = target.parentElement; }
      if (target && target.dataset.page) {
        e.preventDefault();
        navigateTo(target.dataset.page);
      }
    });
  }

  function buildNavTree(nodes) {
    var html = '';
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      html += '<div class="nav-section">';
      html += '<a class="nav-item" data-page="' + escH(node.slug) + '" href="#' + encodeURIComponent(node.slug) + '">' + escH(node.name) + '</a>';
      if (node.children && node.children.length > 0) {
        html += '<div class="nav-children">' + buildNavTree(node.children) + '</div>';
      }
      html += '</div>';
    }
    return html;
  }

  function escH(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function navigateTo(page) {
    activePage = page;
    location.hash = encodeURIComponent(page);

    var items = document.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (items[i].dataset.page === page) {
        items[i].classList.add('active');
      } else {
        items[i].classList.remove('active');
      }
    }

    var contentEl = document.getElementById('content');
    var md = PAGES[page];

    if (!md) {
      contentEl.innerHTML = '<div class="empty-state"><h2>Page not found</h2><p>' + escH(page) + '.md does not exist.</p></div>';
      return;
    }

    contentEl.innerHTML = marked.parse(md);

    // Rewrite .md links to hash navigation
    var links = contentEl.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href');
      if (href && href.endsWith('.md') && href.indexOf('://') === -1) {
        var slug = href.replace(/\.md$/, '');
        links[i].setAttribute('href', '#' + encodeURIComponent(slug));
        (function(s) {
          links[i].addEventListener('click', function(e) {
            e.preventDefault();
            navigateTo(s);
          });
        })(slug);
      }
    }

    // Convert mermaid code blocks into mermaid divs
    var mermaidBlocks = contentEl.querySelectorAll('pre code.language-mermaid');
    for (var i = 0; i < mermaidBlocks.length; i++) {
      var pre = mermaidBlocks[i].parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = mermaidBlocks[i].textContent;
      pre.parentNode.replaceChild(div, pre);
    }
    try { mermaid.run({ querySelector: '.mermaid' }); } catch(e) {}

    window.scrollTo(0, 0);
    document.getElementById('sidebar').classList.remove('open');
  }
})();

</script>
</body>
</html>
