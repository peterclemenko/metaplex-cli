s like SOL and token management\n\n```mermaid\ngraph TB\n    subgraph \"mplx CLI\"\n        CLI[mplx]\n        \n        subgraph \"config\"\n            C_RPC[\"config rpcs\"]\n            C_WALLET[\"config wallets\"]\n            C_EXP[\"config explorer\"]\n        end\n        \n        subgraph \"core\"\n            CO_ASSET[\"core asset\"]\n            CO_COLL[\"core collection\"]\n            CO_PLUG[\"core plugins\"]\n        end\n        \n        subgraph \"toolbox\"\n            T_SOL[\"toolbox sol\"]\n            T_TOKEN[\"toolbox token\"]\n        end\n        \n        CLI --> config\n        CLI --> core\n        CLI --> toolbox\n        \n        config --> C_RPC\n        config --> C_WALLET\n        config --> C_EXP\n        \n        core --> CO_ASSET\n        core --> CO_COLL\n        core --> CO_PLUG\n        \n        toolbox --> T_SOL\n        toolbox --> T_TOKEN\n    end\n```\n\n## Command Groups\n\n### Configuration Commands\n\nThe `config` commands manage CLI settings stored in `~/.config/mplx/config.json`:\n\n| Command | Purpose |\n|---------|---------|\n| `mplx config` | Display current configuration |\n| `mplx config rpcs add <name> <url>` | Register a new RPC endpoint |\n| `mplx config rpcs list` | Show all configured RPCs |\n| `mplx config rpcs set` | Select active RPC (interactive or direct) |\n| `mplx config wallets set <name> <path>` | Add a named wallet |\n| `mplx config wallets list` | Show all configured wallets |\n| `mplx config explorer set <explorer>` | Set preferred block explorer |\n\nConfiguration supports interactive wizards for RPC and wallet selection, presenting a selectable list of previously configured options.\n\n### Core Commands\n\nThe `core` commands interface with the Metaplex Core protocol for digital asset management:\n\n**Asset Operations**\n```bash\nmplx core asset create --name \"Asset Name\" --uri \"https://...\"\nmplx core asset create --files --image ./image.png --json ./metadata.json\nmplx core asset create --directory ./assets\nmplx core asset burn <assetId>\n```\n\n**Collection Operations**\n```bash\nmplx core collection create --name \"Collection\" --uri \"https://...\" --symbol \"SYM\"\n```\n\n**Plugin Management**\n```bash\nmplx core plugins add <assetId> --wizard\nmplx core plugins remove <assetId>\n```\n\nSupported plugin types include Royalties, FreezeDelegate, BurnDelegate, TransferDelegate, UpdateDelegate, PermanentFreezeDelegate, Attributes, PermanentTransferDelegate, PermanentBurnDelegate, MasterEdition, Edition, and Autograph.\n\n### Toolbox Commands\n\nThe `toolbox` commands provide utility functions:\n\n**SOL Operations**\n```bash\nmplx toolbox sol balance [address]\nmplx toolbox sol transfer <amount> <recipient>\n```\n\n**Token Operations**\n```bash\nmplx toolbox token create --wizard\nmplx toolbox token create --name \"Token\" --symbol \"TKN\" --decimals 9 --mint 1000000000\nmplx toolbox token update <mint> --name \"New Name\"\nmplx toolbox token transfer <mint> <amount> <recipient>\n```\n\n## File Structure\n\nThe documentation follows a flat structure with dedicated files for each command group:\n\n```\ndocs/\n├── config.md    # Configuration command reference\n├── core.md      # Core asset/collection operations\n└── toolbox.md   # Utility commands\n```\n\n## Configuration Schema\n\nThe CLI stores settings in JSON format:\n\n```json\n{\n  \"keypair\": \"/path/to/wallet.json\",\n  \"rpcUrl\": \"https://api.devnet.solana.com\",\n  \"explorer\": \"solscan\",\n  \"wallets\": {\n    \"default\": \"dev1\",\n    \"dev1\": \"/home/user/.config/solana/dev1.json\"\n  },\n  \"rpcs\": {\n    \"helius\": \"https://devnet.helius-rpc.com/?api-key=<key>\"\n  }\n}\n```\n\n## Common Patterns\n\nSeveral commands share common options across the CLI:\n\n- **`--wizard`**: Launches interactive prompts for guided configuration\n- **`--files`**: Enables file upload mode for metadata and images\n- **`--directory`**: Batch processing of multiple assets from a folder\n\n## Best Practices\n\n1. **Test on devnet** — Use devnet for development before production deployments\n2. **Verify addresses** — Always confirm wallet and asset IDs before operations\n3. **Back up configurations** — Preserve wallet paths and RPC settings\n4. **Use wizards** — The `--wizard` flag reduces errors for complex operations\n5. **Monitor transactions** — Use the configured explorer to verify on-chain state","other-eslint-config-js":"# Other — eslint.config.js\n\n# ESLint Configuration\n\n## Overview\n\nThis file (`eslint.config.js`) defines the project's ESLint rules. ESLint statically analyzes JavaScript code to identify problematic patterns and enforce consistent coding conventions. This configuration applies to all JavaScript files in the project.\n\n## Configuration Structure\n\nThe config uses ESLint's flat configuration format (ESLint v9+), exporting an array with a single configuration object:\n\n```javascript\nexport default [\n  {\n    rules: { /* rule definitions */ },\n  },\n];\n```\n\n## Enabled Rules\n\n### `prefer-const`: `\"error\"`\n\nEnforces the use of `const` declarations for variables that are never reassigned. Using `let` for constant values is flagged as an error.\n\n```javascript\n// Bad\nlet count = 0;\n\n// Good\nconst count = 0;\n```\n\n### `semi`: `\"error\"`\n\nRequires semicolons at the end of statements. This prevents Automatic Semicolon Insertion (ASI)-related bugs.\n\n```javascript\n// Bad\nconst x = 1\n\n// Good\nconst x = 1;\n```\n\n### `sort-objects`: `0`\n\n**Disabled** (level 0). This rule would enforce alphabetical sorting of object keys, but it's turned off to allow developers to organize object properties semantically.\n\n### `camelcase`: `0`\n\n**Disabled** (level 0). This rule would require identifiers to use camelCase, but it's turned off to allow flexibility for:\n- Snake_case variables from external APIs\n- Constants that benefit from UPPER_SNAKE_CASE\n- Property names that must match external schemas\n\n## Rule Severity Levels\n\n| Level | Value | Meaning |\n|-------|-------|---------|\n| Off   | `0`   | Rule is disabled |\n| Warn  | `1`   | Rule triggers a warning but doesn't fail the build |\n| Error | `2`   | Rule triggers an error and fails the build |\n\n## Extending the Configuration\n\nTo add new rules or modify existing ones, edit the `rules` object:\n\n```javascript\nexport default [\n  {\n    rules: {\n      'prefer-const': 'error',\n      semi: 'error',\n      'sort-objects': 0,\n      camelcase: 0,\n      // Add new rules here\n      'no-unused-vars': 'warn',\n      'eqeqeq': 'error',\n    },\n  },\n];\n```\n\nTo apply different rules to specific files, add more configuration objects to the array with `files` or `ignores` patterns:\n\n```javascript\nexport default [\n  {\n    files: ['**/*.js'],\n    rules: { /* general JS rules */ },\n  },\n  {\n    files: ['tests/**/*.js'],\n    rules: { /* test-specific rules */ },\n  },\n];\n```\n\n## Integration\n\nESLint runs as part of the development workflow. When triggered, ESLint reads this configuration file and applies the defined rules to JavaScript files in the project.\n\nThis is a minimal configuration suitable for small projects or as a starting point. As the project grows, consider:\n- Adding environment-specific configurations\n- Integrating with Prettier for formatting (ESLint handles code quality, Prettier handles code style)\n- Using shareable configs to share rule sets across projects","other-flake-nix":"# Other — flake.nix\n\n# flake.nix — Nix Flake Development Environment\n\nThis module defines a **Nix flake** that provides a reproducible development shell for the ghost-datatype-support-lib project. It uses nixpkgs/nixos-unstable to ensure access to the latest package versions.\n\n## Overview\n\nThe flake creates a `devShell` — a self-contained development environment with all necessary tools pre-installed. When developers enter this shell via `nix develop`, they get a consistent toolchain regardless of their host system.\n\n## Key Components\n\n### Inputs\n\n| Input | Source | Purpose |\n|-------|--------|---------|\n| `nixpkgs` | `github:NixOS/nixpkgs/nixos-unstable` | Package repository (unstable branch for latest versions) |\n| `flake-utils` | `github:numtide/flake-utils` | Utility library for multi-system flake support |\n\n### Outputs\n\nThe flake outputs a `devShells` attribute containing a default shell definition. The `eachDefaultSystem` helper generates shells for:\n- `x86_64-linux`\n- `aarch64-linux`\n- `x86_64-darwin`\n- `aarch64-darwin`\n\n### Build Inputs\n\nThe following packages are included in the development environment:\n\n| Package | Purpose |\n|---------|---------|\n| `nodejs` | JavaScript runtime |\n| `pnpm` | Fast, disk space-efficient package manager |\n| `fnm` | Fast Node Manager — version management for Node.js |\n| `act` | Run GitHub Actions locally |\n| `just` | Command runner (like make, but simpler) |\n| `git` | Version control |\n| `docker` | Container runtime |\n| `sqlite` | SQLite CLI tools |\n| `coreutils` | GNU core utilities |\n| `nushell` | Modern shell alternative |\n| `mise` | Dev tool manager (like asdf) |\n| `dependabot-cli` | Dependabot command-line tool |\n| `codeql` | Code analysis engine |\n| `dependabot` | Automated dependency updates |\n\n### Shell Hook\n\nOn shell startup, the following executes automatically:\n\n1. A welcome message identifying the system architecture\n2. Runs `just run` — executes the project's default task (defined in `justfile`)\n3. Displays availability status for `act` and `fnm`\n\n## Usage\n\n```bash\n# Enter the development shell\nnix develop\n\n# Or use the flake directly from any path\nnix develop github:username/ghost-datatype-support-lib\n```\n\n## Configuration Notes\n\n- **Unfree packages enabled**: The flake explicitly allows unfree packages via `config.allowUnfree = true` because `codeql` is proprietary software. This is required to avoid evaluation errors.\n- **System-specific**: The shell is built for the host system automatically via `flake-utils.lib.eachDefaultSystem`.\n\n## Integration with Project\n\nThis flake is the entry point for all development work. It delegates actual project execution to the `justfile`, which defines tasks like building, testing, and running the project.","other-justfile":"# Other — justfile\n\n# Justfile — Development Task Automation\n\nThis justfile provides a collection of `just` recipe targets for automating common development tasks in the project. It encapsulates CodeQL security analysis, testing workflows, npm publishing, and local GitHub Actions execution.\n\n## Prerequisites\n\n- **just** — The command runner (`brew install just` or `cargo install just`)\n- **bash** — All recipes execute via bash with strict error handling (`-eu -o pipefail`)\n- **pnpm** — Preferred package manager (falls back to npm when unavailable)\n\nRun `just` with no arguments to see available targets, or `just help` for the same output.\n\n---\n\n## CodeQL Analysis\n\nThe justfile automates the complete CodeQL security scanning workflow: downloading the CodeQL CLI, creating a database from your codebase, and running security queries.\n\n### Target Overview\n\n| Target | Purpose |\n|--------|---------|\n| `download-codeql` | Download CodeQL CLI or use system version on PATH |\n| `codeql-create-db` | Create a CodeQL database from source |\n| `codeql-analyze` | Run security queries against the database |\n| `codeql-run` | Convenience target: download → create-db → analyze |\n| `codeql-clean-db` | Remove all CodeQL artifacts |\n| `codeql-status` | Show installed CodeQL version and database info |\n\n### Download CodeQL\n\n```bash\njust download-codeql\n```\n\nThis target checks for CodeQL in two places:\n\n1. **System PATH** — If `codeql` is on PATH, it creates a symlink in `tools/codeql/` pointing to the system binary\n2. **Local download** — If not found on PATH, downloads the latest Linux64 release from GitHub, extracts it to `tools/codeql/`, and creates a `codeql` symlink\n\nThe downloaded CLI lives in `tools/codeql/codeql`.\n\n### Create Database\n\n```bash\njust codeql-create-db\n```\n\nCreates a CodeQL database named `codeql-db` by running a build command against the JavaScript/TypeScript source. By default:\n\n- **Build command:** `pnpm install && pnpm run build`\n- **Language:** JavaScript\n- **Output:** `codeql-db/`\n\n**Environment variables:**\n\n- `BUILD_CMD` — Override the build command (e.g., `BUILD_CMD=\"npm run build\" just codeql-create-db`)\n- `OVERWRITE=true` — Replace an existing database instead of skipping\n\n```bash\n# Recreate the database from scratch\nOVERWRITE=true just codeql-create-db\n\n# Custom build command\nBUILD_CMD=\"npm install && npm run build:prod\" just codeql-create-db\n```\n\nThe target detects whether `codeql-db` exists and is a valid database. If the directory exists but isn't a valid CodeQL database, it removes it and recreates.\n\n### Run Analysis\n\n```bash\njust codeql-analyze\n```\n\nAnalyzes the `codeql-db` database using the JavaScript query pack and writes results to SARIF format.\n\n**Environment variables:**\n\n- `PACK` — Query pack to use (default: `codeql/javascript-queries@latest`)\n- `OUT` — Output file (default: `results.sarif`)\n\n```bash\n# Custom output location\nOUT=security-results.sarif just codeql-analyze\n```\n\n### Full Workflow\n\n```bash\n# Run the complete CodeQL pipeline\njust codeql-run\n\n# Or step by step\njust download-codeql\njust codeql-create-db\njust codeql-analyze\n```\n\n### Cleanup\n\n```bash\njust codeql-clean-db\n```\n\nRemoves:\n- `codeql-db/` — The database directory\n- `results.sarif` — Analysis output\n- `tools/codeql/` — Downloaded CLI (but not a system-installed symlink)\n\n---\n\n## Testing\n\n### Run Unit Tests\n\n```bash\njust pnpm-test\n```\n\nRuns the project's test suite. Uses pnpm if available, falls back to npm.\n\n```bash\njust test-mocha\n```\n\nRuns Mocha-specific tests via `pnpm run test:mocha` (or npm fallback).\n\n---\n\n## Local GitHub Actions\n\n### Run with `act`\n\n```bash\njust act\n```\n\nExecutes GitHub Actions workflows locally using [act](https://github.com/nektos/act). Requires Docker and the `act` binary to be installed.\n\n**Environment variables:**\n\n- `WORKFLOW` — Path to workflow file (default: `.github/workflows/ci.yml`)\n- `JOB` — Specific job to run (optional)\n- `EVENT_FILE` — Path to event payload file (optional)\n\n```bash\n# Run a specific job\nJOB=test just act\n\n# Use a custom workflow\nWORKFLOW=.github/workflows/security.yml just act\n```\n\n### Full Analysis + Act\n\n```bash\njust act-run\n```\n\nConvenience target that runs:\n1. `download-codeql`\n2. `codeql-create-db`\n3. `codeql-analyze`\n4. `act`\n\n---\n\n## gitnexus Analysis\n\n```bash\njust gitnexus-analyze\n```\n\nRuns the gitnexus analyzer via `npx gitnexus analyze`.\n\n### Serve gitnexus GUI\n\n```bash\njust gitnexus-serve\n```\n\nStarts the gitnexus development server. The GUI runs at `https://gitnexus.vercel.app/`.\n\nThe target checks if port 4747 is already in use before starting the server.\n\n### Run Everything\n\n```bash\njust run\n```\n\nRuns `gitnexus-analyze` followed by `gitnexus-serve`.\n\n---\n\n## npm Publishing\n\n### Dry-Run Publish\n\n```bash\njust npm-publish-dry-run\n```\n\nPerforms a dry-run of npm publishing:\n1. Updates the package version to `0.2.0` (if not already at that version)\n2. Runs `npm publish --dry-run`\n\nThis target handles the `npm version` command gracefully — if the version is already set, it continues without error.\n\n---\n\n## Dependabot\n\n```bash\njust dependabot-update\n```\n\nRuns the Dependabot CLI to check for dependency updates.\n\n**Environment variables:**\n\n- `PM` — Package manager (default: `npm_and_yarn`)\n- `REPO` — Repository in format `owner/repo` (default: `peterclemenko/ghost-datatype-support-lib`)\n\n```bash\n# Check for Go updates\nPM=go just dependabot-update\n```\n\n---\n\n## Environment Variables Summary\n\n| Variable | Target(s) | Description |\n|----------|----------|-------------|\n| `BUILD_CMD` | `codeql-create-db` | Build command for database creation |\n| `OVERWRITE` | `codeql-create-db` | Set to `true` to replace existing database |\n| `PACK` | `codeql-analyze` | CodeQL query pack |\n| `OUT` | `codeql-analyze` | SARIF output filename |\n| `WORKFLOW` | `act` | Path to workflow file |\n| `JOB` | `act` | Specific job to run |\n| `EVENT_FILE` | `act` | Event payload file |\n| `PM` | `dependabot-update` | Package manager |\n| `REPO` | `dependabot-update` | Repository for dependabot |\n\n---\n\n## Error Handling\n\nAll recipes use bash with strict error handling:\n\n```bash\nset shell := [\"bash\", \"-eu\", \"-o\", \"pipefail\", \"-c\"]\n```\n\n- `-e` — Exit immediately on command failure\n- `-u` — Treat unset variables as errors\n- `-o pipefail` — Pipeline fails if any command fails (not just the last)\n\nThis ensures failures are caught early and scripts don't continue with invalid state.","other-mcp-compatibility-md":"# Other — MCP_COMPATIBILITY.md\n\n# MCP Compatibility Tracker\n\nThis document tracks the compatibility status of CLI commands with MCP (Model Context Protocol) tools. MCP allows AI assistants like Claude to interact with the CLI as tools, passing arguments and receiving structured results programmatically.\n\n## Purpose\n\nMCP tools need to:\n\n1. **Accept arguments programmatically** — Commands must have non-interactive paths (no prompts, wizards, or TTY-dependent flows)\n2. **Return structured data** — Commands must return parseable JSON that MCP tools can consume\n\nThis tracker identifies which commands meet these requirements and which need fixes.\n\n## Key Issues\n\n### Issue 1: `--json` Returns `null`\n\nMost commands extend `TransactionCommand` or `BaseCommand` which set `enableJsonFlag = true`, enabling the `--json` flag. However, the `run()` method returns `void`, so `--json` outputs `{\"result\": null}` — useless for MCP consumption.\n\n**Root cause:** Commands perform side effects (logging, RPC calls) but don't return the data.\n\n**Fix required:** Commands must return structured data from `run()`.\n\n```typescript\n// Current (broken for MCP)\nasync run(): Promise<void> {\n  const result = await this.doThing();\n  console.log(result); // Only goes to stdout, not returned\n}\n\n// Required for MCP\nasync run(): Promise<{ result: string }> {\n  const result = await this.doThing();\n  return { result };\n}\n```\n\n### Issue 2: Always-Interactive Commands\n\nThree commands have no non-interactive path. They always prompt for input and cannot be used by MCP tools.\n\n### Issue 3: Config Commands Lack `--json` Support\n\nConfig commands (`config rpcs`, `config wallets`, `config explorer`, `config storage`) extend plain `Command` instead of `BaseCommand`, so they lack the `--json` flag entirely.\n\n## Status Categories\n\n| Status | Meaning |\n|--------|---------|\n| **Ready** | Works with MCP as-is |\n| **Needs JSON Return** | Non-interactive but `--json` returns null; needs `run()` to return data |\n| **Conditional** | Works only when specific flags/args are provided; avoid wizard/interactive flags |\n| **Incompatible** | Always interactive; needs a non-interactive path added |\n| **No --json** | Extends plain `Command`; no JSON output support |\n\n## Command Inventory\n\n### Core Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `core asset create` | Conditional + Needs JSON Return | `--wizard`, `--plugins` are interactive | Returns null | Avoid `--wizard`/`--plugins`; use `--name`/`--uri` |\n| `core asset burn` | Needs JSON Return | No | Returns null | Should return signature |\n| `core asset fetch` | Needs JSON Return | No | Returns null | Should return asset data |\n| `core asset update` | Needs JSON Return | No | Returns null | Should return signature |\n| `core asset template` | Needs JSON Return | No | Returns null | Should return file path |\n| `core collection create` | Conditional + Needs JSON Return | `--wizard`, `--plugins` are interactive | Returns null | Should return collection address + sig |\n| `core collection fetch` | Ready | No | Returns on-chain asset object | Best fetch command |\n| `core collection template` | Needs JSON Return | No | Returns null | Should return file path |\n| `core plugins add` | Conditional + Needs JSON Return | `--wizard` is interactive | Returns null | Use JSON file arg |\n| `core plugins update` | Conditional + Needs JSON Return | `--wizard` is interactive | Returns null | Use JSON file arg |\n| `core plugins generate` | **Incompatible** | Always interactive | Returns null | Needs non-interactive flag path |\n\n### Config Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `config get` | No --json | No | No `--json` flag | `run()` returns ConfigJson but no flag to use it |\n| `config set` | No --json | No | No `--json` flag | |\n| `config rpcs add` | No --json | No | No `--json` flag | |\n| `config rpcs list` | No --json | No | No `--json` flag | Uses `console.table()` |\n| `config rpcs remove` | No --json | No | No `--json` flag | |\n| `config rpcs set` | Conditional + No --json | Interactive if `name` arg omitted | No `--json` flag | Always provide `name` arg |\n| `config wallets add` | No --json | No | No `--json` flag | |\n| `config wallets list` | No --json | No | No `--json` flag | Uses `console.table()` |\n| `config wallets new` | Needs JSON Return | No | Returns null | Should return keypair path + pubkey |\n| `config wallets remove` | No --json | No | No `--json` flag | |\n| `config wallets set` | Conditional + No --json | Interactive if `name` arg omitted | No `--json` flag | Always provide `name` arg |\n| `config explorer set` | **Incompatible** | Always interactive | No `--json` flag | Needs `--explorer` arg |\n| `config storage set` | **Incompatible** | Always interactive | No `--json` flag | Needs `--provider` arg |\n\n### Toolbox - SOL Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox sol airdrop` | Needs JSON Return | No | Returns null | Should return signature + balance |\n| `toolbox sol balance` | Needs JSON Return | No | Returns null | Should return balance value |\n| `toolbox sol transfer` | Ready | No | Returns \"success\" | Could be improved to return sig |\n| `toolbox sol wrap` | Ready | No | Returns \"success\" | |\n| `toolbox sol unwrap` | Ready | No | Returns \"success\" | |\n\n### Toolbox - Token Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox token create` | Conditional + Needs JSON Return | `--wizard` is interactive | Returns null | Should return mint address + sig |\n| `toolbox token mint` | Ready | No | Returns tx result | Good |\n| `toolbox token transfer` | Needs JSON Return | No | Returns null | Should return signature |\n| `toolbox token update` | Conditional + Needs JSON Return | `--editor` is interactive | Returns null | Avoid `--editor` |\n| `toolbox token add-metadata` | Needs JSON Return | No | Returns null | Should return signature |\n\n### Toolbox - Storage Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox storage balance` | Needs JSON Return | No | Returns null | Logs JSON text but doesn't return it |\n| `toolbox storage fund` | Needs JSON Return | No | Returns null | |\n| `toolbox storage upload` | Needs JSON Return | No | Returns null | Should return URI |\n| `toolbox storage withdraw` | Needs JSON Return | No | Returns null | |\n\n### Toolbox - LUT Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox lut create` | Needs JSON Return | No | Returns null | Should return LUT address + sig |\n| `toolbox lut fetch` | Ready (custom) | No | Custom `--json` flag | Has its own JSON output logic |\n| `toolbox lut deactivate` | Needs JSON Return | No | Returns null | |\n| `toolbox lut close` | Needs JSON Return | No | Returns null | |\n\n### Toolbox - Template Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox template program` | Conditional + No --json | Interactive if `template` arg omitted | No `--json` flag | Always provide arg |\n| `toolbox template website` | Conditional + No --json | Interactive if `--template` omitted | No `--json` flag | Always provide flag |\n\n### Toolbox - Other\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `toolbox rent` | Needs JSON Return | No | Returns null | Should return rent value |\n\n### Genesis Commands\n\n| Command | Status | Interactive? | `--json` works? | Notes |\n|---|---|---|---|---|\n| `genesis create` | Needs JSON Return | No | Returns null | Should return genesis address + sig |\n| `genesis fetch` | Needs JSON Return | No | Returns null | Should return genesis data |\n| `genesis deposit` | Needs JSON Return | No | Returns null | |\n| `genesis withdraw` | Needs JSON Return | No | Returns null | |\n| `genesis claim` | Needs JSON Return | No | Returns null | |\n| `genesis claim-unlocked` | Needs JSON Return | No | Returns null | |\n| `genesis finalize` | Needs JSON Return | No | Returns null | |\n| `genesis revoke` | Needs JSON Return | No | Returns null | |\n| `genesis transition` | Needs JSON Return | No | Returns null | |\n| `genesis bucket add-launch-pool` | Needs JSON Return | No | Returns null | |\n| `genesis bucket add-presale` | Needs JSON Return | No | Returns null | |\n| `genesis bucket add-unlocked` | Needs JSON Return | No | Returns null | |\n| `genesis bucket fetch` | Needs JSON Return | No | Returns null | Should return bucket data |\n| `genesis presale claim` | Needs JSON Return | No | Returns null | |\n| `genesis presale deposit` | Needs JSON Return | No | Returns null | |\n\n## MCP-Only Tools\n\nThese tools should be implemented directly in the MCP server, not as CLI commands. They don't map well to CLI semantics.\n\n| Tool | Status | Description |\n|---|---|---|\n| `write_temp_file` | TODO | Accept base64 data, write to temp file, return path. Used for AI-generated images. |\n\n## Priority Order\n\n### P0 — Incompatible Commands\n\nThese commands cannot be used by MCP tools at all. Fixes require adding non-interactive argument paths.\n\n1. **`core plugins generate`** — Add `--plugin` and `--config` flags for non-interactive use\n2. **`config explorer set`** — Add positional argument or `--explorer` flag\n3. **`config storage set`** — Add positional argument or `--provider` flag\n\n### P1 — High-Value Commands\n\nThese are the commands MCP tools will use most frequently. Fixes require returning structured data from `run()`.\n\n1. **`core asset create`** — Return `{ asset, signature }`\n2. **`core collection create`** — Return `{ collection, signature }`\n3. **`core asset fetch`** — Return asset data\n4. **`toolbox token create`** — Return `{ mint, signature }`\n5. **`toolbox storage upload`** — Return `{ uri }` (critical for upload workflow)\n6. **`toolbox sol balance`** — Return `{ balance }`\n7. **`genesis create`** — Return `{ genesis, signature }`\n8. **`genesis fetch`** — Return genesis data\n\n### P2 — Remaining Commands\n\nAll other commands marked \"Needs JSON Return\" in the inventory above.\n\n### P3 — Config Commands\n\nMigrate config commands to extend `BaseCommand` or manually add `enableJsonFlag` to enable `--json` support.\n\n## Architecture Connection\n\nThis tracker connects to the CLI codebase through the command hierarchy:\n\n```\nCommand (oclif base)\n    └── BaseCommand\n            └── TransactionCommand\n                    ├── Core Commands (core asset, core collection, etc.)\n                    └── Genesis Commands\n```\n\nConfig commands currently bypass this hierarchy by extending `Command` directly, which is why they lack `--json` support.\n\nThe `--json` flag is implemented via OCLIF's `enableJsonFlag` option, which intercepts the flag and formats the `run()` return value as JSON. When `run()` returns `void`, the output is `{\"result\": null}`.","other-oclif-json":"# Other — oclif.json\n\n# oclif.json Configuration\n\n## Overview\n\nThis file is the **primary configuration manifest** for the MPLX CLI, built on [OCLIF](https://oclif.io/) (Open CLI Framework). It defines how the CLI is structured, what plugins are loaded, and where command implementations are located.\n\nOCLIF reads this file at runtime to bootstrap the command-line interface, resolve plugin dependencies, and route user commands to their handlers.\n\n## Configuration Reference\n\n```json\n{\n    \"bin\": \"mplx\",\n    \"dirname\": \"mplx\",\n    \"commands\": \"./dist/commands\",\n    \"plugins\": [\n        \"@oclif/plugin-help\",\n        \"@oclif/plugin-autocomplete\",\n        \"@oclif/plugin-commands\",\n        \"@oclif/plugin-not-found\",\n        \"@oclif/plugin-version\"\n    ],\n    \"topicSeparator\": \" \"\n}\n```\n\n### Field Definitions\n\n| Field | Value | Purpose |\n|-------|-------|---------|\n| `bin` | `\"mplx\"` | The executable name users type to invoke the CLI |\n| `dirname` | `\"mplx\"` | Directory name used for config resolution (typically matches `bin`) |\n| `commands` | `\"./dist/commands\"` | Path to compiled command modules (TypeScript → JavaScript output) |\n| `plugins` | `array` | List of OCLIF plugins to load at startup |\n| `topicSeparator` | `\" \"` | Separator between command topics (e.g., `mplx topic command`) |\n\n### Plugins\n\nThe CLI includes five OCLIF plugins:\n\n- **`@oclif/plugin-help`** — Generates and displays help output for commands (`mplx --help`, `mplx <command> --help`)\n- **`@oclif/plugin-autocomplete`** — Provides tab completion for shells (bash, zsh, fish)\n- **`@oclif/plugin-commands`** — Lists all available commands (`mplx commands`)\n- **`@oclif/plugin-not-found`** — Handles unknown commands with helpful suggestions\n- **`@oclif/plugin-version`** — Outputs version information (`mplx --version`, `mplx version`)\n\n## Architecture Integration\n\nOCLIF uses this configuration during its bootstrap phase. The following diagram shows how the configuration connects to the runtime:\n\n```mermaid\nflowchart TD\n    User[User runs: mplx <command>] --> OCLIF[OCLIF Core]\n    OCLIF --> Config[Read oclif.json]\n    Config --> Bin[\"Resolve bin: mplx\"]\n    Config --> Commands[\"Load commands from<br>./dist/commands\"]\n    Config --> Plugins[\"Initialize plugins\"]\n    Plugins --> Help[plugin-help]\n    Plugins --> Auto[plugin-autocomplete]\n    Plugins --> Cmds[plugin-commands]\n    Plugins --> NotFound[plugin-not-found]\n    Plugins --> Version[plugin-version]\n    \n    OCLIF --> Router[Route to matching command handler]\n    Router --> Handler[Command implementation]\n```\n\n## Build Relationship\n\nThe `commands` path points to `./dist/commands`, indicating:\n\n1. Source TypeScript commands live in `src/commands/` (or similar)\n2. The build process compiles them to JavaScript in `dist/commands/`\n3. OCLIF loads the compiled JavaScript at runtime\n\nThis is the standard pattern for TypeScript-based OCLIF projects.\n\n## Extending the CLI\n\nTo add a new command to the CLI:\n\n1. Create a TypeScript file in `src/commands/` (or the source equivalent)\n2. Export a class that extends `oclif.Command`\n3. Build the project — the compiled output appears in `dist/commands/`\n4. OCLIF automatically discovers and registers the command on next startup\n\nTo add functionality via plugins, add the package to both `package.json` dependencies and the `plugins` array in this file.\n\n## Notes\n\n- This file contains **no runtime logic** — it is purely declarative configuration\n- OCLIF validates this file on startup; malformed JSON causes immediate failure\n- The `topicSeparator` value `\" \"` means multi-word commands use spaces: `mplx my command` rather than `mplx:my:command`","other-oclif-manifest-json-js":"# Other — oclif.manifest.json.js\n\n# `oclif.manifest.json.js`\n\n## Overview\n\nThis module is the OCLIF CLI manifest loader. It reads the generated `oclif.manifest.json` file and exports its contents as a JavaScript object, making the CLI command metadata available to the OCLIF framework at runtime.\n\n## Purpose\n\nOCLIF (Open CLI Framework) generates a manifest file (`oclif.manifest.json`) containing metadata about all available commands, their arguments, flags, and descriptions. This module serves as the bridge between the static JSON manifest and the runtime JavaScript code by:\n\n1. Locating the manifest file relative to this module's directory\n2. Reading the JSON content from disk\n3. Parsing and exporting the manifest for consumption by OCLIF\n\n## How It Works\n\n```javascript\n// Resolve the directory of this module using ES module conventions\nconst __dirname = path.dirname(fileURLToPath(import.meta.url));\n\n// Build the path to oclif.manifest.json in the same directory\nconst manifestPath = path.join(__dirname, 'oclif.manifest.json');\n\n// Read and parse the JSON file, export as default\nexport default JSON.parse(fs.readFileSync(manifestPath, 'utf8'));\n```\n\n### Path Resolution\n\nThe module uses `fileURLToPath(import.meta.url)` to convert the ES module URL to a filesystem path. This is necessary because:\n- `import.meta.url` provides a `file://` URL, not a filesystem path\n- `path.dirname()` requires a string path, not a URL\n- This pattern is the standard way to get `__dirname` in ES modules (since `__dirname` is not available in ESM)\n\n### Manifest Loading\n\nThe manifest is loaded synchronously using `fs.readFileSync()`. This happens at module import time, meaning the manifest is available immediately when this module is imported elsewhere.\n\n## Generated Manifest\n\nThe `oclif.manifest.json` file is generated by running:\n\n```bash\noclif manifest\n```\n\nThis command scans your CLI's command files and produces a JSON file containing:\n- Command names and descriptions\n- Arguments and flags for each command\n- Aliases and version information\n\n## Usage in OCLIF\n\nWhen OCLIF initializes, it imports this module to access command metadata without needing to parse source files at runtime. This improves startup performance.\n\n```javascript\nimport manifest from './oclif.manifest.json.js';\n```\n\n## File Relationship\n\n```\noclif.manifest.json.js  →  reads  →  oclif.manifest.json\n       ↓\n   (exports parsed JSON)\n```\n\n## Considerations\n\n- **Synchronous loading**: The manifest is read synchronously. For most CLIs, this overhead is negligible since the manifest is typically small (< 100KB).\n- **Build-time requirement**: The manifest must be generated before distribution. Typically this is handled in the CI/CD pipeline or as part of the npm `prepack` script.\n- **ES Modules only**: This module uses ES module syntax (`import`/`export`) and is designed for modern Node.js environments.","other-package-json":"# Other — package.json\n\n# @metaplex-foundation/cli\n\nThe official Metaplex Command Line Interface (CLI) for interacting with the Metaplex ecosystem on Solana. This CLI provides commands for managing digital assets, candy machines, token metadata, and other Metaplex-related operations.\n\n## Overview\n\nThis package is built on [OCLIF](https://oclif.io/) (Open CLI Framework) and provides a TypeScript-based command-line interface for developers and users to interact with various Metaplex programs on the Solana blockchain.\n\n```mermaid\ngraph TB\n    subgraph \"User Interface\"\n        CLI[\"CLI User<br/>mplx command\"]\n    end\n    \n    subgraph \"Entry Points\"\n        run[\"bin/run.js<br/>Production\"]\n        dev[\"bin/dev.js<br/>Development\"]\n    end\n    \n    subgraph \"OCLIF Plugins\"\n        help[\"@oclif/plugin-help\"]\n        version[\"@oclif/plugin-version\"]\n        notfound[\"@oclif/plugin-not-found\"]\n        autocomplete[\"@oclif/plugin-autocomplete\"]\n        commands[\"@oclif/plugin-commands\"]\n    end\n    \n    subgraph \"Commands\"\n        cmds[\"dist/commands/*<br/>TypeScript Commands\"]\n    end\n    \n    subgraph \"Metaplex Libraries\"\n        umi[\"@metaplex-foundation/umi\"]\n        mplcore[\"mpl-core\"]\n        mplbubblegum[\"mpl-bubblegum\"]\n        mpltoken[\"mpl-token-metadata\"]\n        mpltoolbox[\"mpl-toolbox\"]\n    end\n    \n    CLI --> run\n    CLI --> dev\n    run --> help\n    run --> version\n    run --> notfound\n    run --> autocomplete\n    run --> commands\n    run --> cmds\n    cmds --> umi\n    cmds --> mplcore\n    cmds --> mplbubblegum\n    cmds --> mpltoken\n    cmds --> mpltoolbox\n```\n\n## Package Configuration\n\n| Field | Value |\n|-------|-------|\n| **Name** | `@metaplex-foundation/cli` |\n| **Version** | 0.4.0 |\n| **Type** | ES Module (`\"type\": \"module\"`) |\n| **License** | Metaplex License |\n| **Node.js** | >= 20.0.0 |\n| **Package Manager** | pnpm 9.12.3 |\n\n## Binary & Entry Points\n\nThe CLI exposes the `mplx` command through two entry points:\n\n### Production Entry Point\n```json\n\"bin\": {\n  \"mplx\": \"./bin/run.js\"\n}\n```\n\n### Development Entry Point\n```bash\npnpm dev    # Uses ./bin/dev.js for hot-reload development\n```\n\n## OCLIF Configuration\n\nThe CLI uses OCLIF with several plugins for enhanced user experience:\n\n```json\n\"oclif\": {\n  \"commands\": \"./dist/commands\",\n  \"bin\": \"mplx\",\n  \"plugins\": [\n    \"@oclif/plugin-help\",\n    \"@oclif/plugin-version\",\n    \"@oclif/plugin-not-found\",\n    \"@oclif/plugin-autocomplete\",\n    \"@oclif/plugin-commands\"\n  ],\n  \"topicSeparator\": \" \",\n  \"dirname\": \"mplx\"\n}\n```\n\n### Plugin Purpose\n\n| Plugin | Function |\n|--------|-----------|\n| `@oclif/plugin-help` | Provides `--help` flag and `help` command |\n| `@oclif/plugin-version` | Provides `--version` flag to display CLI version |\n| `@oclif/plugin-not-found` | Displays helpful error when commands aren't found |\n| `@oclif/plugin-autocomplete` | Tab completion for shell environments |\n| `@oclif/plugin-commands` | Lists all available commands |\n\n## Key Dependencies\n\nThe CLI integrates with multiple Metaplex libraries and Solana tooling.\n\n### Core Metaplex Libraries\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `@metaplex-foundation/umi` | 1.5.1 | Core SDK for Solana interactions |\n| `@metaplex-foundation/mpl-core` | 1.8.0 | Core Metaplex program |\n| `@metaplex-foundation/mpl-bubblegum` | 5.0.2 | Compressed NFTs |\n| `@metaplex-foundation/mpl-token-metadata` | 3.4.0 | Token Metadata program |\n| `@metaplex-foundation/mpl-core-candy-machine` | 0.3.0 | Candy Machine for Core assets |\n| `@metaplex-foundation/digital-asset-standard-api` | 2.0.0 | DAS API integration |\n| `@metaplex-foundation/mpl-distro` | 0.3.2 | Distribution utilities |\n| `@metaplex-foundation/mpl-agent-registry` | 0.2.5 | Agent registry |\n| `@metaplex-foundation/genesis` | 0.35.0 | Genesis utilities |\n\n### Umi Bundles & Adapters\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `@metaplex-foundation/umi-bundle-defaults` | 1.5.1 | Default Umi plugins |\n| `@metaplex-foundation/umi-uploader-irys` | 1.5.0 | Irys (formerly Bundlr) uploader |\n| `@metaplex-foundation/umi-uploader-arweave-via-turbo` | 1.5.1 | Arweave uploader via Turbo |\n| `@metaplex-foundation/umi-signer-wallet-adapters` | 1.5.1 | Wallet adapter support |\n| `@metaplex-foundation/umi-web3js-adapters` | 1.5.1 | Web3.js compatibility |\n| `@metaplex-foundation/mpl-toolbox` | 0.10.0 | Utility functions |\n\n### Hardware Wallet Support\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `@ledgerhq/hw-app-solana` | 7.4.0 | Ledger Solana app integration |\n| `@ledgerhq/hw-transport` | 6.31.4 | Ledger transport layer |\n| `@ledgerhq/hw-transport-node-hid-singleton` | 6.31.5 | Node.js HID support for Ledger |\n\n### CLI & UI Dependencies\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `@inquirer/prompts` | ^7.5.3 | Interactive prompts |\n| `ora` | 8.1.1 | Spinner/loading animations |\n| `cli-progress` | 3.12.0 | Progress bars |\n| `ansis` | ^3.17.0 | ANSI color codes |\n\n### Database & Storage\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `drizzle-orm` | ^0.45.2 | SQL ORM for local storage |\n\n### Solana\n\n| Package | Version | Purpose |\n|---------|---------|---------|\n| `@solana/web3.js` | ^1.98.2 | Solana JavaScript library |\n\n## Available Scripts\n\n### Build & Development\n\n```bash\n# Clean build artifacts\npnpm clean\n\n# Build TypeScript\npnpm build\n\n# Clean build (recommended for CI)\npnpm build:clean\n\n# Development mode with hot-reload\npnpm dev\n```\n\n### Testing\n\n```bash\n# Run tests (Mocha)\npnpm test\n\n# Run validator for integration testing\npnpm validator\n\n# Stop validator\npnpm validator:stop\n```\n\n### Linting\n\n```bash\n# Check for linting errors\npnpm lint\n\n# Auto-fix linting issues\npnpm lint:fix\n```\n\n### Release & Packaging\n\n```bash\n# Generate OCLIF manifest and README\npnpm prepack\n\n# Clean up after packing\npnpm postpack\n\n# Update version and regenerate README\npnpm version\n```\n\n### Verification\n\n```bash\n# Type check and clean build\npnpm verify\n```\n\n### Utility\n\n```bash\n# Create test candy machine directory\npnpm create-test-cm\n```\n\n## Project Structure\n\n```\n@metaplex-foundation/cli/\n├── bin/\n│   ├── run.js          # Production entry point\n│   └── dev.js         # Development entry point\n├── dist/              # Compiled TypeScript output\n│   ├── commands/      # CLI command implementations\n│   └── index.js       # Main entry\n├── test/              # Test files (*.test.ts)\n├── package.json      # This file\n├── tsconfig.build.json\n└── oclif.manifest.json\n```\n\n## Installation\n\n```bash\n# Using pnpm (recommended)\npnpm install\n\n# Using npm\nnpm install\n\n# Using yarn\nyarn install\n```\n\n## Usage\n\n```bash\n# Display help\nmplx --help\n\n# Display version\nmplx --version\n\n# Run a command (specific commands depend on installed plugins)\nmplx <command> [args] [flags]\n```\n\n## Development Requirements\n\n- **Node.js**: >= 20.0.0\n- **pnpm**: 9.12.3 (enforced via `packageManager` field)\n- **TypeScript**: 5.8.3\n- **OCLIF**: 4.17.46\n\n## Development Dependencies\n\nKey tools for contributing to this CLI:\n\n- `@oclif/core` — OCLIF framework\n- `@oclif/test` — CLI testing utilities\n- `mocha` — Test runner\n- `chai` — Assertion library\n- `typescript` — Type checking\n- `tsx` — TypeScript executor for scripts\n- `ts-node` — TypeScript Node.js runtime\n- `eslint` — Code linting\n- `@metaplex-foundation/amman` — Local validator and testing\n\n## Files Distribution\n\nThe following files are included in the published package:\n\n```json\n\"files\": [\n  \"bin\",\n  \"dist\",\n  \"oclif.manifest.json\",\n  \"oclif.json\",\n  \"oclif.manifest.json.js\"\n]\n```\n\n## Related Documentation\n\n- [Metaplex Documentation](https://docs.metaplex.com/)\n- [OCLIF Documentation](https://oclif.io/docs)\n- [Umi SDK](https://github.com/metaplex-foundation/umi)\n- [Solana Web3.js](https://solana-labs.github.io/solana-web3.js/)","other-readme-md":"# Other — README.md\n\n# Metaplex CLI\n\nA powerful command-line interface for interacting with the Metaplex ecosystem on Solana. This CLI provides tools for managing digital assets, collections, tokens, candy machines, and more.\n\n## Beta Notice\n\nThis CLI and software is in beta and public testing. Be aware that:\n\n- Bugs may exist and functionality may change daily as updates are implemented\n- Commands and their parameters are subject to change\n- Documentation may be incomplete at times\n\n## Installation\n\n### Global NPM Installation\n\nInstall the CLI globally using npm:\n\n```sh\nnpm install -g @metaplex-foundation/cli\n```\n\nAfter installation, invoke the CLI using the `mplx` command:\n\n```sh\nmplx --help\n```\n\n### Development Installation\n\nFor contributors or those wanting the latest unreleased changes:\n\n```sh\ngit clone https://github.com/metaplex-foundation/cli.git\ncd cli\nnpm install\nnpm run build\nnpm run mplx\n```\n\nThe `npm run mplx` command invokes the CLI from the local build.\n\n## Quick Start\n\n### 1. Configure Your Environment\n\nBefore creating assets, configure your RPC endpoint and wallet.\n\n#### RPC Configuration\n\nThe CLI supports multiple RPC endpoints. Add, list, and switch between them:\n\n```sh\n# Add a new RPC endpoint\nmplx config rpcs add rpc1 https://my-custom-rpc.com/rpc\n\n# List all configured RPCs\nmplx config rpcs list\n\n# Interactively select an active RPC\nmplx config rpcs set\n```\n\n#### Wallet Configuration\n\nSimilarly manage multiple wallets:\n\n```sh\n# Add a new wallet (supports keypair files)\nmplx config wallets add wallet1 ./path/to/keypair.json\n\n# List all configured wallets\nmplx config wallets list\n\n# Interactively select an active wallet\nmplx config wallets set\n```\n\n### 2. Create Assets\n\n#### Create a Collection\n\n```sh\n# Create with pre-hosted metadata URI\nmplx core collection create --name \"My Collection\" --uri \"https://example.com/collection-metadata.json\"\n\n# Create with local files (CLI handles upload)\nmplx core collection create --files --image ./image.png --json ./collection-metadata.json\n\n# Generate template files for manual editing\nmplx core collection template\n```\n\n#### Create an Asset\n\n```sh\n# Create with pre-hosted metadata URI\nmplx core asset create --name \"My Asset\" --uri \"https://example.com/metadata.json\"\n\n# Create with local files\nmplx core asset create --files --image ./image.png --json ./metadata.json\n\n# Generate template files\nmplx core asset template\n```\n\n#### Create a Token\n\n```sh\n# Interactive token creation wizard\nmplx toolbox token create --wizard\n\n# Or specify parameters directly\nmplx toolbox token create \\\n  --name \"My Token\" \\\n  --symbol \"TOKEN\" \\\n  --decimals 9 \\\n  --image ./token-logo.png \\\n  --mint 1000000000\n```\n\n## Candy Machine\n\nThe CLI includes a wizard for creating and managing NFT drops:\n\n```sh\nmplx cm create --wizard\n```\n\nThe wizard guides you through:\n\n- Directory and asset selection\n- Collection configuration\n- Guard setup (minting rules)\n- Guard groups (tiered minting)\n- Asset validation and upload\n- Candy machine creation\n\n### Wizard Features\n\n- **Guided prompts**: Step-by-step interactive workflow\n- **Asset validation**: Automatic discovery with actionable error messages\n- **Progress tracking**: Visual indicators for uploads and transactions\n- **Safety features**: File overwrite protection and abort options\n- **Cache reuse**: Smart detection of previously uploaded assets\n- **Completion summary**: Detailed output with next steps and transaction IDs\n\n### Example Output\n\n```\n--------------------------------\n    Welcome to the Candy Machine Creator Wizard!\n    This wizard will guide you through the process of creating a new candy machine.                \n--------------------------------\n✔ Directory name for your Candy Machine project? candy1\n✔ Directory \"candy1\" already exists and contains 3 files. Type 'y' to use, 'n' to abort, or 'q' to quit: y\n✔ Move your assets to the assets folder and press enter to continue, or type q to abort \n📁 Asset Discovery:\n✔ Found 100 JSON files\n✔ Found 100 image files\n✔ Found collection metadata\n✔ Found collection image\n✔ Should the NFTs be mutable? (y/n or q to quit) y\n✔ Do you want to create global guards? (y/n or q to quit) n\n✔ Do you want to create guard groups for minting? (y/n or q to quit) n\n⚠️  Warning: You have not set any global guards or guard groups. This may result in a non-functional candy machine. Consider adding at least one guard or group.\n\nConfiguration saved to: /path/to/candy1/cm-config.json\n📁 Using existing asset cache (100 items already uploaded)\n✔ Upload validation completed\n✔ Collection image uploaded\n✔ Collection metadata uploaded\n✔ Collection created\n⠦ Creating candy machine\nTx confirmed\n✔ Candy machine created - HVgv54E36CRxGZoq9TCWafTV6WA1tMX33rNXrBX3wW9\n✔ Sent 13 transactions\n✔ Confirmed 13 transactions\n\n🎉 Wizard complete! Here is a summary of your setup:\n- Directory: candy1\n- Assets: 100 JSON, 100 images, 0 animations\n- Collection: Collection\n- Collection ID: 5hJkVr6ETbPdtxmv8LfcUt1eumvSuWVZPRqqNS6byNYh\n🎉 Candy machine created successfully!\n```\n\nFor advanced candy machine usage, see the [Candy Machine Documentation](docs/candyMachine/index.md).\n\n## Command Structure\n\nCommands follow a consistent pattern:\n\n```\nmplx <program> <object> <command> [flags]\n```\n\n| Component | Description |\n|-----------|-------------|\n| `program` | The feature group (core, cm, toolbox, config) |\n| `object` | The entity to operate on (asset, collection, token, etc.) |\n| `command` | The action to perform (create, update, burn, etc.) |\n| `flags` | Parameters and options |\n\n### Examples\n\n```sh\nmplx core asset create --name \"Asset Name\" --uri \"metadata.json\"\nmplx core collection burn --mint-id <MINT_ADDRESS>\nmplx cm upload --keypair ./wallet.json\n```\n\n### Getting Help\n\nUse `--help` on any command for detailed usage information:\n\n```sh\nmplx --help\nmplx core --help\nmplx core asset create --help\n```\n\n## Command Groups\n\n### Core Commands\n\nManage digital assets and collections using the Core program:\n\n- **Asset operations**: Create, update, burn, transfer, and manage NFTs\n- **Collection operations**: Create and manage asset collections\n- **Plugin system**: Extend asset functionality with plugins\n\nSee [Core Commands Documentation](docs/core.md).\n\n### Candy Machine Commands\n\nNFT minting and drop management:\n\n- **Creation**: Create candy machines with wizard or manual workflow\n- **Upload**: Upload and index assets\n- **Insertion**: Add assets to existing candy machines\n- **Guards**: Configure minting rules and access controls\n- **Groups**: Create tiered minting groups\n\nSee [Candy Machine Documentation](docs/candyMachine/index.md).\n\n### Configuration Commands\n\nManage CLI settings:\n\n- **RPC management**: Add, list, and switch RPC endpoints\n- **Wallet management**: Add, list, and switch wallets\n- **Explorer preferences**: Configure block explorer links\n\nSee [Configuration Documentation](docs/config.md).\n\n### Toolbox Commands\n\nUtility operations:\n\n- **SOL operations**: Transfer and manage SOL\n- **Token management**: Create and manage SPL tokens\n- **Rent calculations**: Estimate rent costs for accounts\n\nSee [Toolbox Documentation](docs/toolbox.md).\n\n## Architecture\n\n```mermaid\ngraph TB\n    subgraph \"Metaplex CLI\"\n        CLI[CLI Entry Point<br/>mplx]\n    end\n\n    subgraph \"Command Groups\"\n        Config[Config<br/>Commands]\n        Core[Core<br/>Commands]\n        CM[Candy Machine<br/>Commands]\n        Toolbox[Toolbox<br/>Commands]\n    end\n\n    subgraph \"Solana Programs\"\n        CoreProgram[Metaplex Core]\n        CMProgram[Candy Machine]\n        TokenProgram[Token Program]\n    end\n\n    CLI --> Config\n    CLI --> Core\n    CLI --> CM\n    CLI --> Toolbox\n\n    Core --> CoreProgram\n    CM --> CMProgram\n    Toolbox --> TokenProgram\n```\n\nThe CLI is built on [oclif](https://oclif.io), a framework for building command-line interfaces in Node.js.\n\n## Troubleshooting\n\n### Common Issues\n\n**RPC Connection Errors**\n- Verify your RPC endpoint is correct: `mplx config rpcs list`\n- Try switching to a different RPC: `mplx config rpcs set`\n\n**Wallet Not Found**\n- Ensure the keypair file path is correct\n- Check file permissions allow reading the keypair\n\n**Transaction Failures**\n- Verify sufficient SOL balance for transactions and rent\n- Check that the connected wallet has necessary permissions\n- Ensure RPC is synced and not returning stale data\n\n### Getting Help\n\n- Check command help: `mplx [COMMAND] --help`\n- Review documentation at the links above\n- Report issues at https://github.com/metaplex-foundation/cli/issues","other-results-sarif":"# Other — results.sarif\n\n# CodeQL SARIF Security Analysis Results\n\n## Overview\n\nThis module (`results.sarif`) is a **SARIF (Static Analysis Results Interchange Format)** output file generated by CodeQL, GitHub's static analysis engine. It contains the results of a security scan performed on the codebase.\n\nSARIF is an OASIS standard format for representing static analysis results. This particular file captures findings from a JavaScript/TypeScript security analysis using CodeQL v2.25.2.\n\n## File Structure\n\n```mermaid\nflowchart TB\n    subgraph SARIF_Header[\"SARIF Metadata\"]\n        schema[\"$schema: sarif-2.1.0\"]\n        version[\"version: 2.1.0\"]\n    end\n    \n    subgraph Tool[\"Analysis Tool\"]\n        driver[\"CodeQL Driver\"]\n        notifications[\"Notifications (7)\"]\n        rules[\"Security Rules (80+)\"]\n    end\n    \n    subgraph Extensions[\"CodeQL Extensions\"]\n        js_queries[\"javascript-queries\"]\n        js_all[\"javascript-all\"]\n        threat_models[\"threat-models\"]\n    end\n    \n    subgraph Results[\"Scan Results\"]\n        invocations[\"Invocations\"]\n        extracted_files[\"Extracted Files (200+)\"]\n    end\n    \n    SARIF_Header --> Tool\n    Tool --> Extensions\n    Extensions --> Results\n```\n\n## Key Components\n\n### Tool Configuration\n\n| Property | Value |\n|----------|-------|\n| **Tool** | CodeQL |\n| **Organization** | GitHub |\n| **Version** | 2.25.2 |\n| **Language** | JavaScript/TypeScript |\n\n### Notifications\n\nThe scan includes diagnostic notifications for:\n\n- **Extraction errors** (`js/diagnostics/extraction-errors`) — Files that failed during CodeQL extraction\n- **Successfully extracted files** (`js/diagnostics/successfully-extracted-files`) — Files that were successfully analyzed\n- **Expected extracted files** (`js/baseline/expected-extracted-files`) — Files expected in the source archive\n- **File coverage baseline** — Telemetry for coverage tracking\n- **Platform** — Execution platform information\n- **Database operations** — `database/create` and `database/analyze` events\n\n### Security Rules (80+ rules)\n\nThe analysis checks for numerous security vulnerabilities organized by category:\n\n#### Injection Vulnerabilities\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/command-line-injection` | Uncontrolled command line | **Error** |\n| `js/shell-command-constructed-from-input` | Unsafe shell command from input | **Error** |\n| `js/sql-injection` | Database query built from user-controlled sources | **Error** |\n| `js/xpath-injection` | XPath injection | **Error** |\n| `js/code-injection` | Code injection | **Error** |\n| `js/template-object-injection` | Template Object Injection | **Error** |\n\n#### Cross-Site Scripting (XSS)\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/xss` | Client-side cross-site scripting | **Error** |\n| `js/reflected-xss` | Reflected cross-site scripting | **Error** |\n| `js/stored-xss` | Stored cross-site scripting | **Error** |\n| `js/xss-through-dom` | DOM text reinterpreted as HTML | Warning |\n| `js/xss-through-exception` | Exception text reinterpreted as HTML | Warning |\n\n#### Cryptography & Data Protection\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/disabling-certificate-validation` | Disabling certificate validation | **Error** |\n| `js/weak-cryptographic-algorithm` | Broken or weak cryptographic algorithm | Warning |\n| `js/insufficient-key-size` | Weak cryptographic key | Warning |\n| `js/clear-text-storage-of-sensitive-data` | Clear text storage of sensitive information | **Error** |\n| `js/clear-text-logging` | Clear-text logging of sensitive information | **Error** |\n| `js/insecure-randomness` | Cryptographically weak RNG | Warning |\n\n#### Prototype & Object Manipulation\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/prototype-pollution` | Prototype-polluting merge call | **Error** |\n| `js/prototype-polluting-assignment` | Prototype-polluting assignment | Warning |\n| `js/prototype-pollution-utility` | Prototype-polluting function | Warning |\n\n#### Input Validation & Sanitization\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/incomplete-sanitization` | Incomplete string escaping | Warning |\n| `js/incomplete-html-attribute-sanitization` | Incomplete HTML attribute sanitization | Warning |\n| `js/incomplete-url-substring-sanitization` | Incomplete URL substring sanitization | Warning |\n| `js/client-side-unvalidated-url-redirection` | Client-side URL redirect | **Error** |\n| `js/server-side-unvalidated-url-redirection` | Server-side URL redirect | Warning |\n\n#### Regular Expression Vulnerabilities\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/redos` | Inefficient regular expression (exponential time) | **Error** |\n| `js/polynomial-redos` | Polynomial regular expression | Warning |\n| `js/incomplete-hostname-regexp` | Incomplete hostname regex | Warning |\n| `js/overly-large-range` | Overly permissive regex range | Warning |\n\n#### Framework-Specific Issues\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/disabling-electron-websecurity` | Electron webSecurity disabled | **Error** |\n| `js/enabling-electron-insecure-content` | Electron allowRunningInsecureContent | **Error** |\n| `js/angular/double-compilation` | Angular double compilation | Warning |\n| `js/angular/disabling-sce` | Angular SCE disabled | Warning |\n| `js/unsafe-jquery-plugin` | Unsafe jQuery plugin | Warning |\n\n#### Other Notable Rules\n\n| Rule ID | Description | Severity |\n|---------|-------------|----------|\n| `js/request-forgery` | Server-side request forgery (SSRF) | **Error** |\n| `js/zipslip` | Zip Slip directory traversal | **Error** |\n| `js/path-injection` | Uncontrolled data in path expression | **Error** |\n| `js/missing-csrf-validation` | Missing CSRF middleware | **Error** |\n| `js/xxe` | XML external entity expansion | **Error** |\n| `js/unsafe-deserialization` | Deserialization of user-controlled data | Warning |\n| `js/cors-permissive-configuration` | Permissive CORS configuration | Warning |\n| `js/stack-trace-exposure` | Information exposure through stack trace | Warning |\n\n### CodeQL Extensions Used\n\nThe analysis leveraged three CodeQL packs:\n\n1. **codeql/javascript-queries** (v2.3.7) — Security and quality queries for JavaScript\n2. **codeql/javascript-all** (v2.6.27) — Comprehensive JavaScript/TypeScript library\n3. **codeql/threat-models** (v1.0.47) — Threat modeling support\n\n## Analyzed Files\n\nThe scan processed **200+ JavaScript/TypeScript files** across the following categories:\n\n### Configuration Files\n- `.eslintrc.json`, `eslint.config.js`\n- `.oclifrc.cjs`, `.validator.cjs`\n- `package.json`, `pnpm-lock.yaml`\n- `oclif.manifest.json.js`\n\n### CLI Entry Points\n- `bin/dev.js`, `bin/run.js`\n- `scripts/createTestCandyMachineDirectory.js`\n\n### Source Commands (`src/commands/`)\n- **Agents**: `fetch.ts`, `register.ts`, `set-agent-token.ts`, executive subcommands\n- **BG (Block Generator)**: `collection/`, `nft/`, `tree/` subcommands\n- **CM (Candy Machine)**: `create.ts`, `fetch.ts`, `insert.ts`, `upload.ts`, `validate.ts`, `withdraw.ts`, `guard/` subcommands\n- **Config**: `get.ts`, `set.ts`, `explorer/`, `rpcs/`, `storage/`, `wallets/` subcommands\n- **Core**: `asset/`, `collection/`, `plugins/` subcommands\n- **Distro**: `create.ts`, `deposit.ts`, `fetch.ts`, `withdraw.ts`\n- **Genesis**: `bucket/`, `presale/`, `launch/`, `claim.ts`, `create.ts`, `finalize.ts`, etc.\n- **TM (Token Manager)**: `create.ts`, `transfer.ts`, `update.ts`\n- **Toolbox**: `lut/`, `rent.ts`, `sol/`, `storage/`, `template/`, `token/`, `transaction.ts`\n\n### Library Files (`src/lib/`)\n- `Context.ts`, `FileSigner.ts`, `LedgerSigner.ts`, `StandardColors.ts`\n- `cm/` utilities: candy guards schema, CM utilities, JSON guard parser, prompts, types, upload/validation helpers\n- `core/` utilities: burn, create, fetch, update operations\n\n### Root Files\n- `constants.ts`, `explorers.ts`, `index.ts`\n\n## Interpreting Results\n\n### Severity Levels\n\n| Level | Meaning |\n|-------|---------|\n| **Error** | High-confidence security vulnerability requiring immediate attention |\n| **Warning** | Potential security issue or lower-confidence finding |\n\n### Security Severity Scores\n\nMany rules include a `security-severity` rating (0.0–10.0):\n\n- **9.0+**: Critical — Remote code execution, complete bypass\n- **7.0–8.9**: High — Significant security impact\n- **5.0–6.9**: Medium — Moderate security impact\n- **<5.0**: Low — Minor security concerns\n\n### CWE References\n\nRules reference Common Weakness Enumeration (CWE) IDs for standardized vulnerability classification. For example:\n- CWE-079: Cross-site Scripting\n- CWE-089: SQL Injection\n- CWE-078: OS Command Injection\n- CWE-022: Path Traversal\n\n## Usage\n\nThis SARIF file can be:\n\n1. **Imported into GitHub Advanced Security** — Displays findings in the Security tab\n2. **Uploaded to SARIF viewers** — Tools like SARIF UI or VS Code SARIF extension\n3. **Integrated into CI/CD** — Parse results for build pass/fail decisions\n4. **Used for security reporting** — Generate vulnerability reports\n\n## Notes\n\n- **No findings in this scan** — The `results` array is empty (indicated by the truncated output and no actual vulnerability entries). This means either:\n  - No security issues were detected at default severity thresholds\n  - The codebase passed all enabled security checks\n  \n- **Extraction-only mode** — The file shows successful extraction notifications for all analyzed files, indicating a complete CodeQL database was created\n\n- **This is a data file, not executable code** — The SARIF file is output from the analysis process, not part of the application's runtime code","other-scripts":"# Other — scripts\n\n# Test Candy Machine Directory Creator\n\nA development utility script that creates a complete test candy machine directory structure with assets, metadata, and optional configuration files. This is useful for testing candy machine operations without needing to go through the full upload and minting flow.\n\n## Overview\n\nThe script generates a local directory containing:\n\n- **Asset files** — Numbered PNG images and JSON metadata files\n- **Asset cache** — A `asset-cache.json` file tracking asset state\n- **Collection files** — A collection NFT image and metadata\n- **Config file** (optional) — A `cm-config.json` with guard configurations\n\nThis mimics the directory structure that would be created during a real candy machine asset preparation process, making it useful for integration testing and local development workflows.\n\n## CLI Usage\n\n```bash\nnode scripts/createTestCandyMachineDirectory.js [options]\n```\n\n### Options\n\n| Flag | Description | Default |\n|------|-------------|---------|\n| `--with-config` | Include `cm-config.json` with guard settings | `false` |\n| `--no-assets` | Skip creating asset files | `false` |\n| `--name=<value>` | Name of the candy machine directory | `candy1` |\n| `--assets=<number>` | Number of assets to create | `50` |\n| `--collection=<mint>` | Collection mint address | `undefined` |\n| `--uploaded` | Mark assets as already uploaded (includes URIs) | `false` |\n\n### Examples\n\n```bash\n# Create minimal test directory with 50 assets\nnode scripts/createTestCandyMachineDirectory.js\n\n# Create with config and custom name\nnode scripts/createTestCandyMachineDirectory.js --with-config --name=my-candy-machine\n\n# Create 100 assets with collection\nnode scripts/createTestCandyMachineDirectory.js --assets=100 --collection=4xbJp9sjeTEhheUDg8M1nJUomZcGmFZsjt9Gg3RQZAWp\n\n# Create pre-uploaded assets (with URIs in cache)\nnode scripts/createTestCandyMachineDirectory.js --uploaded\n```\n\n## Programmatic Usage\n\nThe script exports `createTestCandyMachineAssetDirectory` for use in other code:\n\n```javascript\nimport { createTestCandyMachineAssetDirectory } from './scripts/createTestCandyMachineDirectory.js';\n\n// Basic usage\nawait createTestCandyMachineAssetDirectory();\n\n// Custom options\nawait createTestCandyMachineAssetDirectory({\n    withConfig: true,\n    withAssets: true,\n    name: 'test-candy',\n    numberOfAssets: 25,\n    collection: '4xbJp9sjeTEhheUDg8M1nJUomZcGmFZsjt9Gg3RQZAWp',\n    uploaded: true\n});\n```\n\n## Output Directory Structure\n\nWhen run with default options, creates:\n\n```\ncandy1/\n├── asset-cache.json\n└── assets/\n    ├── 0.png\n    ├── 0.json\n    ├── 1.png\n    ├── 1.json\n    ├── ...\n    ├── 49.png\n    ├── 49.json\n    ├── collection.png\n    └── collection.json\n```\n\nWhen run with `--with-config`:\n\n```\ncandy1/\n├── asset-cache.json\n├── cm-config.json\n└── assets/\n    └── ...\n```\n\n## Key Components\n\n### createTestCandyMachineAssetDirectory(options)\n\nMain orchestration function. Creates the directory structure and delegates to helper functions based on options.\n\n**Parameters:**\n- `options.withConfig` — Whether to create the config file\n- `options.withAssets` — Whether to create asset files\n- `options.name` — Directory name (also used in config)\n- `options.numberOfAssets` — Count of assets to generate\n- `options.collection` — Collection mint address\n- `options.uploaded` — Whether to populate URI fields in cache\n\n### createDummyConfig(candyMachineDir, numberOfAssets, collection)\n\nGenerates a `cm-config.json` file with sample guard configurations. The config includes:\n\n- Two guard groups (`test1` and `test2`)\n- `solPayment` guard with lamport amounts and destination addresses\n- `assetBurn` guard with required collection\n- `thirdPartySigner` guard\n\n### createAssetMetadata(index, collection)\n\nCreates JSON metadata for an individual asset following standard NFT metadata format:\n\n```json\n{\n    \"name\": \"Asset 0\",\n    \"description\": \"Asset 0 description\",\n    \"image\": \"https://example.com/0.png\",\n    \"attributes\": [{ \"trait_type\": \"Index\", \"value\": \"0\" }],\n    \"properties\": {\n        \"files\": [{ \"uri\": \"https://example.com/0.png\", \"type\": \"image/png\" }],\n        \"category\": \"image\"\n    }\n}\n```\n\n### createDummyPNG()\n\nGenerates a minimal valid 1x1 PNG file as a Buffer. This is used for all asset images to avoid needing external image files during testing.\n\n## Integration Notes\n\nThis script is standalone and has no dependencies on other modules in the codebase. It writes files to the current working directory, creating a subdirectory with the candy machine name.\n\nThe generated structure is compatible with candy machine upload and mint operations that expect:\n- Numbered PNG/JSON pairs in an `assets/` subdirectory\n- A `asset-cache.json` tracking upload state\n- Optional `cm-config.json` with guard definitions","other-src":"# Other — src\n\n# `src/` Module\n\nThis module provides foundational configuration constants for Solana blockchain interactions and sets up the CLI entry point using OCLIF.\n\n## Overview\n\n```\nsrc/\n├── constants.ts    # Solana blockchain constants\n└── index.ts        # CLI entry point\n```\n\nThe module serves two purposes:\n1. **Configuration** — Defines chain identifiers and program addresses used throughout the codebase\n2. **CLI bootstrap** — Exports the OCLIF `run` function to handle command-line invocation\n\n## Constants\n\n### `MAINNET_GENESIS_HASH`\n\n```typescript\nexport const MAINNET_GENESIS_HASH = \"GH7ome3EiwEr7tu9JuTh2dpYWBJK3z69Xm1ZE3MEE6JC\"\n```\n\nThe genesis block hash for Solana mainnet-beta. This identifies the initial block of the Solana blockchain and is used for network validation and chain identification.\n\n**Usage context:** Typically used when verifying network connectivity or validating that the client is connected to the expected Solana cluster.\n\n### `TOKEN_AUTH_RULES_ID`\n\n```typescript\nexport const TOKEN_AUTH_RULES_ID = publicKey('auth9SigNpDKz4sJJ1DfCTuZrZNSAgh9sFD3rboVmgg')\n```\n\nThe public key (program ID) for Solana's **Token Auth Rules Program**. This program handles authorization rules for programmable NFTs (pNFTs).\n\n**Purpose:** The Token Auth Rules Program enables creators to define custom authorization conditions for NFT transfers, such as:\n- Time-based unlock schedules\n- Holder requirements\n- Custom permission logic\n\n**Usage context:** When working with pNFTs that have authorization rulesets, this program ID is used to validate that operations comply with the defined rules.\n\n## CLI Entry Point\n\n### `index.ts`\n\n```typescript\nexport {run} from '@oclif/core'\n```\n\nRe-exports the `run` function from `@oclif/core`, which serves as the CLI bootstrap mechanism. When the CLI tool is invoked, OCLIF's `run` function:\n\n1. Parses command-line arguments\n2. Routes to the appropriate command handler\n3. Executes the command and returns the result\n\nThis is the standard OCLIF pattern for building command-line interfaces in TypeScript/JavaScript.\n\n## Integration\n\nThis module connects to the broader codebase as follows:\n\n```mermaid\ngraph LR\n    A[CLI invocation] --> B[src/index.ts - run()]\n    B --> C[Command handlers]\n    C --> D[src/constants.ts]\n    D --> E[Solana programs]\n    \n    D --> F[Token Auth Rules Program]\n    D --> G[Network validation]\n```\n\n- **`constants.ts`** exports values used by command implementations that interact with Solana\n- **`index.ts`** is the entry point that OCLIF invokes when the CLI runs\n\n## Dependencies\n\n| Package | Purpose |\n|---------|---------|\n| `@metaplex-foundation/umi` | Provides `publicKey` helper for parsing Solana addresses |\n| `@oclif/core` | CLI framework providing the `run` function |","other-test-assets-cm":"# Other — test-assets-cm\n\n# Test Assets — Candy Machine (test-assets-cm)\n\n## Overview\n\nThis module contains a collection of six NFT metadata files (`0.json` through `5.json`) in the Metaplex standard format. These files serve as test assets for a Solana Candy Machine deployment, representing a minimal collection of numbered NFTs.\n\n## Purpose\n\nThese JSON files are designed to:\n\n- Provide valid NFT metadata for testing Candy Machine minting workflows\n- Serve as reference examples for the Metaplex JSON schema\n- Enable end-to-end testing of NFT collection deployments on Solana\n\n## Metadata Schema\n\nEach file follows the Metaplex standard for NFT metadata. Below is the complete schema with field descriptions:\n\n```json\n{\n  \"name\": \"Numbers #N\",           // Display name of the NFT\n  \"symbol\": \"NUMBERS\",            // Token symbol (max 10 chars)\n  \"image\": \"https://...\",         // URL to the NFT image\n  \"properties\": {                 // Extended metadata\n    \"files\": [...],               // Array of file references\n    \"category\": \"image\",          // Asset category\n    \"creators\": [...]             // Royalty distribution\n  },\n  \"description\": \"...\",           // Human-readable description\n  \"seller_fee_basis_points\": 500, // Royalty percentage (500 = 5%)\n  \"attributes\": [...]             // On-chain traits for rarity/display\n}\n```\n\n## Collection Details\n\n| Field | Value |\n|-------|-------|\n| Collection Name | Numbers |\n| Symbol | NUMBERS |\n| Total Items | 6 (indexed 0–5) |\n| Creator Address | `4xbJp9sjeTEhheUDg8M1nJUomZcGmFZsjt9Gg3RQZAWp` |\n| Royalty | 5% (500 basis points) |\n| Category | Image |\n\n## Attribute Traits\n\nEach NFT includes a single attribute defining its number:\n\n```json\n{\n  \"trait_type\": \"Number\",\n  \"value\": \"0\"  // Ranges from \"0\" through \"5\"\n}\n```\n\nThis trait is stored on-chain and can be used by marketplaces to display rarity information or enable filtering.\n\n## Creator Configuration\n\nAll NFTs assign 100% of royalties to a single creator address:\n\n```json\n\"creators\": [\n  {\n    \"address\": \"4xbJp9sjeTEhheUDg8M1nJUomZcGmFZsjt9Gg3RQZAWp\",\n    \"share\": 100\n  }\n]\n```\n\n## Image Sources\n\nThe collection uses two different storage providers for demonstration purposes:\n\n- **Index 0**: Irys gateway (`gateway.irys.xyz`)\n- **Indices 1–5**: Arweave (`arweave.net`)\n\nThis variation reflects common real-world scenarios where NFT collections may migrate storage or use different providers for different mint batches.\n\n## Usage in Candy Machine\n\nWhen deploying a Candy Machine, these JSON files would typically be:\n\n1. Uploaded to a permanent storage solution (Arweave, Irys, or IPFS)\n2. Referenced in the Candy Machine configuration via their URI paths\n3. Minted sequentially or randomly based on the collection's settings\n\n## File Inventory\n\n```\ntest-assets/cm/\n├── 0.json  → Numbers #0\n├── 1.json  → Numbers #1\n├── 2.json  → Numbers #2\n├── 3.json  → Numbers #3\n├── 4.json  → Numbers #4\n└── 5.json  → Numbers #5\n```\n\n## Integration Notes\n\nThis module is a **static data module** — it contains no executable code. It is consumed by:\n\n- Candy Machine deployment scripts\n- NFT minting utilities\n- Testing frameworks that validate metadata parsing\n\nWhen integrating, ensure your tooling supports the Metaplex JSON schema version used here (standard v1.0 format).","other-test-assets-core":"# Other — test-assets-core\n\n# Test Assets: Core Module\n\n## Overview\n\nThe `test-assets/core` directory contains static test data for NFT (Non-Fungible Token) testing within the broader Candy Machine or similar Solana NFT minting project. These assets simulate real NFT metadata, plugin configurations, and binary data that the codebase processes during testing.\n\n## Asset Structure\n\nThe module contains three categories of test assets:\n\n| File Pattern | Count | Purpose |\n|--------------|-------|---------|\n| `{n}.json` | 16 files (0-15) | NFT metadata JSON files |\n| `{n}-plugins.json` | 1 file (1-plugins.json) | Plugin configuration for NFT #1 |\n| `plugins.json` | 1 file | Default plugin configuration |\n| `test.json` | 1 file | Binary data (byte array) |\n\n## NFT Metadata Files (`{n}.json`)\n\nThese files follow the Metaplex NFT metadata standard (version 1.0), which defines the on-chain and off-chain data structure for Solana NFTs.\n\n### Standard Fields\n\n```json\n{\n  \"name\": \"Numbers #N\",\n  \"symbol\": \"NUMBERS\",\n  \"image\": \"https://...\",\n  \"properties\": {\n    \"files\": [{ \"uri\": \"...\", \"type\": \"image/png\" }],\n    \"category\": \"image\",\n    \"creators\": [{ \"address\": \"...\", \"share\": 100 }]\n  },\n  \"description\": \"A set of test NFTs for the Solana blockchain\",\n  \"seller_fee_basis_points\": 500,\n  \"attributes\": [{ \"trait_type\": \"Number\", \"value\": \"N\" }]\n}\n```\n\n### Field Reference\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `name` | string | Display name of the NFT |\n| `symbol` | string | Token symbol (max 10 chars) |\n| `image` | string | Primary image URL (Irys or Arweave) |\n| `properties.files` | array | Additional file references with MIME types |\n| `properties.category` | string | Asset category (e.g., \"image\", \"video\") |\n| `properties.creators` | array | Creator addresses and share percentages |\n| `description` | string | Human-readable description |\n| `seller_fee_basis_points` | number | Royalty percentage (500 = 5%) |\n| `attributes` | array | On-chain traits for rarity/filtering |\n\n### Notable Variations\n\n**File 0.json** — Uses an embedded Irys gateway URL in both `image` and `properties.files[0].uri`:\n\n```json\n{\n  \"image\": \"https://gateway.irys.xyz/AaVaCEGBAqAVBSAGvgWgh3SNcidZ29BxhhETFENTvVMx\",\n  \"properties\": {\n    \"files\": [{\n      \"uri\": \"https://gateway.irys.xyz/AaVaCEGBAqAVBSAGvgWgh3SNcidZ29BxhhETFENTvVMx\",\n      \"type\": \"image/png\"\n    }]\n  }\n}\n```\n\n**Files 1-15** — Use Arweave URLs for images and relative paths (`\"uri\": \"N.png\"`) in the files array.\n\n## Plugin Configuration Files\n\nThe plugin system extends standard NFT metadata with programmable behavior.\n\n### `plugins.json` and `1-plugins.json`\n\nBoth files contain identical plugin configurations:\n\n```json\n[\n  {\n    \"type\": \"Attributes\",\n    \"authority\": { \"type\": \"Address\", \"address\": \"...\" },\n    \"attributeList\": [{ \"key\": \"Background\", \"value\": \"Blue\" }]\n  },\n  {\n    \"type\": \"FreezeDelegate\",\n    \"authority\": { \"type\": \"UpdateAuthority\" },\n    \"frozen\": false\n  },\n  {\n    \"type\": \"Royalties\",\n    \"authority\": { \"type\": \"UpdateAuthority\" },\n    \"basisPoints\": 500,\n    \"creators\": [{ \"address\": \"...\", \"percentage\": 100 }],\n    \"ruleSet\": { \"type\": \"None\" }\n  }\n]\n```\n\n### Plugin Types\n\n| Plugin | Purpose |\n|--------|---------|\n| **Attributes** | Key-value metadata that can be modified by an authority |\n| **FreezeDelegate** | Controls whether the NFT is frozen (non-transferable) |\n| **Royalties** | Defines royalty distribution and enforcement rules |\n\n### Authority Types\n\n- **`Address`** — A specific Solana address has authority\n- **`UpdateAuthority`** — The NFT's update authority has authority\n\n### Rule Sets\n\n- **`{ \"type\": \"None\" }`** — No additional rules enforce the plugin\n\n## Binary Test Data (`test.json`)\n\n```json\n[196,167,246,133,208,120,170,18,64,212,95,148,36,206,189,163,59,113,199,38,51,79,43,205,37,0,217,184,194,97,243,55,6,184,75,232,112,213,134,67,249,246,201,68,2,51,17,2,37,158,150,210,205,74,250,134,165,134,20,86,102,248,233,233]\n```\n\nThis is a 64-byte array representing raw binary data. Use cases include:\n\n- Testing image encoding/decoding pipelines\n- Verifying file upload handling for non-JSON assets\n- Simulating arbitrary file payloads\n\n## Creator Address\n\nAll assets reference the same creator address:\n\n```\n4xbJp9sjeTEhheUDg8M1nJUomZcGmFZsjt9Gg3RQZAWp\n```\n\nThis address receives:\n- 100% of creator shares\n- 5% royalty (`seller_fee_basis_points: 500`)\n\n## Usage in Tests\n\nThese assets are loaded by test suites to verify:\n\n1. **Metadata parsing** — Correct extraction of name, symbol, attributes\n2. **Plugin deserialization** — Loading and validating plugin configurations\n3. **URI resolution** — Handling both absolute URLs and relative paths\n4. **Creator/royalty validation** — Verifying royalty calculations\n5. **Binary handling** — Processing non-JSON file formats\n\n## Integration Points\n\n```\ntest-assets/core/\n    │\n    ├── {n}.json          → MetadataParser, NFTBuilder\n    ├── plugins.json     → PluginSystem, AuthorityResolver\n    └── test.json        → FileHandler, BinaryProcessor\n```\n\nThe assets are consumed by core modules that handle:\n- NFT metadata validation and serialization\n- Plugin lifecycle management (attach, authorize, execute)\n- Asset upload to storage providers (Irys, Arweave)","other-test-files":"# Other — test-files\n\n# Test Files Module\n\nThis module contains static test fixtures used throughout the codebase for testing file parsing, serialization, and data processing functionality. These files serve as controlled inputs and expected outputs for various test scenarios.\n\n## Overview\n\nThe test-files module provides:\n\n- **Binary test data** for validating binary format parsers\n- **JSON configuration fixtures** for testing serialization/deserialization\n- **Before/after pairs** for testing data transformation logic\n\n## File Reference\n\n### 3d.glb\n\nA binary glTF 2.0 3D model file containing a simple cube mesh.\n\n| Property | Value |\n|----------|-------|\n| Format | glTF Binary (.glb) |\n| Geometry | Single cube with 36 vertices |\n| Attributes | POSITION, TEXCOORD_0, NORMAL |\n| Index count | 36 (unsigned short indic
