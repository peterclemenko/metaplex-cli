var PAGES = {"base-command-classes":"# Base Command Classes\n\n# Base Command Classes\n\nThis module provides the foundational command classes for the MPLX CLI toolkit. It defines two abstract base classes that all CLI commands extend: `BaseCommand` for general commands and `TransactionCommand` for commands that interact with the blockchain.\n\n## Overview\n\nThe CLI uses [OCLIF](https://github.com/oclif/core) (Open CLI Framework) for command infrastructure. Rather than having each command redefine common flags and initialization logic, these base classes encapsulate:\n\n- **Global flags** (config file, keypair, RPC URL, log level, payer)\n- **Context initialization** (creating a shared context object with connection settings)\n- **JSON output support** (via `--json` flag)\n- **Standardized logging** (including success messages with colored output)\n\n## Class Hierarchy\n\n```\nCommand (OCLIF)\n    │\n    └── BaseCommand\n            │\n            └── TransactionCommand\n```\n\n`BaseCommand` provides the minimal foundation for all commands. `TransactionCommand` extends it with blockchain-specific features like commitment level configuration.\n\n---\n\n## BaseCommand\n\nThe abstract base class for all CLI commands.\n\n### Static Properties\n\n```typescript\nstatic baseFlags = {\n  config: Flags.file({\n    char: 'c',\n    description: 'Path to config file. Default is ~/.config/mplx/config.json',\n    helpGroup: 'GLOBAL',\n  }),\n  keypair: Flags.string({\n    char: 'k',\n    summary: 'Path to keypair file (/path/keypair.json) or ledger (e.g. usb://ledger?key=0)',\n    helpGroup: 'GLOBAL',\n  }),\n  'log-level': Flags.option({\n    default: 'info',\n    helpGroup: 'GLOBAL',\n    options: ['debug', 'warn', 'error', 'info', 'trace'] as const,\n    summary: 'Specify level for logging.',\n  })(),\n  payer: Flags.string({\n    char: 'p',\n    summary: 'Path to keypair file (/path/keypair.json) or ledger (e.g. usb://ledger?key=0)',\n    helpGroup: 'GLOBAL',\n  }),\n  rpc: Flags.string({\n    char: 'r',\n    name: 'rpc',\n    summary: 'RPC URL for the cluster',\n    helpGroup: 'GLOBAL',\n  }),\n}\n```\n\n| Flag | Short | Description |\n|------|-------|--------------|\n| `--config` | `-c` | Path to config file (default: `~/.config/mplx/config.json`) |\n| `--keypair` | `-k` | Path to keypair file or ledger device |\n| `--log-level` | — | Logging level: `debug`, `warn`, `error`, `info`, `trace` (default: `info`) |\n| `--payer` | `-p` | Payer keypair path (distinct from signing keypair) |\n| `--rpc` | `-r` | RPC endpoint URL |\n\n```typescript\nstatic enableJsonFlag = true\n```\n\nEnables the `--json` flag for structured output, allowing commands to return machine-readable JSON instead of human-formatted text.\n\n### Instance Properties\n\n```typescript\nprotected args!: Args<T>\nprotected flags!: Flags<T>\npublic context!: Context\n```\n\n- `args` — Parsed command arguments\n- `flags` — Parsed command flags (including inherited base flags)\n- `context` — The initialized context object containing RPC connection, commitment, keypair, and other runtime configuration\n\n### Methods\n\n#### `init(): Promise<void>`\n\nInitializes the command by parsing flags/args and creating the context. Called automatically by OCLIF before `run()`.\n\n```typescript\npublic async init(): Promise<void> {\n  await super.init()\n  const { args, flags } = await this.parse({...})\n  this.flags = flags as Flags<T>\n  this.args = args as Args<T>\n\n  const configPath = this.flags.config ?? getDefaultConfigPath()\n  this.context = await createContext(configPath, {\n    commitment: this.flags.commitment as Commitment | undefined,\n    keypair: this.flags.keypair,\n    payer: this.flags.payer,\n    rpcUrl: this.flags.rpc,\n  })\n}\n```\n\nThe initialization flow:\n1. Parse OCLIF arguments and flags (including base flags)\n2. Determine config file path (from `--config` flag or default location)\n3. Create a `Context` object with the resolved configuration\n\n#### `logSuccess(message: string): void`\n\nLogs a message using the standard success color (green). Used to indicate successful command completion.\n\n```typescript\npublic logSuccess(message: string): void {\n  this.log(StandardColors.success(message))\n}\n```\n\n#### `catch(err: Error): Promise<unknown>`\n\nError handler hook. Override in subclasses to add custom error handling.\n\n#### `finally(_: Error | undefined): Promise<unknown>`\n\nCleanup hook called after `run()` and `catch()` regardless of success or failure.\n\n---\n\n## TransactionCommand\n\nExtends `BaseCommand` with blockchain transaction capabilities. Use this class for commands that submit transactions to the network.\n\n### Additional Features\n\n**Commitment Level Flag**\n\n```typescript\nstatic baseFlags = {\n  commitment: Flags.string({\n    options: ['processed', 'confirmed', 'finalized'] as const,\n    summary: 'Commitment level',\n    helpGroup: 'GLOBAL',\n  }),\n  // ... other base flags\n}\n```\n\nThe `--commitment` flag specifies the blockchain confirmation level for transactions:\n- `processed` — Minimum confirmation, fastest\n- `confirmed` — Intermediate confirmation\n- `finalized` — Highest confirmation, slowest (recommended for production)\n\n**Explorer Integration**\n\n`TransactionCommand` passes an `explorer` flag to context creation (the call graph shows `explorer: this.flags.explorer`), enabling transaction explorer links in output.\n\n### Static Examples\n\n```typescript\nstatic baseExamples = [\n  '<%= config.bin %> <%= command.id %> --json',\n  '<%= config.bin %> <%= command.id %> --log-level debug',\n  '<%= config.bin %> <%= command.id %> --keypair /path/to/keypair.json',\n  '<%= config.bin %> <%= command.id %> --keypair usb://ledger?key=0',\n  '<%= config.bin %> <%= command.id %> --rpc http://localhost:8899',\n  '<%= config.bin %> <%= command.id %> --commitment finalized',\n]\n```\n\nThese examples appear in command help output to demonstrate common usage patterns.\n\n---\n\n## Type Exports\n\nBoth classes export generic type utilities for type-safe flag and argument access:\n\n```typescript\nexport type Flags<T extends typeof Command> = Interfaces.InferredFlags<T['flags'] & (typeof BaseCommand)['baseFlags']>\nexport type Args<T extends typeof Command> = Interfaces.InferredArgs<T['args']>\n```\n\nThese types combine command-specific flags/args with the base flags, enabling proper type inference in subclasses:\n\n```typescript\nclass MyCommand extends TransactionCommand<typeof MyCommand> {\n  // this.flags is typed as Flags<typeof MyCommand>\n  // this.args is typed as Args<typeof MyCommand>\n}\n```\n\n---\n\n## Usage in Commands\n\nCommands in the toolbox extend these base classes:\n\n```typescript\n// For transaction commands\nexport default class CreateToken extends TransactionCommand<typeof CreateToken> {\n  static description = 'Create a new token'\n\n  async run(): Promise<void> {\n    // this.context is already initialized\n    // this.flags contains all base flags plus command-specific flags\n    const result = await createToken(this.context, this.flags)\n    this.logSuccess(`Token created: ${result}`)\n  }\n}\n\n// For non-transactional commands (read-only, etc.)\nexport default class FetchLUT extends BaseCommand<typeof FetchLUT> {\n  static description = 'Fetch a Lookup Table'\n\n  async run(): Promise<void> {\n    const lut = await fetchLUT(this.context, this.flags.address)\n    this.log(lut)\n  }\n}\n```\n\n---\n\n## Context Creation\n\nBoth commands create a `Context` object during initialization. The context encapsulates:\n\n- RPC connection configuration\n- Commitment level\n- Keypair for signing transactions\n- Payer account\n- Other runtime settings\n\nThis object is then available to all command logic, providing a consistent interface to the blockchain and configuration.\n\n---\n\n## Extending These Classes\n\nWhen creating a new command:\n\n1. **Choose the appropriate base class**: Use `TransactionCommand` for commands that submit transactions, `BaseCommand` for read-only or utility commands.\n\n2. **Define command-specific flags**: Add to the `static flags` property in your subclass.\n\n3. **Define command-specific args**: Add to the `static args` property in your subclass.\n\n4. **Implement `run()`**: The main command logic.\n\n5. **Optionally override `catch()` or `finally()`**: For custom error handling or cleanup.\n\n```typescript\nimport { Flags } from '@oclif/core'\nimport { TransactionCommand } from '../../src/TransactionCommand.js'\n\nexport default class MyCommand extends TransactionCommand<typeof MyCommand> {\n  static description = 'Do something useful'\n\n  static flags = {\n    amount: Flags.string({\n      required: true,\n      summary: 'Amount to process',\n    }),\n    // Inherits: --config, --keypair, --rpc, --commitment, --json, etc.\n  }\n\n  async run(): Promise<void> {\n    const { amount } = this.flags\n    // Command logic here\n    this.logSuccess('Done!')\n  }\n}\n```","candy-machine-library":"# Candy Machine Library\n\n# Candy Machine Library\n\nThe Candy Machine Library provides utilities for managing Metaplex Candy Machine configurations, asset caches, and uploading NFT assets to decentralized storage. This module handles the file-based operations, type definitions, and upload workflows required to prepare and deploy a Candy Machine on Solana.\n\n## Overview\n\n```mermaid\ngraph TB\n    subgraph \"Candy Machine Library\"\n        CM[cm-utils.ts] --> Types[types.ts]\n        UP[uploadItems.ts] --> Types\n    end\n    \n    subgraph \"External Dependencies\"\n        Uploader[uploader module]\n        Validator[validateAssetsFolder]\n        MPL[mpl-core-candy-machine]\n    end\n    \n    CM --> Validator\n    UP --> Uploader\n    Types --> MPL\n```\n\n## Type Definitions (`types.ts`)\n\nThe types module defines the shape of configuration files and asset caches used throughout the Candy Machine workflow.\n\n### Guard Configuration Types\n\nThe library supports numerous guard types that control minting behavior. Each guard has a corresponding raw configuration type:\n\n| Guard Type | Purpose |\n|------------|---------|\n| `RawAddressGate` | Restricts minting to specific wallet addresses |\n| `RawAllocation` | Limits total mints across all wallets |\n| `RawAllowList` | Merkle tree-based allowlist verification |\n| `RawAssetBurn` | Requires burning a collection NFT |\n| `RawAssetGate` | Requires owning a collection NFT |\n| `RawBotTax` | Charges a fee for failed mint attempts (anti-bot) |\n| `RawEndDate` | Sets a cutoff timestamp for minting |\n| `RawFreezeSolPayment` | Locks funds with SOL payment |\n| `RawGatekeeper` | Requires gateway token verification |\n| `RawMintLimit` | Limits mints per wallet |\n| `RawNftPayment` | Requires payment in NFTs |\n| `RawSolPayment` | Requires SOL payment |\n| `RawStartDate` | Sets a start timestamp for minting |\n| `RawTokenPayment` | Requires payment in SPL tokens |\n| `RawVanityMint` | Restricts mint addresses to regex pattern |\n\n#### RawGuardConfig Type\n\n```typescript\nexport type RawGuardConfig = NonEmptyObject<{\n    addressGate?: RawAddressGuard\n    allocation?: RawAllocation\n    // ... all other guards\n}>\n```\n\nThis type uses a utility pattern that ensures at least one guard property is present. The `NonEmptyObject` type prevents creating guard configs with zero guards, which would be meaningless.\n\n#### Guard Groups\n\n```typescript\nexport type RawGuardGroup = {\n    label: string      // Max 6 characters (MAX_GROUP_LABEL_LENGTH)\n    guards: RawGuardConfig\n}\n```\n\nGuard groups allow different minting conditions for different collection tiers.\n\n### Candy Machine Configuration\n\n```typescript\nexport interface CandyMachineConfig {\n    name: string\n    candyMachineId?: string\n    directory?: string\n    assetsDirectory?: string\n    config: {\n        collection: string           // Collection mint address\n        itemsAvailable: number       // Total NFTs to mint\n        isMutable: boolean           // Allow metadata updates\n        isSequential: boolean        // Mint in order\n        guardConfig?: RawGuardConfig // Default guards for all mints\n        groups?: RawGuardGroup[]     // Tier-specific guards\n        configLineSettings?: ConfigLineSettings\n        hiddenSettings?: HiddenSettings\n    }\n}\n```\n\n### Asset Cache\n\nThe asset cache tracks the state of NFT assets throughout the upload process:\n\n```typescript\nexport interface CandyMachineAssetCache {\n    assetItems: Record<number, CandyMachineAssetCacheItem>\n}\n\nexport interface CandyMachineAssetCacheItem {\n    name: string\n    image?: string           // Local file path\n    imageUri?: string        // Uploaded URI\n    imageType?: string       // MIME type\n    animation?: string       // Local animation file\n    animationUri?: string   // Uploaded animation URI\n    animationType?: string   // Animation MIME type\n    json?: string            // Local JSON metadata file\n    jsonUri?: string         // Uploaded metadata URI\n    loaded?: boolean         // Upload completed\n    revealed?: string        // Core NFT address after reveal\n}\n```\n\n## Utility Functions (`cm-utils.ts`)\n\n### Path Management\n\n```typescript\ngetCmPaths(directory?: string) => {\n    configPath: string      // cm-config.json\n    assetCachePath: string  // asset-cache.json\n    assetsDir: string       // assets/\n    baseDir: string         // Working directory\n}\n```\n\nReturns standardized paths for Candy Machine files. Defaults to the current working directory if no directory is specified.\n\n### Configuration File Operations\n\n```typescript\n// Read the candy machine configuration\nreadCmConfig(directory?: string): CandyMachineConfig\n\n// Write configuration to file\nwriteCmConfig(config: CandyMachineConfig, directory?: string): void\n\n// Read the asset cache\nreadAssetCache(directory?: string): CandyMachineAssetCache\n\n// Persist asset cache after updates\nwriteAssetCache(assetCache: CandyMachineAssetCache, directory?: string): void\n```\n\n### Asset Cache Initialization\n\n```typescript\ncreateInitialAssetCache(directory?: string): Promise<CandyMachineAssetCache>\n```\n\nCreates an asset cache by scanning the assets directory. The function:\n\n1. Validates the assets directory exists\n2. Runs `validateAssetsFolder` to ensure proper structure\n3. Reads each JSON metadata file to extract the NFT name\n4. Maps image, animation, and JSON files to sequential indices\n5. Returns an initial cache with `loaded: false` for all items\n\n### Validation Functions\n\n```typescript\n// Verify assets directory exists\nvalidateCmDirectory(directory?: string): void\n\n// Validate configuration before deployment\nvalidateCmConfig(config: CandyMachineConfig): void\n```\n\n`validateCmConfig` performs critical checks:\n- Ensures no existing candy machine ID (prevents accidental overwrites)\n- Verifies a collection is configured\n- Confirms items available is positive\n\n### Settings Resolution\n\n```typescript\ngetConfigLineSettings(candyMachineConfig: CandyMachineConfig) => \n    {","context-signers":"# Context & Signers\n\n# Context & Signers Module\n\nThis module provides the foundation for transaction signing, configuration management, and Umi instance creation throughout the MPLx CLI. It handles the complexity of supporting multiple signer types (keypair files, Ledger hardware wallets, asset-signers) and consolidates configuration from various sources.\n\n## Overview\n\nThe module serves three primary purposes:\n\n1. **Configuration Management** — Reads and merges configuration from files, environment defaults, and runtime overrides\n2. **Signer Resolution** — Creates appropriate signers from various sources (files, Ledger devices, PDA-based asset signers)\n3. **Context Creation** — Initializes a complete Umi instance with all required plugins, signers, and RPC connections\n\n## Configuration System\n\n### ConfigJson Structure\n\nThe configuration is defined in `src/lib/Context.ts` and supports these fields:\n\n```typescript\ntype ConfigJson = {\n  commitment?: Commitment          // Transaction confirmation level\n  keypair?: string                  // Default keypair path\n  payer?: string                    // Fee payer keypair path\n  rpcUrl?: string                   // RPC endpoint URL\n  storage?: {                       // Storage provider config\n    name: 'irys' | 'cascade' | 'turbo'\n    options: any\n  }\n  wallets?: WalletEntry[]          // Named wallet aliases\n  rpcs?: {                          // Named RPC endpoints\n    name: string\n    endpoint: string\n  }[]\n  explorer?: ExplorerType           // Block explorer preference\n  activeWallet?: string             // Currently active wallet name\n}\n```\n\n### Wallet Entries\n\nNamed wallets support three types:\n\n```typescript\ntype WalletEntry = {\n  name: string\n  address: string\n} & (\n  | { type?: 'file'; path: string }           // Keypair file\n  | { type: 'asset-signer'; asset: string; payer?: string }  // PDA-based signer\n  | { type: 'agent'; asset: string; payer?: string }         // Agent-based signer\n)\n```\n\n### Configuration Resolution\n\n`consolidateConfigs()` merges multiple configuration sources with precedence:\n\n1. **Default config** — Hardcoded defaults (`DEFAULT_CONFIG`)\n2. **File config** — Read from `~/.config/mplx/config.json` (or custom path)\n3. **Runtime overrides** — Passed directly to `createContext()`\n\n```typescript\nconst config = consolidateConfigs(DEFAULT_CONFIG, readConfig(configPath), overrides)\n```\n\nThe `readConfig()` function validates the config path exists and is a file, then filters to known configuration keys via `CONFIG_KEYS`.\n\n## Signer Types\n\n### File Signer\n\nLoads a keypair from a JSON file containing the secret key bytes:\n\n```typescript\ncreateSignerFromFile(path: PathOrFileDescriptor): Signer\n```\n\nUsed for standard keypair files in the format `[<byte>, <byte>, ...]`.\n\n### Ledger Signer\n\nConnects to a Ledger hardware wallet via USB HID:\n\n```typescript\ncreateSignerFromLedgerPath(path: string): Promise<Signer>\n```\n\nThe path format is `usb://ledger?key=\"<number>[/<number>][/<number>]\"` where the numbers derive the BIP44 derivation path (default: `44/501/0/0`). The signer implements the full Umi `Signer` interface with `signTransaction`, `signAllTransactions`, and `signMessage` methods.\n\n### Noop Signer\n\nCreates a dummy signer backed by a random keypair, used for PDA-based operations where instructions should be built with a specific address but not actually signed until execution:\n\n```typescript\ncreateNoopSigner(): Signer\n```\n\n## Context Creation\n\nThe `createContext()` function is the main entry point, returning a `Context` object:\n\n```typescript\ntype Context = {\n  commitment: Commitment\n  payer?: Signer\n  rpcUrl: string\n  signer: Signer\n  umi: Umi & { rpc: DasApiInterface }\n  explorer: ExplorerType\n  chain: RpcChain\n}\n```\n\n### Umi Instance Setup\n\nThe created Umi instance includes these plugins:\n\n- **MPL Programs**: mplCore, mplTokenMetadata, mplToolbox, mplBubblegum, mplDistro, mplCandyMachine, genesis, mplAgentIdentity, mplAgentTools\n- **API**: dasApi (Digital Asset Standard)\n- **Storage**: Configured provider (Irys, Cascade, or Turbo)\n- **Signers**: Identity and payer set based on mode\n\n## Asset Signer Mode\n\nWhen the active wallet is configured as `asset-signer` or `agent` type, the context operates in a special mode for PDA-based signing.\n\n### How It Works\n\n1. **PDA as Identity** — Both `umi.identity` and `umi.payer` are set to a noop signer keyed to the PDA address. This causes all instruction building to naturally use the PDA as the signer.\n\n2. **Real Wallet as Authority** — The actual wallet (from `ownerPath` or `config.keypair`) is stored separately and used by the send layer to wrap instructions in an `execute` instruction with the correct authority.\n\n3. **Fee Payer Override** — The transaction fee payer is set to the real wallet via `setFeePayer()` before building and signing.\n\n### Resolution Logic\n\n```typescript\n// From createContext()\nconst activeWallet = resolveActiveWallet(config)\nconst isAssetSigner = activeWallet?.type === 'asset-signer' || activeWallet?.type === 'agent'\n\nif (isAssetSigner) {\n  // Resolve owner wallet from payer reference in wallet config\n  let ownerPath: string | undefined\n  if (walletPayerName && config.wallets) {\n    const ownerWallet = config.wallets.find(w => w.name === walletPayerName)\n    // ... resolve path from non-asset-signer wallet\n  }\n  // Fall back to config.keypair\n  // Fall back to error in transaction context\n}\n```\n\nThe asset signer plugin is applied to Umi when both `assetSigner` and `realWalletSigner` are available:\n\n```typescript\numi.use(assetSignerPlugin({ info: assetSigner, authority: realWalletSigner, payer: feePayer }))\n```\n\n## Architecture\n\n```mermaid\nflowchart TB\n    subgraph Config Sources\n        DC[DEFAULT_CONFIG] --> CC[consolidateConfigs]\n        RC[readConfig] --> CC\n        RO[Runtime Overrides] --> CC\n    end\n    \n    CC --> CTX[createContext]\n    \n    subgraph Signer Resolution\n        CTX --> AW{Active Wallet?}\n        AW -->|asset-signer| ASP[Asset Signer Path]\n        AW -->|file/keypair| KSP[Keypair Path]\n        AW -->|none| NS[Noop Signer]\n        \n        ASP --> RP[Resolve Owner]\n        RP --> RSP[createSignerFromPath]\n        \n        KSP --> CFP{Path Type?}\n        CFP -->|file| CSF[createSignerFromFile]\n        CFP -->|usb://ledger| CSL[createSignerFromLedgerPath]\n        CFP -->|none| NS\n    end\n    \n    subgraph Umi Creation\n        RSP --> UMI[createUmi]\n        CSF --> UMI\n        CSL --> UMI\n        NS --> UMI\n        \n        UMI --> UMP[Use Plugins]\n        UMP --> UMI2[Configured Umi Instance]\n    end\n    \n    UMI2 --> RET[Return Context]\n```\n\n## Key Functions Reference\n\n| Function | Purpose |\n|----------|---------|\n| `readConfig(path)` | Read and validate config file, filter to known keys |\n| `consolidateConfigs(...configs)` | Deep merge multiple config objects |\n| `createSignerFromFile(path)` | Load signer from JSON keypair file |\n| `createSignerFromLedgerPath(path)` | Create signer from Ledger device |\n| `createNoopSigner()` | Create dummy signer for PDA operations |\n| `createContext(configPath, overrides, isTransactionContext)` | Main entry point — creates full Context |\n| `resolveActiveWallet(config)` | Find active wallet entry from config |\n\n## Usage Example\n\n```typescript\n// Create context with defaults, config file, and CLI overrides\nconst context = await createContext(\n  '~/.config/mplx/config.json',\n  { rpcUrl: 'https://api.mainnet.solana.com' },\n  true // isTransactionContext\n)\n\n// Use the Umi instance\nconst umi = context.umi\nconst signer = context.signer\n\n// Build and send a transaction\nawait someInstruction(umi).instruction()\n  .addSigner(signer)\n  .send()\n```","general-utilities":"# General Utilities\n\n# General Utilities Module\n\nThe General Utilities module provides foundational helper functions, type definitions, and cross-cutting concerns used throughout the codebase. It encompasses file operations, JSON serialization with BigInt support, Solana-specific utilities, validation functions, tree storage management, progress tracking, instruction serialization, and blockchain explorer URL generation.\n\n## Module Structure\n\n```\nsrc/\n├── lib/\n│   ├── util.ts           # Core utilities (JSON, sleep, addresses, chain detection)\n│   ├── file.ts           # File system operations\n│   ├── validations.ts    # Input validation functions\n│   ├── treeStorage.ts    # Merkle tree persistence\n│   ├── types/\n│   │   └── pluginData.ts # MPL Core plugin type definitions\n│   ├── ui/\n│   │   └── uploadProgressHandler.ts  # Progress display\n│   └── execute/\n│       └── deserializeInstruction.ts # Instruction serialization\n└── explorers.ts         # Blockchain explorer URL generation\n```\n\n## Core Utilities (`src/lib/util.ts`)\n\n### JSON Serialization with BigInt Support\n\nJavaScript's `JSON.stringify` throws an error when encountering `BigInt` values. These utilities handle that gracefully:\n\n```typescript\n// Stringify: converts BigInt to string with 'n' suffix\njsonStringify({ amount: 1000000000n, name: \"Token\" }\n// Output: {\"amount\":\"1000000000n\",\"name\":\"Token\"}\n\n// Parse: optionally converts \"123n\" strings back to BigInt\njsonParse('{\"amount\":\"1000000000n\"}', true)\n// Output: { amount: 1000000000n }\n```\n\n### Transaction Signature Conversion\n\n```typescript\ntxSignatureToString(signature: TransactionSignature): string\n```\n\nConverts a Umi `TransactionSignature` to a base58-encoded string using the Umi serializers.\n\n### Chain Detection\n\nThe module detects which Solana network (Mainnet, Devnet, or Localnet) a given RPC URL points to by fetching the genesis hash:\n\n```typescript\nconst chain = await chain('https://api.devnet.solana.com')\n// Returns: RpcChain.Devnet\n```\n\nThe detection uses a hardcoded map of known genesis hashes:\n\n| Genesis Hash | Network |\n|--------------|---------|\n| `5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d` | Mainnet |\n| `EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG` | Devnet |\n| `4uhcVJyU9pJkvQyS88uRDiswHXSCkY3zQawwpjk2NsNY` | Localnet (Testnet) |\n\n### Address Utilities\n\n```typescript\n// Shorten addresses for display\nshortenAddress(\"7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU\", 4)\n// Output: \"7xKX...gAsU\"\n```\n\n### Cross-Platform Directory Opening\n\n```typescript\nopenDirectory(\"/path/to/folder\")\n```\n\nOpens the specified folder in the system's file explorer:\n- **Windows**: Uses `start` command\n- **macOS**: Uses `open` command\n- **Linux**: Tries `xdg-open`, `nautilus`, `dolphin`, `nemo`, or `thunar` in order\n\n### Terminal Styling\n\nANSI escape codes for terminal output formatting:\n\n```typescript\nterminalStyle.bold   // '\\x1b[1m'\nterminalStyle.underline  // '\\x1b[4m'\nterminalStyle.inverse    // '\\x1b[7m'\n```\n\n## File Operations (`src/lib/file.ts`)\n\nSynchronous JSON file operations that integrate with the BigInt-aware utilities:\n\n```typescript\n// Read and parse JSON\nconst config = readJsonSync('./config.json')\n\n// Write formatted JSON\nwriteJsonSync('./output.json', { key: \"value\" })\n\n// Ensure directory exists before writing\nensureDirectoryExists('./data/nested/path')\n```\n\nThe `ensureDirectoryExists` function creates directories recursively using `mkdirSync` with `{ recursive: true }`.\n\n## Validation Functions (`src/lib/validations.ts`)\n\nInput validation for token creation parameters:\n\n| Function | Rules |\n|----------|-------|\n| `validateTokenName` | 1-32 characters |\n| `validateTokenSymbol` | 2-6 characters |\n| `validateMintAmount` | Greater than 0, no more than 1 trillion |\n\nAll functions throw descriptive `Error` instances on validation failure and return the validated value on success.\n\n## Tree Storage (`src/lib/treeStorage.ts`)\n\nManages persistent storage of Merkle tree configurations in `~/.config/mplx/trees.json`.\n\n### Storage Location\n\n```typescript\ngetTreesFilePath()\n// Returns: ~/.config/mplx/trees.json\n```\n\n### Stored Tree Schema\n\n```typescript\ninterface StoredTree {\n  name: string           // User-defined name\n  address: string        // Tree account address\n  maxDepth: number       // Tree depth\n  maxBufferSize: number  // Buffer size\n  canopyDepth: number   // Canopy depth\n  isPublic: boolean      // Public access\n  maxNfts: number        // Maximum NFTs\n  createdAt: string      // ISO timestamp\n  signature: string      // Creation transaction\n  network: 'mainnet' | 'devnet' | 'testnet' | 'localnet'\n  genesisHash: string    // Network genesis hash\n}\n```\n\n### Operations\n\n```typescript\n// Save a new tree (throws if name/address already exists)\nsaveTree(tree: StoredTree)\n\n// Find tree by name or address\nconst tree = getTreeByNameOrAddress(\"my-tree\")\nconst tree = getTreeByNameOrAddress(\"Address...\", \"devnet\")\n\n// List all trees, optionally filtered\nconst allTrees = listTrees()\nconst devnetTrees = listTrees(\"devnet\")\n\n// Remove tree\nremoveTree(\"my-tree\")\nremoveTree(\"Address...\", \"devnet\")\n\n// Validate tree name format\nisValidTreeName(\"My Tree 2024\")  // true - alphanumeric, hyphens, underscores, spaces\nisValidTreeName(\"tree@invalid\")  // false - contains @\n```\n\n## Plugin Type Definitions (`src/lib/types/pluginData.ts`)\n\nTypeScript type definitions for MPL Core plugins. The `PluginData` interface maps plugin names to their corresponding MPL Core plugin types:\n\n```typescript\ntype Plugin = \n  | 'royalties' | 'pBurn' | 'pTransfer' | 'pFreeze'\n  | 'autograph' | 'freeze' | 'transfer' | 'burn'\n  | 'update' | 'masterEdition' | 'attributes'\n  | 'addBlocker' | 'immutableMetadata' | 'verifiedCreators'\n  | 'edition' | 'bubblegumV2'\n\ninterface PluginData {\n  royalties?: { type: 'Royalties' } & BasePlugin & RoyaltiesPlugin\n  burn?: { type: 'BurnDelegate' } & BasePlugin & BurnDelegatePlugin\n  // ... other plugins\n}\n```\n\n## Progress Handlers (`src/lib/ui/uploadProgressHandler.ts`)\n\nTwo implementations for displaying upload progress using the `ora` spinner library:\n\n### Detailed Progress Handler\n\nTracks multiple phases with separate spinners:\n\n```typescript\nconst handler = createUploadProgressHandler()\n\nhandler({ phase: 'images-start', message: 'Uploading images...' })\nhandler({ phase: 'images', message: '50/100 images uploaded' })\nhandler({ phase: 'images-complete', message: '100 images uploaded' })\nhandler({ phase: 'json-start', message: 'Updating JSON metadata...' })\nhandler({ phase: 'json-complete', message: 'JSON files ready' })\n```\n\nPhases: `images-start` → `images` → `images-complete` → `updating-json` → `json-start` → `json` → `json-complete` → `complete`\n\n### Simple Progress Handler\n\nSingle spinner showing percentage:\n\n```typescript\nconst handler = createSimpleProgressHandler()\nhandler(0.25)   // \"Uploading assets... 25%\"\nhandler(0.50)  // \"Uploading assets... 50%\"\nhandler(1.0)   // \"Upload completed\"\n```\n\n## Instruction Serialization (`src/lib/execute/deserializeInstruction.ts`)\n\nSerializes and deserializes Solana instructions to/from base64 format.\n\n### Binary Format\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│ 32 bytes: Program ID                                        │\n├─────────────────────────────────────────────────────────────┤\n│ 2 bytes (u16 LE): Number of accounts                        │\n├─────────────────────────────────────────────────────────────┤\n│ For each account:                                           │\n│   - 32 bytes: Public key                                     │\n│   - 1 byte: Flags (bit 0 = isSigner, bit 1 = isWritable)   │\n├─────────────────────────────────────────────────────────────┤\n│ Remaining bytes: Instruction data                           │\n└─────────────────────────────────────────────────────────────┘\n```\n\n### Usage\n\n```typescript\n// Deserialize from base64\nconst instruction = deserializeInstruction(\"AgAAAA...\")\n\n// Serialize to base64\nconst base64 = serializeInstruction(instruction)\n```\n\n## Explorer URL Generation (`src/explorers.ts`)\n\nGenerates links to blockchain explorers for transactions and accounts.\n\n### Supported Explorers\n\n| Explorer | Base URL |\n|----------|----------|\n| `solanaExplorer` | https://explorer.solana.com/ |\n| `solscan` | https://solscan.io/ |\n| `solanaFm` | https://solana.fm/ |\n\n### URL Generation\n\n```typescript\nimport { explorers, generateExplorerUrl, generateCoreExplorerUrl, RpcChain } from './explorers'\n\n// Generate transaction URL\nconst url = generateExplorerUrl('solscan', RpcChain.Devnet, 'txSignature...', 'transaction')\n// Output: https://solscan.io/tx/txSignature?cluster=devnet\n\n// Generate account URL\nconst url = generateExplorerUrl('solanaExplorer', RpcChain.Mainnet, 'Address...', 'account')\n// Output: https://explorer.solana.com/address/Address...\n\n// Generate Metaplex Core explorer URL\nconst coreUrl = generateCoreExplorerUrl(RpcChain.Devnet, 'CoreAddress...')\n// Output: https://core.metaplex.com/explorer/CoreAddress?env=devnet\n```\n\n## Dependencies\n\nThe module integrates with several external libraries:\n\n- **@metaplex-foundation/umi**: Transaction signatures, serialization, public keys\n- **@solana/web3.js**: Connection for genesis hash fetching\n- **@metaplex-foundation/mpl-core**: Plugin type definitions\n- **mime**: File MIME type detection\n- **ora**: Terminal spinner for progress display","genesis-library":"# Genesis Library\n\n# Genesis Library\n\nThe Genesis Library provides a complete system for creating and managing token launches on Solana using the Metaplex Genesis program. It supports two launch modes: **LaunchPool** (project-style launches with deposit periods and Raydium liquidity) and **Bonding Curve** (instant launches with dynamic pricing).\n\nThe library offers two workflows:\n- **API Wizard** — Delegates launch creation and registration to the Metaplex Genesis API\n- **Manual Wizard** — Directly constructs and submits Solana transactions for full control\n\n## Architecture Overview\n\n```mermaid\ngraph TB\n    subgraph \"User Interface\"\n        A[CLI / Application]\n    end\n\n    subgraph \"Genesis Library\"\n        B[wizard.ts]\n        C[createGenesisWizardPrompt.ts]\n        D[operations.ts]\n        E[launchApi.ts]\n    end\n\n    subgraph \"External Services\"\n        F[Metaplex Genesis API]\n        G[Solana Blockchain]\n    end\n\n    A --> B\n    B --> C\n    B --> D\n    B --> E\n    C -->|\"Prompt Input\"| A\n    D -->|\"Transactions\"| G\n    E -->|HTTP| F\n    F -->|\"Creates Accounts\"| G\n```\n\n## Core Concepts\n\n### Genesis Account\n\nThe genesis account is the on-chain anchor for a token launch. It stores:\n- Token metadata (name, symbol, decimals, URI)\n- Base mint (the launched token) and quote mint (payment token)\n- Funding mode (new mint or transfer from existing)\n- Bucket configurations and state\n\n### Buckets\n\nBuckets define how tokens are distributed. Three bucket types exist:\n\n| Bucket Type | Purpose | Key Parameters |\n|-------------|---------|----------------|\n| **Launch Pool** | Pro-rata allocation based on contributions | deposit period, raise goal, claim schedule |\n| **Presale** | Fixed-price token sales | allocation, quote cap, deposit limits |\n| **Unlocked** | Team/treasury allocations | recipient, claim schedule |\n\n### Quote Mint\n\nThe payment token for the launch. Supported options:\n- **SOL** — Wrapped SOL (`So11111111111111111111111111111111111111112`)\n- **USDC** — USD Coin (`EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v`)\n- **Custom** — Any SPL token\n\n## Module Structure\n\n### `createGenesisWizardPrompt.ts` — User Input Collection\n\nThis module handles all interactive prompts using `@inquirer/prompts`. It provides validators, timestamp conversion, and reusable prompt components.\n\n#### Validators\n\nAll validators support early exit by typing `q`:\n\n```typescript\n// Validate Solana public keys\nvalidatePublicKey(v: string): string | true\nvalidateOptionalPublicKey(v: string): string | true\n\n// Validate timestamps (ISO or unix)\nvalidateTimestamp(v: string, opts?: { requireFuture?: boolean; allowEmpty?: boolean }): string | true\n\n// Validate URLs with platform-specific rules\nvalidateUrlField(v: string, type: 'website' | 'twitter' | 'telegram'): string | true\n```\n\n#### Timestamp Conversion\n\n```typescript\n// Convert user input to unix seconds (for on-chain data)\ntoUnixTimestamp(v: string): string\n\n// Convert to ISO string (for API calls expecting Date | string)\ntoISOTimestamp(v: string): string\n```\n\nBoth functions accept ISO 8601 dates (`2025-06-01T00:00:00Z`) or unix timestamps in seconds.\n\n#### Shared Prompt Components\n\n```typescript\n// Token metadata: name, symbol, image, description\npromptTokenMetadata(): Promise<{ name, symbol, image, description? }>\n\n// Social links: website, twitter, telegram\npromptSocialLinks(): Promise<{ website?, twitter?, telegram? }>\n\n// Quote mint selection with known token shortcuts\npromptQuoteMint(): Promise<string>\n\n// Project configuration for launchpool launches\npromptProjectConfig(quoteMint: string): Promise<{\n  tokenAllocation: number\n  raiseGoal: number\n  raydiumLiquidityBps: number\n  fundsRecipient: string\n}>\n\n// Agent configuration for on-chain agent execution\npromptAgentConfig(): Promise<{ agentAsset?, agentSetToken? }>\n\n// Bonding curve specific options\npromptBondingCurveConfig(): Promise<{ creatorFeeWallet?, firstBuyAmount? }>\n```\n\n#### Manual Wizard Prompts\n\n```typescript\n// Create genesis account\npromptGenesisCreate(): Promise<GenesisCreateResult>\n\n// Bucket creation prompts\npromptLaunchPoolBucket(nextIndex: number): Promise<AddLaunchPoolParams>\npromptPresaleBucket(nextIndex: number): Promise<AddPresaleParams>\npromptUnlockedBucket(nextIndex: number): Promise<AddUnlockedParams>\npromptBucketChoice(): Promise<BucketChoice>\n```\n\n#### API Wizard Prompts\n\n```typescript\n// Full launch wizard combining all prompts\npromptLaunchWizard(): Promise<LaunchWizardResult>\n\n// Platform registration\npromptRegisterLaunch(): Promise<RegisterLaunchResult>\n```\n\n### `operations.ts` — On-Chain Operations\n\nDirect blockchain interactions using `@metaplex-foundation/genesis` and `@metaplex-foundation/umi`.\n\n#### Creating a Genesis Account\n\n```typescript\nasync function createGenesisAccount(\n  umi: Umi,\n  signer: Signer,\n  payer: Signer | undefined,\n  params: CreateGenesisParams\n): Promise<{\n  genesisAccountPda: PublicKey\n  baseMintPubkey: PublicKey\n  quoteMintPubkey: PublicKey\n  signature: string\n}>\n```\n\nThe `CreateGenesisParams` interface:\n\n```typescript\ninterface CreateGenesisParams {\n  name: string           // Token name (1-32 chars)\n  symbol: string         // Token symbol (1-10 chars)\n  totalSupply: string    // Total supply as string (base units)\n  decimals: number       // Token decimals (0-18)\n  uri: string            // Metadata URI\n  fundingMode: 'new-mint' | 'transfer'\n  baseMint?: string      // Required if fundingMode='transfer'\n  quoteMint?: string     // Optional, defaults to SOL\n  genesisIndex?: number  // Optional, defaults to 0\n}\n```\n\n#### Adding Buckets\n\n```typescript\n// Launch Pool bucket with optional extensions\naddLaunchPoolBucket(\n  umi, signer, payer,\n  genesisAccount, baseMint, quoteMint,\n  params: AddLaunchPoolParams\n): Promise<{ bucketPda: PublicKey; signature: string }>\n\n// Presale bucket with deposit limits\naddPresaleBucket(\n  umi, signer, payer,\n  genesisAccount, baseMint, quoteMint,\n  params: AddPresaleParams\n): Promise<{ bucketPda: PublicKey; signature: string }>\n\n// Unlocked bucket for team/treasury\naddUnlockedBucket(\n  umi, signer, payer,\n  genesisAccount, baseMint, quoteMint,\n  params: AddUnlockedParams\n): Promise<{ bucketPda: PublicKey; signature: string }>\n```\n\n**Launch Pool Extensions** — Optional parameters for launch pools:\n- `minimumDeposit` — Minimum contribution amount\n- `depositLimit` — Maximum contribution per user\n- `minimumQuoteTokenThreshold` — Minimum total raise before distribution\n\n#### Finalizing\n\n```typescript\nfinalizeGenesis(\n  umi, signer,\n  genesisAccount, baseMint,\n  bucketCount: number\n): Promise<string>\n```\n\nFinalization locks the genesis account and prepares buckets for claiming. The function fetches all bucket PDAs and includes them as remaining accounts in the finalize transaction.\n\n### `launchApi.ts` — API Input Builder\n\nConstructs the input structure for the Metaplex Genesis API.\n\n```typescript\nbuildLaunchInput(\n  wallet: string,\n  chain: RpcChain,\n  params: BuildLaunchInputParams,\n  networkOverride?: SvmNetwork\n): CreateLaunchInput\n```\n\nThe `BuildLaunchInputParams` interface supports both launch types:\n\n```typescript\ninterface BuildLaunchInputParams {\n  launchType: 'launchpool' | 'bondingCurve'\n  token: { name, symbol, image, description? }\n  socials?: { website?, twitter?, telegram? }\n  quoteMint?: string\n  // Launchpool-specific\n  depositStartTime?: string\n  tokenAllocation?: number\n  raiseGoal?: number\n  raydiumLiquidityBps?: number\n  fundsRecipient?: string\n  // Bonding-curve-specific\n  creatorFeeWallet?: string\n  firstBuyAmount?: number\n  // Agent support\n  agent?: AgentConfig\n}\n```\n\n#### API URLs\n\n```typescript\ngetDefaultApiUrl(network: SvmNetwork): string\n// Returns:\n//   'solana-mainnet' → 'https://api.metaplex.com'\n//   'solana-devnet'  → 'https://api.metaplex.dev'\n```\n\n### `wizard.ts` — Orchestration\n\nCoordinates the full wizard flow, combining prompts with operations.\n\n#### Context and Logging\n\n```typescript\ninterface WizardContext {\n  umi: Umi\n  identity: Signer\n  payer: Signer | undefined\n  chain: RpcChain\n  commitment: string\n  explorer: ExplorerType\n  apiUrl: string\n}\n\ninterface WizardLogger {\n  log: (msg: string) => void\n  logSuccess: (msg: string) => void\n  warn: (msg: string) => void\n  logJson: (obj: unknown) => void\n}\n```\n\n#### API Wizard Flow\n\n```typescript\nrunApiWizard(ctx: WizardContext, logger: WizardLogger): Promise<ApiWizardResult>\n```\n\nThe API wizard:\n1. Collects launch configuration via `promptLaunchWizard`\n2. Builds API input via `buildLaunchInput`\n3. Calls `createAndRegisterLaunch` from `@metaplex-foundation/genesis`\n4. Returns launch details including genesis account, mint address, and platform registration\n\n#### Manual Wizard Flow\n\n```typescript\nrunManualWizard(ctx: WizardContext, logger: WizardLogger): Promise<ManualWizardResult>\n```\n\nThe manual wizard proceeds in steps:\n\n1. **Create Genesis Account** — Collects token metadata and creates the on-chain account\n2. **Add Buckets** — Interactive loop adding launch pool, presale, or unlocked buckets\n3. **Finalize** — Optional finalization (required before claiming)\n4. **Register** — Optional platform registration via the API\n\n## Usage Example\n\n```typescript\nimport { runApiWizard, runManualWizard } from './wizard.js'\nimport { getDefaultApiUrl } from './launchApi.js'\n\n// API-based launch\nconst apiResult = await runApiWizard(\n  {\n    umi,\n    identity: wallet,\n    payer: wallet,\n    chain: 'solana-mainnet',\n    commitment: 'confirmed',\n    explorer: 'solana',\n    apiUrl: getDefaultApiUrl('solana-mainnet'),\n  },\n  {\n    log: console.log,\n    logSuccess: (msg) => console.log('✓', msg),\n    warn: (msg) => console.warn('⚠', msg),\n    logJson: (obj) => console.log(JSON.stringify(obj, null, 2)),\n  }\n)\n\n// Manual launch with full control\nconst manualResult = await runManualWizard(ctx, logger)\n```\n\n## Error Handling\n\nThe wizards handle errors at each stage:\n\n- **Validation errors** — Caught by prompt validators before submission\n- **Transaction failures** — Caught and logged with explorer links\n- **API errors** — Response body is logged for debugging\n- **Partial failures** — Bucket creation failures don't block the wizard; users can retry or continue\n\nType `q` at any prompt to abort the wizard cleanly.\n\n## Constants\n\n```typescript\n// Minimum raise goals by quote token\nconst MIN_RAISE_GOAL = {\n  SOL: 250,\n  USDC: 25000,\n}\n\n// Known quote mint addresses\nconst KNOWN_QUOTE_MINTS = {\n  SOL: 'So11111111111111111111111111111111111111112',\n  USDC: 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v',\n}\n```","other-agents-md":"# Other — AGENTS.md\n\n# GitNexus — Code Intelligence Configuration\n\nThis module is a developer-facing reference for GitNexus, a code intelligence platform that indexes the codebase and provides tools for understanding code relationships, assessing change impact, and navigating safely.\n\n## Purpose\n\nAGENTS.md serves as an always-available guide for developers working on the metaplex-cli project. It defines mandatory practices for safe code modification:\n\n- **Impact analysis** must run before editing any symbol\n- **Change detection** must run before committing\n- **Risk warnings** must be heeded for HIGH or CRITICAL changes\n\n## Project Metadata\n\n| Metric | Value |\n|--------|-------|\n| Project | metaplex-cli |\n| Symbols indexed | 10,239 |\n| Relationships indexed | 13,988 |\n| Execution flows | 116 |\n\nThese metrics indicate the scale of code that GitNexus tracks. The relationship count (exceeding symbol count) reflects the dense interconnectedness of the codebase.\n\n## Mandatory Practices\n\n### Before Any Edit: Impact Analysis\n\n```bash\ngitnexus_impact({target: \"symbolName\", direction: \"upstream\"})\n```\n\nThis tool returns:\n- **Direct callers** — code that immediately depends on the target\n- **Affected processes** — execution flows that pass through the symbol\n- **Risk level** — one of LOW, MEDIUM, HIGH, or CRITICAL\n\nThe tool must be consulted before modifying any function, class, or method. The risk assessment must be reported to the user before proceeding.\n\n### Before Any Commit: Change Detection\n\n```bash\ngitnexus_detect_changes()\n```\n\nVerifies that modifications affect only the intended symbols and execution flows. This prevents unintended side effects from spreading through the call graph.\n\n### Risk Response\n\n| Risk Level | Required Action |\n|------------|-----------------|\n| LOW / MEDIUM | Proceed with normal caution |\n| HIGH / CRITICAL | **Must warn the user** before proceeding |\n\n### Querying the Codebase\n\nFor exploration rather than modification:\n\n```bash\ngitnexus_query({query: \"concept\"})\n```\n\nReturns execution flows grouped by process, ranked by relevance. Use this instead of grep to find how concepts actually execute in the codebase.\n\nFor full context on a specific symbol:\n\n```bash\ngitnexus_context({name: \"symbolName\"})\n```\n\nReturns callers, callees, and all execution flows the symbol participates in.\n\n## Resource References\n\nThe file references additional resources at fixed URIs:\n\n| URI | Purpose |\n|-----|---------|\n| `gitnexus://repo/metaplex-cli/context` | Codebase overview, index freshness check |\n| `gitnexus://repo/metaplex-cli/clusters` | All functional areas |\n| `gitnexus://repo/metaplex-cli/processes` | All execution flows |\n| `gitnexus://repo/metaplex-cli/process/{name}` | Step-by-step execution trace |\n\n## CLI Skill References\n\nThe file maps tasks to skill files located in `.claude/skills/gitnexus/`:\n\n| Task | Skill File |\n|------|------------|\n| Understanding architecture | `gitnexus-exploring/SKILL.md` |\n| Assessing blast radius | `gitnexus-impact-analysis/SKILL.md` |\n| Debugging failures | `gitnexus-debugging/SKILL.md` |\n| Refactoring (rename, extract, split) | `gitnexus-refactoring/SKILL.md` |\n| Tool reference and schema | `gitnexus-guide/SKILL.md` |\n| Index and CLI commands | `gitnexus-cli/SKILL.md` |\n\n## Index Freshness\n\nThe note about running `npx gitnexus analyze` indicates that the code intelligence is only useful when the index is current. If tools warn that the index is stale, re-running analysis synchronizes the graph with the current codebase state.\n\n## Relationship to Execution Flows\n\nDespite the project having 116 execution flows, this module shows no execution flows itself. AGENTS.md is a configuration and reference document, not code that executes within the application's runtime. Its role is static guidance—providing the rules and resource pointers that developers consult while working on the actual codebase.","other-claude-md":"# Other — CLAUDE.md\n\n# CLAUDE.md — Claude Code Guidance File\n\n## Overview\n\n`CLAUDE.md` is a special metadata file that provides operational guidance to Claude Code (claude.ai/code), an AI assistant that helps developers work with the codebase. This file serves as the primary configuration document for AI-assisted development, instructing the AI on project conventions, available commands, architecture patterns, and development workflows.\n\nUnlike traditional documentation that serves human developers, CLAUDE.md is specifically designed to be read and followed by an AI assistant. It ensures the AI understands project-specific context before making changes, reducing errors and maintaining consistency with project standards.\n\n## File Location and Naming\n\nThe file must be named exactly `CLAUDE.md` and placed at the repository root. Claude Code automatically detects and reads this file when working in the project directory. The filename is case-sensitive and must match exactly.\n\n## How Claude Code Uses This File\n\nWhen Claude Code initializes in the repository, it:\n\n1. **Reads the entire file** to understand project context\n2. **References the development commands** section for build, test, and lint operations\n3. **Consults architecture overview** when explaining code or making structural changes\n4. **Follows development guidelines** when writing new code or modifying existing patterns\n5. **Uses GitNexus integration** for impact analysis before making changes\n\nThe AI does not execute this file—it reads it as guidance and applies the principles when helping with development tasks.\n\n## Key Sections\n\n### Project Overview\n\nThe opening section identifies the project as the Metaplex CLI (`mplx`), a command-line interface for the Metaplex ecosystem on Solana. This establishes the domain context (Solana blockchain, digital assets, NFTs) that informs all subsequent guidance","other-codeql-db-diagnostic":"# Other — codeql-db-diagnostic\n\n# codeql-db-diagnostic Module\n\n## Overview\n\nThe `codeql-db-diagnostic` module collects and stores diagnostic information from CodeQL CLI operations. It serves as a telemetry and error logging repository for database-related CLI activities, capturing execution metadata, platform information, and error conditions.\n\n## Purpose\n\nThis module provides diagnostic capture for:\n\n- **CLI command telemetry** — Recording execution duration, status, and outcomes\n- **Platform diagnostics** — Capturing environment details (architecture, OS, version)\n- **Error tracking** — Logging fatal errors with exit codes and command details\n- **Visibility control** — Supporting selective exposure of diagnostics to different consumers (telemetry systems, status pages, CLI summaries)\n\n## Diagnostic Records\n\nThe module stores JSON-formatted diagnostic entries with a consistent structure:\n\n```json\n{\n  \"timestamp\": \"ISO-8601 timestamp\",\n  \"source\": {\n    \"id\": \"unique source identifier\",\n    \"human-readable name\"\n  },\n  \"visibility\": {\n    \"telemetry\": boolean,\n    \"statusPage\": boolean,\n    \"cliSummaryTable\": boolean\n  },\n  \"attributes\": {\n    \"key\": \"value\"\n  },\n  \"severity\": \"error\",        // optional, only for errors\n  \"plaintextMessage\": \"...\"  // optional, only for errors\n}\n```\n\n### Visibility Controls\n\nEach diagnostic record includes visibility flags that determine where the information can be displayed:\n\n| Flag | Purpose |\n|------|---------|\n| `telemetry` | Include in telemetry exports |\n| `statusPage` | Display on status dashboards |\n| `cliSummaryTable` | Show in CLI summary output |\n\n## Record Types\n\n### 1. Telemetry Records\n\nRecords operational metrics without error conditions:\n\n```json\n{\n  \"source\": {\"id\": \"cli/file-coverage-baseline\", \"name\": \"File coverage baseline telemetry\"},\n  \"visibility\": {\"cliSummaryTable\": false, \"statusPage\": false, \"telemetry\": true},\n  \"attributes\": {\"durationMilliseconds\": 309}\n}\n```\n\n### 2. Platform Records\n\nCaptures runtime environment information:\n\n```json\n{\n  \"source\": {\"id\": \"cli/platform\", \"name\": \"Platform\"},\n  \"visibility\": {\"cliSummaryTable\": false, \"statusPage\": false, \"telemetry\": true},\n  \"attributes\": {\"arch\": \"amd64\", \"version\": \"6.6.87.2-microsoft-standard-WSL2\", \"name\": \"Linux\"}\n}\n```\n\n### 3. Error Records\n\nLogs failures with full context:\n\n```json\n{\n  \"source\": {\"id\": \"cli/database/create\", \"name\": \"CodeQL CLI: database create\"},\n  \"plaintextMessage\": \"A fatal error occurred: Exit status 2 from command: [sh, -lc, 'pnpm, install, &&, pnpm, run, build']\",\n  \"severity\": \"error\",\n  \"visibility\": {\"telemetry\": false},\n  \"attributes\": {\"exitCode\": 2}\n}\n```\n\n## File Naming Convention\n\nDiagnostic files follow the pattern:\n\n```\ncli-diagnostics-add-{ISO_TIMESTAMP}.json\n```\n\nThe timestamp enables:\n- Chronological ordering\n- Unique identification\n- Correlation with other system logs\n\n## Integration Points\n\nThis module operates as a diagnostic sink with no direct code dependencies:\n\n```mermaid\nflowchart LR\n    CLI[CodeQL CLI] -->|generates diagnostics| DB[codeql-db-diagnostic]\n    DB -->|telemetry export| Telemetry[Telemetry System]\n    DB -->|status updates| Status[Status Page]\n    DB -->|summary data| Summary[CLI Summary]\n```\n\n## Usage Considerations\n\n### Error Visibility\n\nNote that error records may set `telemetry: false`, which prevents them from being exported to telemetry systems while still preserving them locally for debugging.\n\n### Timestamp Format\n\nTimestamps use ISO-8601 format with timezone offset:\n```\n2026-04-29T20:31:19.578843962-04:00\n```\n\n### Attribute Variability\n\nThe `attributes` object is flexible and contains source-specific key-value pairs:\n- Duration-based records include `durationMilliseconds`\n- Platform records include `arch`, `version`, `name`\n- Error records include `exitCode`\n\n## Troubleshooting\n\nWhen investigating CLI failures:\n\n1. Locate the relevant diagnostic file by timestamp\n2. Check for entries with `severity: \"error\"`\n3. Review the `plaintextMessage` for human-readable","other-codeql-db":"# Other — codeql-db\n\n# CodeQL Database — codeql-db\n\n## Overview\n\nThis module is a **CodeQL static analysis database** for the Metaplex CLI project. CodeQL databases store extracted semantic information about codebases, enabling security researchers and developers to run queries against the code to find bugs, vulnerabilities, and code quality issues.\n\n## Database Metadata\n\n| Property | Value |\n|----------|-------|\n| **Primary Language** | JavaScript/TypeScript |\n| **Lines of Code** | 27,619 |\n| **CodeQL Version** | 2.25.2 |\n| **Creation Date** | 2026-04-30 |\n| **Source Location** | `/home/aoi/dev/metaplex-cli` |\n| **Status** | In Progress (not finalised) |\n\n## Supported Languages\n\nThe database has extractors installed for the following languages:\n\n- **JavaScript/TypeScript** (primary)\n- YAML\n- HTML\n- Ruby\n- GitHub Actions\n- Go\n- C/C++\n- C#\n- Properties\n- Swift\n- XML\n- CSV\n- Java\n- Rust\n- Python\n\n## Analyzed Project: Metaplex CLI\n\nThis CodeQL database analyzes the **Metaplex CLI** — a command-line interface for interacting with the Metaplex protocol on Solana. The codebase is built with OCLIF (the Open CLI Framework) and provides commands for managing:\n\n### Command Categories\n\n| Category | Description |\n|----------|-------------|\n| **bg** | Bubblegum (compressed NFTs) operations — create collections, mint NFTs, transfer, burn, update |\n| **cm** | Candy Machine operations — create, upload, validate, insert, guard management |\n| **core** | Core NFT operations — create assets, collections, transfer, burn, plugins |\n| **genesis** | Genesis NFT launch operations — presale, launch pools, bucket management, claiming |\n| **tm** | Token Metadata operations |\n| **toolbox** | Utility commands — SOL transfers, wrapping/unwrapping, token operations, storage, LUT management |\n| **distro** | Token distribution operations |\n| **agents** | Agent management — registration, delegation, token setting |\n| **config** | CLI configuration — RPCs, wallets, storage providers, explorers |\n\n### Library Modules\n\nThe codebase includes shared libraries for:\n\n- **Uploader** — Storage provider integration (Irys, Cascade, Turbo)\n- **UMI** — Transaction sending and confirmation utilities\n- **Candy Machine** — CM-specific utilities, validation, guard parsing\n- **Core** — Asset creation, updates, burning, fetching\n- **Genesis** — Launch API, wizard prompts, operations\n- **Metadata** — JSON metadata handling\n- **Signers** — FileSigner, LedgerSigner implementations\n\n## Usage\n\nThis CodeQL database can be used to:\n\n1. **Run security queries** — Identify common vulnerabilities (SQL injection, path traversal, insecure crypto)\n2. **Find code quality issues** — Detect dead code, performance anti-patterns, best practice violations\n3. **Perform taint analysis** — Track data flow from user input to sensitive operations\n4. **Generate reports** — Create summaries of code health and security posture\n\n### Example Query Execution\n\n```bash\n# Run a built-in query suite\ncodeql database analyze codeql-db --format=sarif-latest -o results.sarif\n\n# Run custom queries\ncodeql database analyze codeql-db /path/to/custom-queries --output results\n```\n\n## Database Structure\n\nThe database contains:\n\n- **AST extraction** — Abstract syntax trees for all source files\n- **Type information** — TypeScript type relationships\n- **Control flow graphs** — Execution flow within functions\n- **Data flow graphs** — How data propagates through the codebase\n- **Call graph** — Function and method invocation relationships\n\n> **Note:** The current call graph shows no detected execution flows, which may indicate the database extraction is incomplete or the queries haven't been run yet.\n\n## Integration Notes\n\nThis CodeQL database is a standalone analysis artifact. It does not:\n\n- Execute at runtime\n- Import into the main application\n- Have outgoing or incoming code dependencies\n\nIt serves as a read-only analysis target for CodeQL tooling.","other-commands-md":"# Other — COMMANDS.md\n\n# Command Output Guidelines\n\nThis document defines the standard output contract for all `mplx` CLI commands. All commands must follow these guidelines to ensure consistent behavior when using `--json` mode, which is critical for AI agents, scripts, and programmatic tooling.\n\n## Overview\n\nThe `mplx` CLI is built on [OCLIF](https://oclif.io/), a framework that provides built-in support for JSON output via the `--json` flag. When this flag is passed, OCLIF captures the return value of the command's `run()` method and serializes it to stdout as JSON.\n\nThis behavior has important implications:\n\n- **Human-readable output** (spinners, `this.log()`, `this.logSuccess()`) is automatically suppressed in JSON mode\n- **The return value from `run()` becomes the JSON output** — this is the only thing that reaches stdout\n- **Every command must return a plain, JSON-serializable object** — no `undefined`, `void`, raw strings, or non-serializable types\n\n## Command Type Hierarchy\n\n```mermaid\ngraph TD\n    Command[OCLIF Command] --> BaseCommand\n    Command --> TransactionCommand\n    \n    BaseCommand --> FetchCommand[\"Read/Fetch Commands<br/>core asset fetch\"]\n    BaseCommand --> ConfigCommand[\"Config Commands<br/>config rpcs add\"]\n    BaseCommand --> UtilityCommand[\"Utility Commands<br/>toolbox sol balance\"]\n    \n    TransactionCommand --> CreateCommand[\"Create Commands<br/>core asset create\"]\n    TransactionCommand --> BurnCommand[\"Burn Commands<br/>core asset burn\"]\n    TransactionCommand --> TransferCommand[\"Transfer Commands<br/>toolbox sol transfer\"]\n    \n    style Command fill:#f9f,stroke:#333\n    style BaseCommand fill:#bbf,stroke:#333\n    style TransactionCommand fill:#bbf,stroke:#333\n```\n\nAll custom commands should extend either `BaseCommand` or `TransactionCommand`, not the raw OCLIF `Command`. These base classes provide:\n\n- `static enableJsonFlag = true` — enables the `--json` flag\n- Standardized logging methods (`this.log()`, `this.logSuccess()`)\n- Helper methods for constructing explorer URLs\n\n## Standard Return Shapes\n\n### Transaction Commands (`TransactionCommand`)\n\nAny command that sends a blockchain transaction must return an object containing at minimum:\n\n| Field | Type | Description |\n|-------|------|-------------|\n| `signature` | `string` | Base58 transaction signature |\n| `explorer` | `string` | Explorer URL for the transaction |\n\nPlus any command-specific fields (asset address, mint, collection, etc.).\n\n**Example — `core asset create`:**\n\n```json\n{\n  \"asset\": \"ABC...XYZ\",\n  \"signature\": \"5fg...hij\",\n  \"explorer\": \"https://explorer.solana.com/tx/5fg...hij\",\n  \"coreExplorer\": \"https://core.metaplex.com/explorer/ABC...XYZ\"\n}\n```\n\n**Example — `core asset burn`:**\n\n```json\n{\n  \"asset\": \"ABC...XYZ\",\n  \"signature\": \"5fg...hij\",\n  \"explorer\": \"https://explorer.solana.com/tx/5fg...hij\"\n}\n```\n\n**Example — `toolbox sol transfer`:**\n\n```json\n{\n  \"from\": \"ABC...XYZ\",\n  \"to\": \"DEF...UVW\",\n  \"amount\": 1.5,\n  \"signature\": \"5fg...hij\",\n  \"explorer\": \"https://explorer.solana.com/tx/5fg...hij\"\n}\n```\n\n### Read / Fetch Commands (`BaseCommand`)\n\nCommands that only read data from the blockchain should return the data directly — no wrapper object is needed. The fetched data itself becomes the JSON output.\n\n**Example — `core asset fetch`:**\n\n```json\n{\n  \"publicKey\": \"ABC...XYZ\",\n  \"name\": \"My NFT\",\n  \"uri\": \"https://...\",\n  \"owner\": \"DEF...UVW\",\n  ...\n}\n```\n\n### Config / Mutation Commands\n\nCommands that modify local configuration (not blockchain state) should return the created or updated resource:\n\n**Example — `config rpcs add`:**\n\n```json\n{\n  \"name\": \"devnet\",\n  \"endpoint\": \"https://api.devnet.solana.com\"\n}\n```\n\n**Example — `config wallets add`:**\n\n```json\n{\n  \"name\": \"my-wallet\",\n  \"address\": \"ABC...XYZ\",\n  \"path\": \"/path/to/keypair.json\"\n}\n```\n\n### Utility Commands\n\nCommands that compute or calculate values should return that value directly:\n\n**Example — `toolbox rent`:**\n\n```json\n{\n  \"bytes\": 1024,\n  \"rentSol\": 0.00713856,\n  \"rentLamports\": 7138560\n}\n```\n\n**Example — `toolbox sol balance`:**\n\n```json\n{\n  \"address\": \"ABC...XYZ\",\n  \"balance\": 1.5\n}\n```\n\n**Example — `toolbox sol airdrop`:**\n\n```json\n{\n  \"address\": \"ABC...XYZ\",\n  \"amount\": 1\n}\n```\n\n## Rules\n\n### 1. Every `run()` Must Return an Object\n\nThe `run()` method must always return a plain, JSON-serializable object. Never return:\n\n- `undefined` or `void`\n- A plain string (e.g., `\"Transaction successful\"`)\n- A number or boolean directly\n\nIf there's nothing meaningful to return, return an empty object `{}` or an object with a status field like `{ \"success\": true }`.\n\n### 2. Transaction Commands Always Include Signature and Explorer\n\nEvery command that submits a blockchain transaction must include both:\n\n- `signature` — the base58-encoded transaction signature\n- `explorer` — a URL to view the transaction in a block explorer\n\nUse helper methods from `TransactionCommand` to construct these values consistently.\n\n### 3. Use `this.log()` Instead of `console.log()`\n\nNever use raw `console.log()` in commands. Instead, use:\n\n- `this.log(message)` — for general output\n- `this.logSuccess(message)` — for success messages\n\nThese methods are automatically suppressed when `--json` is passed, ensuring clean JSON output without human-readable noise.\n\n### 4. Enable the JSON Flag\n\nEvery command class must have `static enableJsonFlag = true`. This is provided by `BaseCommand` and `TransactionCommand`, but if you extend the raw OCLIF `Command` class directly, you must set it explicitly.\n\n### 5. Spinners and Human Output Are Fine\n\nOCLIF automatically suppresses spinners, `this.log()`, and `this.logSuccess()` output when `--json` mode is active. You can freely use these for better human experience without affecting JSON consumers.\n\n### 6. Return Plain Primitives Only\n\nThe return value must be JSON-serializable. Convert non-serializable types:\n\n- `PublicKey` → `.toString()`\n- `Uint8Array` → convert to base58 string\n- Custom objects → ensure they have `toJSON()` or return plain object representations\n\nUse utility functions like `txSignatureToString()` for consistent formatting.\n\n## Checklist for New Commands\n\nUse this checklist when implementing a new command to ensure it follows the output contract:\n\n- [ ] **Extends `BaseCommand` or `TransactionCommand`** — not raw `Command`\n- [ ] **`run()` returns a typed, JSON-serializable object** — never `undefined` or raw strings\n- [ ] **Transaction commands include `signature` and `explorer`** in the return object\n- [ ] **No raw `console.log()` calls** — use `this.log()` instead\n- [ ] **Human-readable output uses `this.log()` / `this.logSuccess()`** — so it is suppressed in `--json` mode\n- [ ] **Return values are plain primitives** — no `PublicKey`, `Uint8Array`, or custom classes\n\n## Why This Matters\n\nConsistent JSON output enables:\n\n- **AI agent integration** — agents can reliably parse command results\n- **Scripting** — shell scripts and CI/CD pipelines can consume output programmatically\n- **Tooling** — third-party tools can build on the `mplx` CLI\n- **Testing** — JSON output is easy to assert against in tests\n\nBy following these guidelines, you ensure that any tool consuming `mplx` CLI output gets a predictable, parseable result regardless of which command is run.","other-docs-candymachine":"# Other — docs-candyMachine\n\n# Candy Machine Module\n\nThe Candy Machine module provides CLI commands for creating, managing, and deploying MPL Core Candy Machines on Solana. Candy machines control NFT minting with configurable rules called \"guards\" that enforce payment requirements, access restrictions, timing constraints, and more.\n\n## Overview\n\nThe candy machine system consists of three main components:\n\n1. **Commands** — CLI operations for creating candy machines, uploading assets, and inserting items\n2. **Guards** — Rules that control who can mint, when they can mint, and what they must pay\n3. **Guard Groups** — Collections of guards that apply to specific minting phases (whitelist, public sale, etc.)\n\n## Command Structure\n\nAll candy machine commands use the `mplx cm` prefix:\n\n```bash\nmplx cm <command> [options]\n```\n\n### Available Commands\n\n| Command | Description |\n|---------|-------------|\n| `create` | Creates a new candy machine with optional wizard guidance |\n| `upload` | Uploads assets to decentralized storage |\n| `insert` | Inserts uploaded assets into the candy machine |\n| `validate` | Validates the asset cache file |\n\n### Wizard Mode (Recommended)\n\nThe `--wizard` flag provides an interactive, guided experience:\n\n```bash\nmplx cm create --wizard\n```\n\nThe wizard walks through:\n- Directory setup and validation\n- Asset discovery and validation\n- Collection configuration\n- Candy machine settings and guards\n- Asset upload with progress tracking\n- On-chain candy machine creation\n- Item insertion with transaction progress\n\nType `q` at any prompt to abort gracefully.\n\n## Asset Directory Structure\n\nCandy machine commands operate from a specific directory structure:\n\n```\ncandy-machine-name/\n├── assets/\n│   ├── 0.png              # NFT image files\n│   ├── 0.json             # NFT metadata\n│   ├── 1.png\n│   ├── 1.json\n│   ├── ...\n│   ├── collection.png     # Collection image (optional)\n│   └── collection.json    # Collection metadata (required)\n├── asset-cache.json       # Generated: upload URIs\n└── cm-config.json         # Generated: candy machine config\n```\n\n### Asset Requirements\n\n- **Naming**: Files must be numbered sequentially (0.png, 1.png, 2.png...)\n- **Metadata**: Each image needs a corresponding JSON file with the same number\n- **Collection**: `collection.json` must contain a `name` field\n- **Formats**: PNG and JPG images are supported\n\n### Metadata JSON Format\n\n```json\n{\n  \"name\": \"Asset Name\",\n  \"symbol\": \"SYMBOL\",\n  \"description\": \"Asset description\",\n  \"image\": \"https://example.com/image.png\",\n  \"attributes\": [\n    { \"trait_type\": \"Background\", \"value\": \"Blue\" },\n    { \"trait_type\": \"Eyes\", \"value\": \"Green\" }\n  ],\n  \"properties\": {\n    \"files\": [\n      { \"type\": \"image/png\", \"uri\": \"https://example.com/image.png\" }\n    ]\n  }\n}\n```\n\n## Guards\n\nGuards are rules that control the minting process. They can require payment, restrict access, enforce limits, and more.\n\n### Guard Categories\n\n#### Payment Guards\n\n| Guard | Description |\n|-------|-------------|\n| `solPayment` | Require SOL payment |\n| `solFixedFee` | Fixed SOL fee |\n| `tokenPayment` | Require SPL token payment |\n| `token2022Payment` | Require Token-2022 payment |\n| `nftPayment` | Require NFT from specific collection as payment |\n| `assetPayment` | Require asset as payment |\n| `assetPaymentMulti` | Require multiple assets as payment |\n| `freezeSolPayment` | SOL payment with freeze period |\n| `freezeTokenPayment` | Token payment with freeze period |\n\n**Example: SOL Payment**\n```json\n{\n  \"solPayment\": {\n    \"lamports\": 1000000000,\n    \"destination\": \"WalletAddress...\"\n  }\n}\n```\n\n**Example: Token Payment**\n```json\n{\n  \"tokenPayment\": {\n    \"amount\": 1000000,\n    \"mint\": \"TokenMintAddress...\",\n    \"destinationAta\": \"DestinationATA...\"\n  }\n}\n```\n\n#### Access Control Guards\n\n| Guard | Description |\n|-------|-------------|\n| `addressGate` | Restrict to specific wallet |\n| `allowList` | Merkle tree allowlist |\n| `nftGate` | Require NFT from collection |\n| `tokenGate` | Require specific token amount |\n| `assetGate` | Require asset from collection |\n| `programGate` | Require specific programs in transaction |\n| `thirdPartySigner` | Require additional signer |\n\n**Example: Allow List**\n```json\n{\n  \"allowList\": {\n    \"merkleRoot\": \"MerkleRootHash...\"\n  }\n}\n```\n\n**Example: NFT Gate**\n```json\n{\n  \"nftGate\": {\n    \"requiredCollection\": \"CollectionAddress...\"\n  }\n}\n```\n\n#### Time-Based Guards\n\n| Guard | Description |\n|-------|-------------|\n| `startDate` | Minting start time (Unix timestamp) |\n| `endDate` | Minting end time (Unix timestamp) |\n\n**Example: Time-Restricted Sale**\n```json\n{\n  \"startDate\": { \"date\": 1700000000 },\n  \"endDate\": { \"date\": 1735689600 }\n}\n```\n\n#### Limit Guards\n\n| Guard | Description |\n|-------|-------------|\n| `mintLimit` | Mints per wallet (uses unique ID) |\n| `allocation` | Specific mint allocation to wallet |\n| `nftMintLimit` | Limit based on NFT holdings |\n| `assetMintLimit` | Limit based on asset holdings |\n| `redeemedAmount` | Total mint limit for candy machine |\n\n**Example: Mint Limit**\n```json\n{\n  \"mintLimit\": {\n    \"id\": 1,\n    \"limit\": 1\n  }\n}\n```\n\n**Note**: Use different `id` values for different groups to prevent conflicts.\n\n#### Burn Guards\n\n| Guard | Description |\n|-------|-------------|\n| `nftBurn` | Burn NFT from collection to mint |\n| `tokenBurn` | Burn tokens to mint |\n| `assetBurn` | Burn asset to mint |\n| `assetBurnMulti` | Burn multiple assets to mint |\n\n**Example: NFT Burn**\n```json\n{\n  \"nftBurn\": {\n    \"requiredCollection\": \"CollectionAddress...\"\n  }\n}\n```\n\n#### Special Guards\n\n| Guard | Description |\n|-------|-------------|\n| `botTax` | Penalty for bot-like behavior |\n| `edition` | Control edition numbering |\n| `vanityMint` | Regex pattern for mint address |\n\n**Example: Bot Tax**\n```json\n{\n  \"botTax\": {\n    \"lamports\": 1000000,\n    \"lastInstruction\": true\n  }\n}\n```\n\n### Guard Configuration\n\nGuards are configured in the `guardConfig` section:\n\n```json\n{\n  \"guardConfig\": {\n    \"solPayment\": {\n      \"lamports\": 1000000000,\n      \"destination\": \"WalletAddress...\"\n    },\n    \"mintLimit\": {\n      \"id\": 1,\n      \"limit\": 1\n    }\n  }\n}\n```\n\n## Guard Groups\n\nGuard groups enable phased minting with different rules for each phase. Common use cases include:\n\n- Whitelist → Public sale\n- NFT holder exclusive → Public sale\n- Early bird → Regular → Final phases\n\n### Group Structure\n\n```json\n{\n  \"groups\": [\n    {\n      \"label\": \"wl\",\n      \"guards\": {\n        \"allowList\": { \"merkleRoot\": \"...\" },\n        \"solPayment\": { \"lamports\": 500000000, \"destination\": \"...\" }\n      }\n    },\n    {\n      \"label\": \"public\",\n      \"guards\": {\n        \"solPayment\": { \"lamports\": 1000000000, \"destination\": \"...\" }\n      }\n    }\n  ]\n}\n```\n\n**Important**: Group labels are limited to **6 characters maximum**.\n\n### Common Abbreviations\n\n- `wl` — whitelist\n- `reg` — regular\n- `nft` — NFT holders\n- `token` — token holders\n- `burn` — burn to mint\n- `vip` — VIP access\n- `early` — early bird\n- `final` — final phase\n\n### Group vs Global Guards\n\n- **Global guards** (`guardConfig`): Apply to all groups and the entire candy machine\n- **Group guards** (`groups[].guards`): Apply only to that specific group\n\nGlobal guards cannot be overridden by group guards. Use global guards for universal restrictions like bot protection.\n\n### Example: Whitelist to Public Sale\n\n```json\n{\n  \"guardConfig\": {\n    \"botTax\": {\n      \"lamports\": 1000000,\n      \"lastInstruction\": true\n    }\n  },\n  \"groups\": [\n    {\n      \"label\": \"wl\",\n      \"guards\": {\n        \"allowList\": { \"merkleRoot\": \"WhitelistRoot...\" },\n        \"solPayment\": { \"lamports\": 500000000, \"destination\": \"...\" },\n        \"mintLimit\": { \"id\": 1, \"limit\": 1 },\n        \"startDate\": { \"date\": 1700000000 },\n        \"endDate\": { \"date\": 1700086400 }\n      }\n    },\n    {\n      \"label\": \"public\",\n      \"guards\": {\n        \"solPayment\": { \"lamports\": 1000000000, \"destination\": \"...\" },\n        \"mintLimit\": { \"id\": 2, \"limit\": 2 },\n        \"startDate\": { \"date\": 1700086400 }\n      }\n    }\n  ]\n}\n```\n\n## Workflows\n\n### Option 1: Wizard Mode (Recommended)\n\n```bash\nmplx cm create --wizard\n```\n\nThis single command handles the entire process:\n1. Validates assets and configuration\n2. Uploads assets with progress tracking\n3. Creates the candy machine on-chain\n4. Inserts all items\n5. Provides completion summary\n\n### Option 2: Manual Mode\n\nFor full control, run commands individually:\n\n```bash\n# Navigate to candy machine directory\ncd ./my-candy-machine\n\n# Upload assets (can be done before or after create)\nmplx cm upload\n\n# Create candy machine\nmplx cm create\n\n# Insert items (must be after both create and upload)\nmplx cm insert\n\n# Validate uploads (optional)\nmplx cm validate\n```\n\n**Command Order Rules:**\n- `upload` and `create` can run in any order\n- `insert` must run after both `upload` and `create`\n- `validate` can run at any time\n\n## Configuration Files\n\n### cm-config.json\n\n```json\n{\n  \"name\": \"My Candy Machine\",\n  \"candyMachineId\": \"CandyMachinePublicKey...\",\n  \"config\": {\n    \"collection\": \"CollectionPublicKey...\",\n    \"itemsAvailable\": 100,\n    \"isMutable\": true,\n    \"isSequential\": false,\n    \"guardConfig\": { ... },\n    \"groups\": [ ... ]\n  }\n}\n```\n\n### asset-cache.json\n\n```json\n{\n  \"candyMachineId\": \"CandyMachinePublicKey...\",\n  \"collection\": \"CollectionPublicKey...\",\n  \"assetItems\": {\n    \"0\": {\n      \"name\": \"Asset 0\",\n      \"image\": \"0.png\",\n      \"imageUri\": \"https://gateway.irys.xyz/...\",\n      \"imageType\": \"image/png\",\n      \"json\": \"0.json\",\n      \"jsonUri\": \"https://gateway.irys.xyz/...\",\n      \"loaded\": false\n    }\n  }\n}\n```\n\n## Common Patterns\n\n### Basic Public Mint\n\n```json\n{\n  \"guardConfig\": {\n    \"solPayment\": {\n      \"lamports\": 1000000000,\n      \"destination\": \"WalletAddress...\"\n    },\n    \"mintLimit\": {\n      \"id\": 1,\n      \"limit\": 1\n    }\n  }\n}\n```\n\n### NFT Holder Exclusive\n\n```json\n{\n  \"guardConfig\": {\n    \"nftGate\": {\n      \"requiredCollection\": \"CollectionAddress...\"\n    },\n    \"solPayment\": {\n      \"lamports\": 750000000,\n      \"destination\": \"WalletAddress...\"\n    },\n    \"mintLimit\": {\n      \"id\": 1,\n      \"limit\": 2\n    }\n  }\n}\n```\n\n### Three-Phase Launch\n\n```json\n{\n  \"groups\": [\n    {\n      \"label\": \"vip\",\n      \"guards\": {\n        \"allowList\": { \"merkleRoot\": \"VIPRoot...\" },\n        \"solPayment\": { \"lamports\": 500000000, \"destination\": \"...\" },\n        \"mintLimit\": { \"id\": 1, \"limit\": 3 },\n        \"startDate\": { \"date\": 1700000000 },\n        \"endDate\": { \"date\": 1700040000 }\n      }\n    },\n    {\n      \"label\": \"wl\",\n      \"guards\": {\n        \"allowList\": { \"merkleRoot\": \"WLRoot...\" },\n        \"solPayment\": { \"lamports\": 750000000, \"destination\": \"...\" },\n        \"mintLimit\": { \"id\": 2, \"limit\": 2 },\n        \"startDate\": { \"date\": 1700040000 },\n        \"endDate\": { \"date\": 1700080000 }\n      }\n    },\n    {\n      \"label\": \"public\",\n      \"guards\": {\n        \"solPayment\": { \"lamports\": 1000000000, \"destination\": \"...\" },\n        \"mintLimit\": { \"id\": 3, \"limit\": 1 },\n        \"startDate\": { \"date\": 1700080000 }\n      }\n    }\n  ]\n}\n```\n\n## Best Practices\n\n1. **Use the Wizard**: For most cases, `mplx cm create --wizard` provides the best experience with validation and progress tracking\n\n2. **Test on Devnet**: Always test configurations on devnet before mainnet deployment\n\n3. **Set At Least One Guard**: A candy machine without guards may not function properly\n\n4. **Use Unique Mint Limit IDs**: When using multiple groups, use different `id` values for `mintLimit` guards to prevent conflicts\n\n5. **Validate Assets**: Run `mplx cm validate` before inserting items to ensure all uploads succeeded\n\n6. **Keep Cache Files**: The `asset-cache.json` and `cm-config.json` files are needed for future operations\n\n7. **Monitor Progress**: The wizard and upload commands provide detailed progress — watch for errors\n\n8. **Plan Phase Timing**: When using guard groups, ensure start/end dates don't overlap unintentionally\n\n## Troubleshooting\n\n| Issue | Solution |\n|-------|----------|\n| \"Not in Candy Machine Directory\" | Ensure you're in a directory with `assets/` folder |\n| \"Asset Cache Not Found\" | Run `mplx cm upload` first |\n| \"Missing Candy Machine ID\" | Run `mplx cm create` first |\n| \"All Items Already Loaded\" | Use the reload option when prompted |\n| \"Collection Name Missing\" | Ensure `collection.json` has a valid `name` field |\n| \"Directory Already Exists\" | Choose different name or confirm overwrite |\n\n## Related Documentation\n\n- [Guard Documentation](./guards.md) — Complete reference for all guard types\n- [Guard Groups Documentation](./groups.md] — Detailed guide to phased minting\n- [Metaplex Documentation](https://developers.metaplex.com)","other-docs":"# Other — docs\n\n# Metaplex CLI Documentation Module\n\nThis module contains the user-facing documentation for the `mplx` CLI tool, a command-line interface for interacting with the Solana blockchain using the Metaplex protocol. The documentation covers three primary command groups: configuration management, Core asset operations, and utility functions.\n\n## Overview\n\nThe `mplx` CLI provides a unified interface for:\n\n- **Configuration** — Managing RPC endpoints, wallets, and explorer preferences\n- **Core Operations** — Creating and managing digital assets and collections\n- **Toolbox Utilities** — Common operation
